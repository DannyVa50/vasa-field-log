        const sm=blankSample(prev?prev.boring:""); sm.time=nowHM();
        if(prev){ sm.soil=[...prev.soil]; sm.color=[...prev.color]; }
        sm.auto.push(...["boring","time","soil","color"].filter(k=>String(sm[k])!==""));
        if(sm.boring) sm.name=autoName(sm);
        S.samples.push(sm); logChange("הוספת דגימה","",`שורה ${S.samples.length}`,"add."+sm.id); save();
      }},"הוסף דגימה"),
      S.samples.length>1?el("button",{class:"btn ghost",disabled:RO(),onclick:()=>{
        const sm=S.samples[S.samples.length-1];
        logChange("מחיקת דגימה",sm.name||`שורה ${S.samples.length}`,"","del."+sm.id);
        S.samples.pop(); save();
      }},"מחק אחרונה"):null,
      el("span",{class:"spacer"}),
      el("span",{class:"pill"},`${S.samples.length} דגימות`),
      el("span",{class:"pill"},`${cocRows().length} למשמורת`),
      el("span",{class:"pill"},`${splitRows().length} לפיצול`))));

  const hots=S.samples.filter(s=>parseFloat(s.pid)>=PID_HOT);
  if(hots.length) v.append(el("div",{class:"card"},
    el("div",{class:"note warn"},el("b",{},`${hots.length} דגימות מעל ${PID_HOT} חל״מ. `),
      "שקול לשלוח ל-VOC ולדגום מטר מעל ומטר מתחת לתיחום הזיהום — סעיף 3.3. ",
      el("span",{class:"mono"},hots.map(s=>s.name||"—").join(" · ")))));
  const cc=soilCoordsCard(); if(cc) v.append(cc);
  v.append(borePhotosCard());

  v.append(el("div",{class:"card"},
    el("h2",{},"סיום יום העבודה"),
    el("div",{class:"sub"},"למלא בתום הדיגום"),
    el("div",{class:"grid"},
      field("שעת סיום", txt(S.head.finish,x=>setHead("finish",x,"שעת סיום"),{type:"time"})),
      field("טמפ׳ סוף יום", txt(S.head.tEnd,x=>setHead("tEnd",x,"טמפ׳ סיום"),{type:"number",ph:"°C"}))),
    el("div",{class:"grid wide",style:"margin-top:16px"},
      field("הערות", area(S.head.notesLog,x=>setHead("notesLog",x,"הערות יומן שדה")),"מודפס בשורת ״הערות״ בתחתית טופס 57"))));
  return v;
}

/* ============ custody — shared renderer for main and split ============ */
/* שורה שנוספה עכשיו (שורה חופשית או חזרה) — מודגשת אחרי הבנייה מחדש, כדי שהדוגם יראה אותה ויבחר אנליזות */
let freshRow="";

/* ערך בשורת משמורת: לדגימה מהיומן — לשדות שלה (במשמורת הראשית ההערה היא cocNote), ולשורה שנוספה — לשורה עצמה */
function setRow(r,k,v,label,isSplit){
  if(r.x) setExtra(r.x,k,v,label,isSplit);
  else if(isSplit) setSplit(r.src,k,v,label);
  else if(k==="note") setSample(r.src,"cocNote",v,"הערות משמורת");
  else setSample(r.src,k,v,label);
}

function addRow(isSplit){
  const e=blankExtra(); e.time=nowHM(); e.auto.push("time");
  extras(isSplit).push(e); freshRow=e.id;
  logChange(`${isSplit?"פיצול — ":""}הוספת שורה למשמורת`,"",`שורה ${custodyRows(isSplit).length}`,"add."+e.id);
  save();
}
/* חזרה: שורה חדשה מתחת לשורה שנבחרה, עם כל הנתונים שלה מלבד האנליזות, ו"חזרה" אחרי מס׳ הדגימה */
function duplicateRow(r,isSplit){
  const e=blankExtra(), b=r.bag;
  Object.assign(e,{dup:true, after:r.id, name:`${(r.name||"").trim()} חזרה`.trim(), depth:r.depth, time:r.time, pid:r.pid,
    dayLetter:r.dayLetter, tool:b.tool, packs:b.packs, stype:b.stype, note:r.note, tests:[]});
  e.auto=["name","depth","time","pid","dayLetter","tool","packs","stype","note"].filter(k=>String(e[k]??"")!=="");
  extras(isSplit).push(e); freshRow=e.id;
  logChange(`${isSplit?"פיצול — ":""}חזרה ל-${r.name||"דגימה"}`,"",e.name,"add."+e.id);
  save();
}
/* חלונית אישור בתוך האפליקציה. לא confirm() של הדפדפן: בחלק מהסביבות הוא חסום ומחזיר "ביטול" מיד,
   והפעולה נעצרת בלי שום הודעה */
function askYes(title,text,yes,onYes,danger){
  const close=()=>m.remove();
  const m=el("div",{class:"modal",role:"dialog","aria-modal":"true",onclick:e=>{ if(e.target===m) close(); }},
    el("div",{class:"card"},
      el("h2",{},title),
      el("div",{class:"sub"},text),
      el("div",{class:"bar"},
        el("button",{class:danger?"btn warnb":"btn",type:"button",onclick:()=>{ close(); onYes(); }},yes),
        el("span",{class:"spacer"}),
        el("button",{class:"btn ghost",type:"button",onclick:close},"ביטול"))));
  document.body.append(m);
}
/* שורה ריקה: אין בה שום ערך שהדוגם הזין. השעה ממולאת מעצמה בהוספה, וסוג הדגימה הוא ברירת מחדל */
const ROW_DEFAULT = {tool:"צנצנת", packs:"1"};
const rowHasData = e => e.tests.length>0 ||
  ["name","depth","pid","tool","packs","note"].some(k=>String(e[k]??"").trim()!=="" &&
    !(e.auto.includes(k) && e[k]===ROW_DEFAULT[k]));
function deleteRow(r,isSplit){
  const data=rowHasData(r.x);
  askYes("למחוק את השורה?", `השורה ${r.name||"ללא שם"} תימחק משרשרת המשמורת.`+
    (data?" המחיקה נרשמת בתיעוד השינויים.":""),
    "כן, למחוק", ()=>{
      const list=extras(isSplit), i=list.indexOf(r.x);
      if(i<0) return;
      if(data) logChange(`${isSplit?"פיצול — ":""}מחיקת שורה ממשמורת`, r.name||"שורה ללא שם", "", "del."+r.x.id);
      list.splice(i,1); save();
    }, true);
}

/* "האם לבצע חזרה?" — אחרי לחיצה ארוכה על שורה */
function askDuplicate(r,isSplit){
  askYes("האם לבצע חזרה?", `תיפתח שורה חדשה מתחת ל-${r.name||"שורה זו"}, עם ״חזרה״ בזיהוי הדגימה. `+
    "כל הנתונים מועתקים מלבד האנליזות — יש לבחור אותן לדגימת החזרה.",
    "כן, לבצע חזרה", ()=>duplicateRow(r,isSplit));
}

/* לחיצה ארוכה: 3 שניות על השורה, לא על שדה או כפתור. תזוזה של האצבע (גלילה) מבטלת */
const LONG_MS=3000;
function longPress(tr,fn){
  let t=null, x0=0, y0=0;
  const stop=()=>{ clearTimeout(t); t=null; tr.classList.remove("pressing"); };
  tr.addEventListener("pointerdown",e=>{
    if(RO() || e.button>0 || e.target.closest("input,select,button,textarea,a")) return;
    x0=e.clientX; y0=e.clientY; tr.classList.add("pressing");
    t=setTimeout(()=>{ stop(); fn(); },LONG_MS);
  });
  tr.addEventListener("pointermove",e=>{ if(t && Math.hypot(e.clientX-x0,e.clientY-y0)>12) stop(); });
  for(const ev of ["pointerup","pointercancel","pointerleave"]) tr.addEventListener(ev,stop);
  tr.addEventListener("contextmenu",e=>e.preventDefault());
}

function custodyView(kind){
  const isSplit = kind==="split";
  const rows = custodyRows(isSplit);
  const v=el("div",{}), tb=el("tbody",{}), tests=allTests();
  let fresh=null;

  rows.forEach((r,i)=>{
    const b=r.bag, set=(k,val,label)=>setRow(r,k,val,label,isSplit);
    const setT = t=>set("tests", b.tests.includes(t)?b.tests.filter(x=>x!==t):[...b.tests,t], "בדיקות נדרשות");
    /* דגימה מהיומן: זיהוי, עומק, שעה ו-PID מגיעים מהיומן ונערכים שם. שורה שנוספה במשמורת — נערכת כאן */
    const own=(k,label,opts)=>r.x ? txt(r[k],x=>set(k,x,label),opts) : (r[k]||"—");
    const tr=el("tr",{class:[r.x?"xrow":"", r.dup?"":"lp", r.id===freshRow?"fresh":"", vocInLiner(b)?"hot":""].filter(Boolean).join(" ")},
      el("td",{class:"rownum"}, String(i+1),
        r.x?el("button",{class:"rowdel",type:"button",title:"מחיקת השורה",disabled:RO(),onclick:()=>deleteRow(r,isSplit)},"✕"):null),
      el("td",{class:"mono w-xs"}, sel(r.dayLetter||S.head.dayLetter,DAYS,x=>set("dayLetter",x,"אות יום"),"")),
      el("td",{class:"mono w-m"}, own("name","זיהוי דגימה")),
      el("td",{class:"mono w-s"}, own("depth","עומק",{type:"number",ph:"מ׳"})),
      el("td",{class:"mono w-s"}, own("time","שעת דיגום",{type:"time"})),
      el("td",{class:"w-m"}, sel(b.tool,TOOL,x=>set("tool",x,"כלי דיגום"))),
      el("td",{class:"w-xs"}, sel(b.packs,PACKS,x=>set("packs",x,"מספר אריזות"))),
      el("td",{class:"w-m"}, sel(b.stype,STYPE,x=>set("stype",x,"סוג דגימה"))),
      ...tests.map(t=>el("td",{class:"tickcell"},el("button",{class:"tick",type:"button",disabled:RO(),
        "aria-pressed":String(b.tests.includes(t)),title:t,onclick:()=>setT(t)},"✓"))),
      el("td",{class:"mono w-s"}, own("pid","PID",{type:"number"})),
      el("td",{class:"w-xl"}, txt(r.note,x=>set("note",x,"הערות"))));
    /* חזרה נעשית מדגימה, לא מחזרה */
    if(!r.dup) longPress(tr,()=>askDuplicate(r,isSplit));
    if(r.id===freshRow) fresh=tr;
    tb.append(tr);
  });
  if(fresh) requestAnimationFrame(()=>{ fresh.scrollIntoView({block:"nearest"}); });

  v.append(el("div",{class:"card"},
    el("h2",{},isSplit?"שרשרת משמורת — פיצול":"שרשרת משמורת"),
    el("div",{class:"sub"},(isSplit
      ? "טופס 33.1 למעבדה המשנית · הדגימות מגיעות מעמודת ״משמורת פיצול״ ביומן השדה. "
      : "טופס 33.1 · הדגימות מגיעות מיומן השדה. עומק, שעה ו-PID עוברים אוטומטית. ")+
      "״הוסף שורה״ — שורה למילוי חופשי. חזרה: לחיצה ארוכה (3 שניות) על שורה"),
    el("div",{class:"grid wide",style:"margin-bottom:14px"},
      labPicker(isSplit?"labSplit":"lab",isSplit?"מעבדה משנית":"מעבדה"),
      field("הערות", area(isSplit?S.head.notesSplit:S.head.notesCoc,
          x=>setHead(isSplit?"notesSplit":"notesCoc",x,isSplit?"הערות משמורת פיצול":"הערות משמורת")),
        "מודפס בשורת ״הערות״ בתחתית טופס 33.1, אחרי החריגות")),
    rows.length?el("div",{class:"scroll"},
      el("table",{},el("thead",{},el("tr",{},
        el("th",{},"#"),el("th",{},"אות יום"),el("th",{},"זיהוי דגימה"),el("th",{},"עומק"),el("th",{},"שעת דיגום"),
        el("th",{},"כלי דיגום"),el("th",{},"אריזות"),el("th",{},"סוג"),
        ...tests.map(t=>el("th",{class:"vt"},t)),
        el("th",{},"PID"), el("th",{},"הערות"))),tb))
      :el("div",{class:"empty"},isSplit
        ? "סמן דגימות בעמודת ״משמורת פיצול״ ביומן השדה, או הוסף שורה."
        : "סמן דגימות בעמודת ״משמורת״ ביומן השדה, או הוסף שורה."),
    el("div",{class:"bar"},
      el("button",{class:"btn",type:"button",disabled:RO(),onclick:()=>addRow(isSplit)},"הוסף שורה"),
      el("span",{class:"pill"},`${rows.length} דגימות`),
      el("span",{class:"pill"},`${rows.reduce((a,r)=>a+r.bag.tests.length,0)} אנליזות`),
      el("span",{class:"spacer"}),
      el("button",{class:"btn ghost",onclick:()=>makePdf(isSplit?"split":"coc")},
        isSplit?"PDF משמורת פיצול":"PDF שרשרת משמורת"))));
  freshRow="";

  /* אזהרה בראש הלשונית — אינה חוסמת */
  const vocLiner=rows.filter(r=>vocInLiner(r.bag));
  if(vocLiner.length) v.prepend(el("div",{class:"card"},
    el("div",{class:"note bad"},el("b",{},"VOC / TPH GRO נבחר עם ליינר. "),
      "יש לדגום VOC ו-TPH GRO בצנצנת + ויילים, לא בליינר. ",
      el("span",{class:"mono"},vocLiner.map(r=>r.name||"—").join(" · ")))));

  v.append(el("div",{class:"card"},
    el("h2",{},"עמודות אנליזה פתוחות"),
    el("div",{class:"sub"},"שמונה העמודות הראשונות קבועות בטופס 33.1. כאן אפשר להוסיף עד ארבע נוספות — הן יופיעו בעמודות הריקות של שני טפסי המשמורת"),
    el("div",{class:"grid"},
      ...S.head.extraTests.map((t,i)=>field(`עמודה ${i+1}`,
        txt(t,x=>{ const arr=[...S.head.extraTests]; arr[i]=x; setHead("extraTests",arr,`עמודת אנליזה ${i+1}`); },
          {ph:"שם האנליזה"}))))));

  if(!isSplit && rows.length){
    const q=qcNeeded(), ok=q.haveDup>=q.dup && q.haveSpl>=q.spl && !q.badDup.length;
    const missing=[q.haveDup<q.dup&&"חזרות", q.haveSpl<q.spl&&"פיצולים"].filter(Boolean).join(" ו");
    v.append(el("div",{class:"card"},
      el("h2",{},"בקרות איכות"),
      el("div",{class:"sub"},"הערה בסוף העבודה — אינה חוסמת"),
      el("div",{class:ok?"note":"note warn"},
        missing?el("b",{},`חסרים ${missing}. `):null,
        `לפי ${q.n} דגימות נדרשות ${q.dup} חזרות ו-${q.spl} פיצולים (סומנו ${q.haveDup} חזרות ו-${q.haveSpl} פיצולים). `,
        "חזרה — לחיצה ארוכה על שורה. פיצול — עמודת ״פיצול״ ביומן השדה. חזרה ופיצול אינם נשלחים ל-VOC ול-TPH GRO.",
        q.badDup.length?el("div",{style:"margin-top:6px"},el("b",{},"לבדוק: "),
          `${q.badDup.map(r=>r.name||"חזרה").join(", ")} — סומנו ל-VOC או ל-TPH GRO.`):null)));
  }
  return v;
}

/* ============ handover ============ */
/* שרשרת המשמורת והפיצול נמסרות לשתי מעבדות שונות — לכל אחת מסירה, קבלה וחתימות משלה.
   התוויות והמפתחות של המשמורת הראשית הם אלה מהגרסאות הקודמות, כדי שתיעוד השינויים יישאר רציף */
const HAND={
  coc:  {ho:()=>S.handover,      key:"ho.", pre:"",        by:"by",      lab:"lab",      labKey:"lab",
         labLabel:"מעבדה"},
  split:{ho:()=>S.handoverSplit, key:"hs.", pre:"פיצול — ", by:"bySplit", lab:"labSplit", labKey:"labSplit",
         labLabel:"מעבדה משנית"}};
/* הרשומה שלמה כשכל מעבדה שקיבלה דגימות חתמה ונרשם שם הנציג */
const labSigned = kind => { const H=HAND[kind]; return !!(S.sigs[H.lab] && H.ho().labName); };
const pendingLabs = () => [!labSigned("coc") && "חתימת המעבדה",
  hasSplit() && !labSigned("split") && "חתימת מעבדת הפיצול"].filter(Boolean);

/* סיום האחסון הוא ברירת המחדל למסירה ולקבלה במעבדה. שדה שמולא ידנית בערך אחר אינו נדרס */
const HAND_FROM_STORAGE={
  toD:[["byDate","תאריך מסירה"],["labDate","תאריך קבלה"]],
  toT:[["byTime","שעת מסירה"],["labTime","שעת קבלה"]]};
function storageEnd(k,v){
  const st=S.storage, old=st[k];
  setSub(st,k,v,k==="toD"?"סיום אחסון":"שעת סיום אחסון","st."+k);
  for(const kind of hasSplit()?["coc","split"]:["coc"]){
    const H=HAND[kind], ho=H.ho();
    for(const [f,label] of HAND_FROM_STORAGE[k])
      if(!ho[f] || ho[f]===old) setSub(ho,f,v,H.pre+label,H.key+f);
  }
}

/* כרטיסי מסירה וקבלה במעבדה — למשמורת (coc) או לפיצול (split) */
function handCards(kind){
  const H=HAND[kind], ho=H.ho(), split=kind==="split";
  const fld=(label,k,logLabel,opts)=>field(label,txt(ho[k],x=>setSub(ho,k,x,H.pre+logLabel,H.key+k),opts));
  return [
    el("div",{class:"card"},
      el("h2",{},split?"מסירה — משמורת פיצול":"מסירה"),
      el("div",{class:"sub"},split
        ? "הפיצולים נמסרים למעבדה המשנית בנפרד מהמשמורת"
        : "ייתכן שהמסירה תתבצע על ידי הפקידה במשרד לשליח המעבדה"),
      el("div",{class:"grid"},
        fld("נמסר ע״י","byName","נמסר ע״י",{ph:"שם מלא"}),
        fld("תאריך","byDate","תאריך מסירה",{type:"date"}),
        fld("שעה","byTime","שעת מסירה",{type:"time"})),
      el("div",{style:"margin-top:14px;max-width:420px"}, pad(H.by,split?"חתימת המוסר — פיצול":"חתימת המוסר",S.sigs))),
    el("div",{class:"card"},
      el("h2",{},split?"קבלה במעבדה — משמורת פיצול":"קבלה במעבדה"),
      el("div",{class:"sub"},split
        ? "נציג המעבדה המשנית, שאליה נשלחו הפיצולים, חותם כאן"
        : "נציג המעבדה חותם כאן — באתר או במשרד בעת איסוף הדגימות"),
      el("div",{class:"grid"},
        labPicker(H.labKey,H.labLabel),
        fld("התקבל במעבדה ע״י","labName","התקבל במעבדה ע״י",{ph:"שם נציג המעבדה"}),
        fld("תאריך","labDate","תאריך קבלה",{type:"date"}),
        fld("שעה","labTime","שעת קבלה",{type:"time"})),
      el("div",{style:"margin-top:14px;max-width:420px"},
        pad(H.lab,split?"חתימת נציג מעבדת הפיצול":"חתימת נציג המעבדה",S.sigs)))];
}

/* 72 שעות מסיום הדיגום (השעה המאוחרת בבארות ובבלאנקים) ועד הקבלה במעבדה — לכל מעבדה שקיבלה קניסטרים */
const GAS_HOURS=72;
function gasEnd(){
  const o=S.gas.samp, ends=[...S.gas.wells, ...S.gas.blanks].map(r=>r.sEnd).filter(Boolean).sort();
  return o.date && ends.length ? new Date(`${o.date}T${ends[ends.length-1]}`) : null;
}
function gasDeadline(){
  const end=gasEnd(); if(!end) return [];
  const due=new Date(end.getTime()+GAS_HOURS*3.6e6), out=[];
  out.push(el("div",{class:"sub",style:"margin:12px 0 0"},`סיום הדיגום ${whenShort(end.toISOString())} — למסור עד ${whenShort(due.toISOString())}`));
  for(const kind of hasSplit()?["coc","split"]:["coc"]){
    const ho=HAND[kind].ho();
    if(!ho.labDate || !ho.labTime) continue;
    const got=new Date(`${ho.labDate}T${ho.labTime}`), h=(got-end)/3.6e6;
    if(h>GAS_HOURS) out.push(el("div",{class:"note warn",style:"margin-top:10px"},
      el("b",{},`${HAND[kind].pre}התקבל במעבדה אחרי ${h.toFixed(0)} שעות. `),`מעל ${GAS_HOURS} שעות מסיום הדיגום — יש לתעד כחריגה.`));
  }
  return out;
}

const KIND_NAME={log:"יומן שדה", coc:"שרשרת משמורת", split:"שרשרת משמורת פיצול", xlsx:"נתוני דיגום",

   כל הקואורדינטות בנקודות PDF, כפי שנמדדו מהייצוא: [x0,x1,y0,y1], x משמאל, y מלמעלה.

const loadImg=src=>new Promise(res=>{
  if(!src) return res(null);
  const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src;
});
/* חתימה ושרטוט נשמרים בצבע הטקסט של המסך — כאן הם נצבעים בשחור לדף הלבן */
function inked(img){
  const c=document.createElement("canvas"); c.width=img.naturalWidth; c.height=img.naturalHeight;
  const g=c.getContext("2d"); g.drawImage(img,0,0);
  g.globalCompositeOperation="source-in"; g.fillStyle="#000"; g.fillRect(0,0,c.width,c.height);
  return c;
}
function wrapText(g,text,width){
  const out=[];
  for(const para of String(text).split("\n")){
    let line="";
    for(const w of para.split(/\s+/).filter(Boolean)){
      const t=line?line+" "+w:w;
      if(!line || g.measureText(t).width<=width) line=t; else { out.push(line); line=w; }
    }
    if(line) out.push(line);
  }
  return out;
}

/* עמוד טופס ריק בגודל המקורי, וההקשר מכויל לנקודות PDF */
async function formPage(F,idx){
  const im=await loadImg(FORM_PAGES[F.key][idx]);
  if(!im) throw new Error("תבנית הטופס לא נטענה");
  const c=document.createElement("canvas"); c.width=im.naturalWidth; c.height=im.naturalHeight;
  const g=c.getContext("2d"); g.drawImage(im,0,0);
  const k=c.width/F.w; g.scale(k,k);
  g.fillStyle="#000"; g.strokeStyle="#000"; g.direction="rtl"; g.textBaseline="middle";
  return {c,g,w:F.w,h:F.h};
}
const fnt=(size,bold)=>`${bold?700:400} ${size}px ${PFONT}`;
/* כותב ערך לתיבה: מקטין עד שנכנס, ואם לא — שובר לשתי שורות */
function put(g,text,box,o={}){
  text=jv(text).trim(); if(!text) return;
  const [x0,x1,y0,y1]=box, w=x1-x0-2, h=y1-y0, min=o.min||5;
  let size=o.size||8.5, lines=[text];
  for(;;){
    g.font=fnt(size,o.bold);
    if(g.measureText(text).width<=w){ lines=[text]; break; }
    const wr=wrapText(g,text,w);
    if(wr.length*size*1.12<=h && wr.every(l=>g.measureText(l).width<=w)){ lines=wr; break; }
    if(size<=min){ lines=wr; break; }
    size=Math.max(min,size-.25);
  }
  g.save(); g.beginPath(); g.rect(x0,y0,x1-x0,h); g.clip();
  g.textAlign=o.align==="center"?"center":"right";
  /* ltr — ערך באנגלית ומספרים (למשל "11.7 eV"): בכיוון מימין לשמאל סדר המילים מתהפך */
  if(o.ltr) g.direction="ltr";
  const x=o.align==="center"?(x0+x1)/2:x1-1, lh=size*1.12, top=(y0+y1)/2-(lines.length-1)*lh/2;
  lines.forEach((t,i)=>g.fillText(t,x,top+i*lh));
  g.restore();
}
function whiteout(g,[x0,x1,y0,y1]){ g.save(); g.fillStyle="#fff"; g.fillRect(x0,y0,x1-x0,y1-y0); g.restore(); }
/* סימון V במרכז תיבה */
function tick(g,[x0,x1,y0,y1],s){
  const cx=(x0+x1)/2, cy=(y0+y1)/2; s=s||Math.min(x1-x0,y1-y0)*.32;
  g.save(); g.lineWidth=1.15; g.lineCap="round"; g.lineJoin="round";
  g.beginPath(); g.moveTo(cx-s,cy); g.lineTo(cx-s*.25,cy+s*.8); g.lineTo(cx+s*1.05,cy-s*.95); g.stroke();
  g.restore();
}
/* עיגול סביב מילה — כן/לא, אין/יש */
function ring(g,[x0,x1,y0,y1]){
  g.save(); g.lineWidth=.8; g.beginPath();
  g.ellipse((x0+x1)/2,(y0+y1)/2,(x1-x0)/2+2.6,(y1-y0)/2+.6,0,0,Math.PI*2); g.stroke();
  g.restore();
}
async function sign(g,src,[x0,x1,y0,y1]){
  const im=await loadImg(src); if(!im) return;
  const ink=inked(im), sc=Math.min((x1-x0-2)/ink.width,(y1-y0-1)/ink.height);
  const w=ink.width*sc, h=ink.height*sc;
  g.drawImage(ink,x1-1-w,(y0+y1)/2-h/2,w,h);
}
/* הערות זורמות לשורות הפנויות: קודם בעמוד הראשון, והיתרה בעמוד האחרון.
   מחזיר כמה מילים לא נכנסו; dry — מדידה בלבד, בלי לכתוב */
const MCTX=document.createElement("canvas").getContext("2d");
function flowNotes(slots,text,dry=false,size=7.5){
  const words=String(text||"").split(/\s+/).filter(Boolean);
  for(const {g,box:[x0,x1,y0,y1]} of slots){
    if(!words.length) break;
    const c=dry?MCTX:g;
    c.font=fnt(size); c.textAlign="right";
    let line=words.shift();
    while(words.length && c.measureText(line+" "+words[0]).width<=x1-x0-2) line+=" "+words.shift();
    if(!dry) c.fillText(line,x1-1,(y0+y1)/2);
  }
  return words.length;
}
/* כמה עמודים: לפי מספר השורות; עמוד יחיד שההערות לא נכנסות בו מקבל עמוד המשך */
function pageCount(F,rows,notes){
  const n=1+Math.ceil(Math.max(0,rows-F.per[0])/F.per[1]);
  return n===1 && flowNotes(F.notes.only.map(box=>({box})),notes,true) ? 2 : n;
}
function writeNotes(F,pages,n,notes){
  const slots = n===1 ? F.notes.only.map(box=>({g:pages[0].g,box}))
    : [...F.notes.first.map(box=>({g:pages[0].g,box})), ...F.notes.last.map(box=>({g:pages[n-1].g,box}))];
  flowNotes(slots,notes);
}
/* מספור עמודים: הסך הכול נכתב בכל עמוד; מעמוד 3 הספרה המודפסת "2" מוחלפת */
function pageMarks(F,g,p,n,start){
  put(g,String(n),F.total,{align:"center",size:12});
  if(p<2) return;
  /* תיבת הספרה צרה מרוחב הספרה, ולכן נכתבת ישירות ולא דרך put שמקטין */
  const [px0,px1,py0,py1]=F.pageNo;
  whiteout(g,F.pageNo); g.font=fnt(12); g.textAlign="center"; g.fillText(String(p+1),(px0+px1)/2,(py0+py1)/2);
  /* מספרי השורות הקטנים בשולי הטבלה */
  const [mx0,mx1]=F.marks.x;
  F.marks.ys.forEach((y,i)=>{
    whiteout(g,[mx0-.2,mx1,y+.55,y+4.4]);
    g.font=fnt(4,F.key==="33.1"); g.textAlign="right"; g.textBaseline="alphabetic";
    g.fillText(String(start+10*(i+1)),mx1,y+3.6); g.textBaseline="middle";
  });
}
const pageStart=(F,p)=>p?F.per[0]+(p-1)*F.per[1]:0;
const rowBox=(F,p,i,[x0,x1])=>{
  const [t,b]=F.rows[p?1:0], rh=(b-t)/F.per[p?1:0];
  return [x0,x1,t+i*rh+.5,t+(i+1)*rh-.5];
};

/* עמוד השרטוט: עמוד המשך של טופס 57 — כותרת, אתר ותאריך, כותרת תחתונה ומספור — והשרטוט במקום הטבלה */

async function renderCoc(isSplit){

  const n=pageCount(F,rows.length,notes);
  const testBox=i=>[F.testEdges[i+1]+.5,F.testEdges[i]-.5];

      yn(h.subDrill,F.yesNo.subDrill); yn(h.subSample,F.yesNo.subSample);
      ring(g,S.deviations.length?F.dev.some:F.dev.none);

    put(g,o.s1,H.s1); await sign(g,S.sigs.gi,H.s1sig); put(g,h.client,H.client); put(g,h.contact,H.contact);
    put(g,o.boreDia,H.boreDia); put(g,o.method===OTHER?o.methodOther:o.method,H.method);
    put(g,o.tubeType,H.tubeType); put(g,o.tubeDia,H.tubeDia); put(g,o.probe,H.probe);
    put(g,o.pid,H.pid); put(g,o.lamp,H.lamp,{ltr:true}); put(g,o.pidOpen,H.pidOpen);
    if(o.calLab) tick(g,H.calLab); if(o.cal100) tick(g,H.cal100);
    rows.slice(start,start+per).forEach((w,i)=>{
      const box=j=>rowBox(F,p,i,F.cols[j]), c={size:8,align:"center"};
      put(g,w.name,box(0),c); put(g,w.tEnd,box(1),c); put(g,w.tStart,box(2),c);
      put(g,w.pidHole,box(3),c); put(g,w.perm,box(4),c);
      if(w.sand) tick(g,box(5),3.4); if(w.bentGran) tick(g,box(6),3.4); if(w.bentWet) tick(g,box(7),3.4);
      /* עמודת המלט (8) נשארת ריקה */
      put(g,w.depth,box(9),c); put(g,w.profile,box(10),{size:7.5}); put(g,w.note,box(11),{size:7.5});
    });
  }
  flowNotes(F.notes.map(box=>({g:pages[n-1].g,box})),o.notes);
  return pages;
}

/* ---------- טופס 59 ---------- */
/* שורות טופס 59: כל הבארות ואחריהן הבלאנקים. בפיצול — הבארות שסומנו לפיצול, עם קניסטר הפיצול */
function gasCustodyRows(isSplit){
  const g=S.gas;
  const well=w=>({well:w, name:w.name, depth:w.depth, vacFrom:w.vacFrom, vacTo:w.vacTo, flow:w.flow, purgeMin:w.purgeMin, vols:wellVols(w),
    pidAfter:w.pidAfter, ipa:w.ipa, sStart:w.sStart, sEnd:w.sEnd, to15:w.to15,
    ...(isSplit ? {can:w.spCan, vol:w.spVol, canFrom:w.spCanFrom, canTo:w.spCanTo, note:w.sNote}
                : {can:w.can, vol:w.vol, canFrom:w.canFrom, canTo:w.canTo, note:[w.dup?"חזרה":"",w.sNote].filter(Boolean).join(" · ")})});
  if(isSplit) return g.wells.filter(w=>w.split).map(well);
  return [...g.wells.map(well), ...g.blanks.map(b=>({name:b.name, can:b.can, vol:b.vol, sStart:b.sStart, sEnd:b.sEnd,
    canFrom:b.canFrom, canTo:b.canTo, to15:b.to15, note:[BLANK_LABEL[b.type],b.note].filter(Boolean).join(" · ")}))];
}
const gasInstDate = () => S.gas.mode==="manual" ? S.gas.samp.instDate : S.gas.inst.date;
const gasTube = () => S.gas.mode==="manual" ? S.gas.samp.tube
  : [S.gas.inst.tubeType,S.gas.inst.tubeDia].map(x=>String(x||"").trim()).filter(Boolean).join(" ");
async function renderGasCoc(isSplit){
  const F=F59, h=S.head, g=S.gas, o=g.samp, rows=gasCustodyRows(isSplit), per=F.per[0], H=F.head;
  const HK=HAND[isSplit?"split":"coc"], ho=HK.ho(), pages=[];
  const n=Math.max(1,Math.ceil(rows.length/per)), pv=purgeVolsForm();
  const sup=o.canSupplier===OTHER?o.canSupplierOther:o.canSupplier;
  for(let p=0;p<n;p++){
    const pg=await formPage(F,0), gg=pg.g, start=p*per;
    pages.push(pg);
    put(gg,String(n),F.total,{align:"center",size:12});
    if(p){
      const [x0,x1,y0,y1]=F.pageNo;
      whiteout(gg,F.pageNo); gg.font=fnt(12); gg.textAlign="center"; gg.fillText(String(p+1),(x0+x1)/2,(y0+y1)/2);
      const [mx0,mx1,my0,my1]=F.mark;
      whiteout(gg,F.mark); gg.font=fnt(4); gg.textAlign="right"; gg.fillText(String(start+per),mx1-.3,(my0+my1)/2);
    }
    if(p<n-1) whiteout(gg,F.endMark);
    if(!h.accredited) whiteout(gg,F.isrc);
    put(gg,h.site,H.site); put(gg,h.address,H.address); put(gg,fmtFull(o.date),H.date); put(gg,h.billTo,H.billTo);
    put(gg,o.s1,H.s1); await sign(gg,S.sigs.gs,H.s1sig); put(gg,h.approver,H.approver);
    put(gg,h.client,H.client); put(gg,h.contact,H.contact);
    put(gg,fmtFull(gasInstDate()),H.instDate); put(gg,gasTube(),H.tube); put(gg,pv.text,H.purgeVols);
    put(gg,sup,H.canSupplier); put(gg,fmtFull(o.canDate),H.canDate);
    put(gg,o.pid,H.pid); put(gg,o.lamp,H.lamp,{ltr:true}); put(gg,o.weather,H.weather);
    if(o.calLab) tick(gg,H.calLab); if(o.cal100) tick(gg,H.cal100);
    if(!isSplit){
      if(g.wells.some(w=>w.dup)) tick(gg,F.qc.dup);
      if(g.blanks.some(b=>b.type==="EB")) tick(gg,F.qc.EB);
      if(g.blanks.some(b=>b.type==="AB")) tick(gg,F.qc.AB);
    }
    if(o.deviation==="אין") ring(gg,F.dev.none); else if(o.deviation==="יש") ring(gg,F.dev.some);
    /* הדיגום לפי הנחיות המשרד — תמיד; התוכנית המאושרת — לפי הסימון בפרטי הסקר */
    [true,h.planDeclared,h.planShown].forEach((on,i)=>{ if(on) tick(gg,[...F.boxes.x,...F.boxes.ys[i]]); });
    const D=F.hand;
    put(gg,ho.byName,D.byName,{size:7.5}); await sign(gg,S.sigs[HK.by],D.bySig);
    put(gg,fmtFull(ho.byDate),D.byDate,{size:7.5}); put(gg,ho.byTime,D.byTime,{size:7.5});
    put(gg,ho.labName,D.labName,{size:7.5}); await sign(gg,S.sigs[HK.lab],D.labSig);
    put(gg,fmtFull(ho.labDate),D.labDate,{size:7.5}); put(gg,ho.labTime,D.labTime,{size:7.5});
    rows.slice(start,start+per).forEach((r,i)=>{
      const box=j=>rowBox(F,p,i,F.cols[j]), c={size:8,align:"center"};
      [r.name,r.can,r.vol,r.depth,r.vacFrom,r.vacTo,r.flow,r.purgeMin,r.pidAfter].forEach((v,j)=>put(gg,v,box(j),c));
      if(r.ipa) tick(gg,box(9),3.4);
      put(gg,r.sStart,box(10),c); put(gg,r.sEnd,box(11),c); put(gg,r.canFrom,box(12),{...c,ltr:true}); put(gg,r.canTo,box(13),{...c,ltr:true});
      if(r.to15) tick(gg,box(14),3.4);
      put(gg,[pv.mixed&&r.vols?`${r.vols} נפחי שטיפה`:"",r.note].filter(Boolean).join(" · "),box(15),{size:7});
    });
  }
  const notes=[isSplit?"משמורת פיצול.":"", isSplit&&labName("labSplit")?`מעבדה משנית: ${labName("labSplit")}.`:"",
    isSplit?o.notesSplit:o.notes].filter(Boolean).join(" ");
  flowNotes(F.notes.map(box=>({g:pages[n-1].g,box})),notes);
  return pages;
}

async function canvasJpeg(c){
  const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.9));
  return new Uint8Array(await b.arrayBuffer());
}
/* PDF מינימלי: עמוד לכל תמונה, התמונה (JPEG) ממלאת את הדף. pages: [{jpeg,w,h,px,py}] */
function pdfFromJpegs(pages){
  const enc=new TextEncoder(), parts=[], offs=[];
  let len=0;
  const put=x=>{ const b=typeof x==="string"?enc.encode(x):x; parts.push(b); len+=b.length; };
  const obj=(num,body)=>{ offs[num]=len; put(`${num} 0 obj\n`); body(); put("\nendobj\n"); };
  const n=pages.length, total=3+3*n;
  put("%PDF-1.4\n%âãÏÓ\n");
  obj(1,()=>put("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2,()=>put(`<< /Type /Pages /Count ${n} /Kids [${pages.map((_,i)=>`${3+3*i} 0 R`).join(" ")}] >>`));
  pages.forEach((pg,i)=>{
    const p=3+3*i, cs=`q ${pg.w} 0 0 ${pg.h} 0 0 cm /Im0 Do Q`;
    obj(p,()=>put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pg.w} ${pg.h}] /Resources << /XObject << /Im0 ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`));
    obj(p+1,()=>put(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(p+2,()=>{
      put(`<< /Type /XObject /Subtype /Image /Width ${pg.px} /Height ${pg.py} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.jpeg.length} >>\nstream\n`);
      put(pg.jpeg); put("\nendstream");
    });
  });
  const xref=len;
  let x=`xref\n0 ${total}\n0000000000 65535 f \n`;
  for(let i=1;i<total;i++) x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  put(x+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:"application/pdf"});
}
/* יוצר את קובץ ה-PDF של טופס — משמש גם לבדיקה מחוץ לממשק */
async function buildPdf(kind){
  if(document.fonts) await document.fonts.ready;
  const pages=kind==="log"?await renderLog():kind==="inst"?await renderInst()
    :kind==="gcoc"||kind==="gsplit"?await renderGasCoc(kind==="gsplit"):await renderCoc(kind==="split"), out=[];
  for(const pg of pages) out.push({jpeg:await canvasJpeg(pg.c),w:pg.w,h:pg.h,px:pg.c.width,py:pg.c.height});
  return pdfFromJpegs(out);
}

let pdfBusy=false;
async function makePdf(kind){
  if(pdfBusy) return;
  pdfBusy=true;
  try{
    await offerFile(kind==="cert" ? await certPdf() : await buildPdf(kind), fileName(kind)+".pdf");
  }catch(e){ alert("יצירת ה-PDF נכשלה: "+((e&&e.message)||e)); }
  finally{ pdfBusy=false; }
}

/* ============ Excel ללקוח ============
   קובץ אחד ליום דיגום: פרטי היום, יומן שדה, שרשרת משמורת, ומשמורת פיצול כשיש.
   טבלאות נקיות — שורת כותרת ושורה לכל דגימה — שהיועץ מעתיק לדוחות שלו.
   נבנה כאן בלי ספריות, כדי לעבוד גם בלי קליטה: XML של Office בתוך zip לא דחוס */
const XLSX_MIME="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
const CRC_T=(()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC_T[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
/* zip בשיטת stored. התאריך הקבוע 01.01.1980 הוא המינימום בפורמט */
function zipBlob(files,type){
  const enc=new TextEncoder(), parts=[], cen=[];
  let off=0;
  for(const f of files){
    const name=enc.encode(f.name), data=enc.encode(f.data), crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true);
    h.setUint16(12,0x21,true); h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true);
    h.setUint16(26,name.length,true);
    parts.push(h,name,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true);
    c.setUint16(14,0x21,true); c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true);
    c.setUint16(28,name.length,true); c.setUint32(42,off,true);
    cen.push(c,name);
    off+=30+name.length+data.length;
  }
  const size=cen.reduce((a,x)=>a+x.byteLength,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true);
  e.setUint32(12,size,true); e.setUint32(16,off,true);
  return new Blob([...parts,...cen,e],{type});
}

const xesc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))
  .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
const colName=i=>{ let s=""; for(i++;i;i=Math.floor((i-1)/26)) s=String.fromCharCode(65+(i-1)%26)+s; return s; };
/* מספר נשמר כמספר, כדי שהיועץ יוכל לחשב ולמיין; כל השאר טקסט */
const xnum=v=>{ const t=jv(v).trim(); return /^-?\d+(\.\d+)?$/.test(t) ? Number(t) : t; };
/* סגנונות: 1 כותרת עמודה · 2 תא · 3 תא ממורכז · 4 תווית · 5 מספר · 6 שורת סה״כ (מודגש, ממורכז).
   בגיליון מימין לשמאל, יישור "לימין" מציב טקסט בימין אבל מספר בשמאל — לכן למספר יישור אוטומטי */
const XS={head:1,cell:2,mid:3,label:4,num:5,total:6};
function xcell(v,r,c,s){
  const ref=colName(c)+(r+1);
  if(v===""||v==null) return `<c r="${ref}" s="${s}"/>`;
  if(typeof v==="number") return `<c r="${ref}" s="${s===XS.cell?XS.num:s}"><v>${v}</v></c>`;
  return `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;
}
/* גיליון: rows — מערכי תאים, styles(r,c) — מספר סגנון. table — שורת כותרת קפואה וסינון.
   filterRows — כמה שורות (כולל הכותרת) בטווח הסינון, כדי ששורת הסה״כ שמתחת לטבלה לא תמוין ותסונן איתה */
const filterEnd = s => s.filterRows || s.rows.length;
function sheetXml(s){
  const {rows,widths,styles,table}=s;
  const last=colName(widths.length-1)+rows.length, fend=colName(widths.length-1)+filterEnd(s);
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
    `<dimension ref="A1:${last}"/>`+
    '<sheetViews><sheetView rightToLeft="1" workbookViewId="0">'+
      (table?'<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>':'')+'</sheetView></sheetViews>'+
    '<sheetFormatPr defaultRowHeight="15"/>'+
    '<cols>'+widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")+'</cols>'+
    '<sheetData>'+rows.map((row,r)=>`<row r="${r+1}">${row.map((v,c)=>xcell(v,r,c,styles(r,c))).join("")}</row>`).join("")+'</sheetData>'+
    (table&&filterEnd(s)>1?`<autoFilter ref="A1:${fend}"/>`:'')+
    '</worksheet>';
}
function workbookBlob(sheets){
  const ns='xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const filters=sheets.map((s,i)=>s.table&&filterEnd(s)>1
    ?`<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${xesc(s.name)}'!$A$1:$${colName(s.widths.length-1)}$${filterEnd(s)}</definedName>`:"").join("");
  const files=[
    {name:"[Content_Types].xml", data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
      sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")+
      '</Types>'},
    {name:"_rels/.rels", data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
      '</Relationships>'},
    {name:"xl/workbook.xml", data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      `<workbook ${ns}><bookViews><workbookView/></bookViews><sheets>`+
      sheets.map((s,i)=>`<sheet name="${xesc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")+
      '</sheets>'+(filters?`<definedNames>${filters}</definedNames>`:'')+'</workbook>'},
    {name:"xl/_rels/workbook.xml.rels", data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")+
      `<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`+
      '</Relationships>'},
    {name:"xl/styles.xml", data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
      '<fonts count="2"><font><sz val="10"/><name val="Arial"/><family val="2"/></font><font><b/><sz val="10"/><name val="Arial"/><family val="2"/></font></fonts>'+
      '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'+
        '<fill><patternFill patternType="solid"><fgColor rgb="FFD9D9D9"/><bgColor indexed="64"/></patternFill></fill></fills>'+
      '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>'+
        '<border><left style="thin"><color auto="1"/></left><right style="thin"><color auto="1"/></right><top style="thin"><color auto="1"/></top><bottom style="thin"><color auto="1"/></bottom><diagonal/></border></borders>'+
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
      '<cellXfs count="7"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
        '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>'+
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center" wrapText="1"/></xf>'+
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>'+
        '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>'+
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>'+
        '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>'+
      '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},
    ...sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`, data:sheetXml(s)}))
  ];
  return zipBlob(files,XLSX_MIME);
}

const TOOL_WORD={"ליינר":"שרוול","שרוול":"שרוול","צנצנת":"צנצנת"};
/* טבלת דגימות: הכותרות כמו בטופס, המספרים ממורכזים.
   totals — שורת סה״כ אחרי שורה ריקה, מחוץ לטווח הסינון */
function tableSheet(name,head,rows,widths,wide,totals){
  const filterRows=1+rows.length;
  return {name,widths,table:true,filterRows,rows:totals?[head,...rows,[],totals]:[head,...rows],
    styles:(r,c)=>r===0?XS.head:(r>filterRows?XS.total:(wide.has(c)?XS.cell:XS.mid))};
}
/* רשת ישראל החדשה (ITM, EPSG:2039) — "רשת הקורדינטות החדשה" בהנחיות סקר קרקע, סעיף 3.1.5 */
const COORD_HEAD=["X — רשת ישראל החדשה (ITM)","Y — רשת ישראל החדשה (ITM)","דיוק נ״צ (מטר)","מקור נ״צ"], COORD_W=[14,14,10,9];
const coordCells=c=>[xnum(c.x),xnum(c.y),xnum(c.acc),c.src||""];
function workbookSheets(){
  const h=S.head, st=S.storage, yn=x=>x?"כן":"לא";
  const when=(d,t)=>[fmtFull(d),t].filter(Boolean).join(" ");
  const split=hasSplit();
  /* מסירה וקבלה — למשמורת, ולפיצול כשיש (מעבדה אחרת) */
  const hand=kind=>{ const H=HAND[kind], ho=H.ho(), pre=kind==="split"?"פיצול — ":"";
    return [[pre+"נמסר ע״י",[ho.byName,when(ho.byDate,ho.byTime)].filter(Boolean).join(" · ")],
            [pre+"התקבל במעבדה ע״י",[ho.labName,when(ho.labDate,ho.labTime)].filter(Boolean).join(" · ")]]; };
  const dev=S.deviations.map((d,i)=>`${i+1}. ${[d.what,d.why,d.who&&`אישר: ${d.who}`].filter(Boolean).join(" — ")}`).join("\n");
  const details=[
    ["אתר",h.site],["כתובת",h.address],["תאריך",fmtFull(h.date)],
    ["לקוח",h.client],["נציג הלקוח",h.clientRep],["איש קשר",h.contact],["לחייב",h.billTo],
    ["דוגם 1",h.s1],["דוגם 2",h.s2],["מאשר הדו״ח",h.approver],
    ["כלי קידוח",h.rig==="אחר"?h.rigOther:h.rig],["מכשיר PID",h.pid],["PID באוויר הפתוח (ppm)",xnum(h.pidOpen)],
    ["שעת הגעה",h.arrive],["שעת סיום",h.finish],["טמפ׳ תחילת הדיגום (°C)",xnum(h.tStart)],["טמפ׳ סוף הדיגום (°C)",xnum(h.tEnd)],
    ["מזג האוויר",jv(h.weather)],["יעוד הקרקע",h.landuse],["מפלס מי תהום משוער (מ׳)",xnum(h.gwl)],
    ["עבודה בהסמכה",yn(h.accredited)],["מעבדה",labName("lab")],
    ...(split?[["מעבדה משנית (פיצול)",labName("labSplit")]]:[]),

    ["חריגות",dev||"אין"],
    ["אחסון לפני מסירה",st.place?`${st.place}, אחראי: ${st.keeper||""} · ${when(st.fromD,st.fromT)} עד ${when(st.toD,st.toT)} · ${st.tempOk||""}`:""],
    ...hand("coc"), ...(split?hand("split"):[]),
    ["הערות — יומן שדה",h.notesLog],["הערות — שרשרת משמורת",h.notesCoc],
    ...(split?[["הערות — משמורת פיצול",h.notesSplit]]:[])

     kind לכל שורה קובע את הסגנון: sec כותרת, tot סה״כ, אחרת שורת אנליזה */
  const kinds=details.map(()=>"kv");
  for(const isSplit of [false,true]){
    const rows=custodyRows(isSplit);
    if(!rows.length) continue;
    const per=tests.map(t=>rows.filter(r=>r.bag.tests.includes(t)).length), sum=per.reduce((a,b)=>a+b,0);
    details.push([],[isSplit?"אנליזות — מעבדה משנית (פיצול)":"אנליזות — מעבדה ראשית",
      labName(isSplit?"labSplit":"lab")||"לא נבחרה מעבדה"]);
    kinds.push("gap","sec");
    tests.forEach((t,i)=>{ details.push([t,per[i]]); kinds.push("an"); });

  /* נ"צ הקידוח — רק ביומן השדה (דני, 19.11.2026), ורק כשנרשם נ"צ כלשהו, כך שקובץ בלי מדידות לא משתנה.

  const logRows=S.samples.filter(s=>s.boring||s.name||s.depth);
  const bOf=s=>String(s.boring||"").trim(), withC=logRows.some(s=>(S.coords[bOf(s)]||{}).x||(S.coords[bOf(s)]||{}).y);
  const cSeen=new Set(), cOf=s=>{ const b=bOf(s); if(!b || cSeen.has(b)) return {}; cSeen.add(b); return S.coords[b]||{}; };
  sheets.push(tableSheet("יומן שדה",
    ["מס׳ קידוח","מס׳ דגימה","עומק (מטר)","שעה","סוג קרקע (חתך ליתולוגי)","צבע","ריח","לחות","ערך PID (ppm)","PID 20%","הערות",

    [10,14,10,8,22,14,7,8,12,10,30,...(withC?COORD_W:[])], new Set([4,10])));

  /* שורת סה״כ: כמות אנליזות מכל סוג מתחת לעמודה שלה, והסך הכול בעמודת ההערות */
  const coc=(name,rows)=>{
    const bag=r=>r.bag, per=tests.map(t=>rows.filter(r=>bag(r).tests.includes(t)).length);
    const sum=per.reduce((a,b)=>a+b,0);
    return tableSheet(name,
      ["זיהוי דגימה","עומק (מטר)","שעת דיגום","כלי דיגום","מספר אריזות","סוג דגימה",...tests,"PID (ppm)","הערות"],
      rows.map(r=>{ const b=bag(r);

      /* הטקסט מתחיל במילה עברית: טקסט שמתחיל בספרה מוצג ב-Excel בכיוון הפוך */
      ["סה״כ אנליזות","","","","","",...per,"",`סה״כ ${sum} אנליזות ${rows.length===1?"בדגימה אחת":`ב-${rows.length} דגימות`}`]);
  };
  sheets.push(coc("שרשרת משמורת",custodyRows(false)));
  if(split) sheets.push(coc("משמורת פיצול",custodyRows(true)));

  sheets.push(changesSheet());

/* מסירת הקובץ: אין דרך אחת שעובדת בכל מקום, ולכן כמה אפשרויות.
   שיתוף חייב לרוץ ישירות מלחיצה — לכן הוא בכפתור נפרד ולא מיד אחרי היצירה */
async function offerFile(blob, filename){
  const url=URL.createObjectURL(blob);
  const file=typeof File==="function" ? new File([blob],filename,{type:blob.type}) : null;
  let canShare=false;
  try{ canShare=!!(file && navigator.canShare && navigator.canShare({files:[file]})); }catch(e){}
  const dl=await useCap("downloads");
  const close=()=>{ m.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000); };
  const m=el("div",{class:"modal",role:"dialog","aria-modal":"true",onclick:e=>{ if(e.target===m) close(); }},
    el("div",{class:"card"},
      el("h2",{},"הקובץ מוכן"),
      el("div",{class:"sub mono",style:"overflow-wrap:anywhere"},showName(filename)),
      el("div",{class:"bar"},
        canShare?el("button",{class:"btn",type:"button",
          onclick:()=>navigator.share({files:[file],title:filename}).catch(()=>{})},"שיתוף / שמירה בקבצים"):null,
        dl?el("button",{class:"btn ghost",type:"button",onclick:()=>dl.save({filename,data:blob}).catch(()=>{})},"שמירה"):null,
        el("a",{class:"btn ghost",href:url,download:filename},"הורדה"),
        el("a",{class:"btn ghost",href:url,target:"_blank",rel:"noopener"},"פתיחה")),
      el("div",{class:"sub",style:"margin:12px 0 0"},"אם כפתור אחד לא מגיב באפליקציה שבה הטופס פתוח, נסה את האחר."),
      el("div",{class:"bar"},el("span",{class:"spacer"}),el("button",{class:"btn ghost",type:"button",onclick:close},"סגירה"))));
  document.body.append(m);
}

/* ============ קובץ נתוני התקנה — העברת ההתקנה לאייפד אחר ============
   החלטת דני (16.11.2026): ההתקנה והדיגום נעשים לפעמים בידי דוגמים שונים, באייפדים שונים.
   הדוגם המתקין שולח במייל קובץ נתונים; הדוגם השני שומר אותו בקבצים ומייבא (רשומות ← ייבוא התקנה).
   הקובץ כולל את פרטי הסקר, ההתקנה, הבארות, חתימת המתקין ותיעוד השינויים.
   code — SHA-256 של שאר התוכן: מזהה קובץ שנערך ידנית או נפגם. אינו הגנה מפני מי שמחשב את הקוד מחדש */
const INST_FILE="vasa-gas-install";
async function digest(s){
  if(!(crypto && crypto.subtle)) throw new Error("המכשיר לא מאפשר חישוב קוד אימות (נדרש חיבור מאובטח)");
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function instFileBlob(){
  flushChanges();
  const g=S.gas;
  const p={type:INST_FILE, v:1, exportedAt:stamp(), from:S.id, by:g.inst.s1||"",
    head:Object.fromEntries(Object.keys(INST_HEAD_LABEL).map(k=>[k,S.head[k]])),
    inst:structuredClone(g.inst),
    wells:g.wells.map(w=>({id:w.id, ...Object.fromEntries(INST_WELL.concat(COORD_KEYS).map(k=>[k,w[k]]))})),
    sig:S.sigs.gi||"", changes:structuredClone(S.changes)};
  const code=await digest(JSON.stringify(p));
  return new Blob([JSON.stringify({...p, code})],{type:"application/json"});
}

async function readInstFile(text){
  let o; try{ o=JSON.parse(text); }catch(e){ o=null; }
  if(!o || o.type!==INST_FILE) throw new Error("זה לא קובץ נתוני התקנה של האפליקציה.");
  const {code,...rest}=o;
  if(!code || await digest(JSON.stringify(rest))!==code)
    throw new Error("הקובץ השתנה אחרי שנשלח מהאפליקציה, ולכן לא ניתן לייבא אותו. בקש מהדוגם המתקין לשלוח אותו שוב.");
  return o;
}

const whenShort = iso => iso ? new Date(iso).toLocaleString("he-IL",{dateStyle:"short",timeStyle:"short"}) : "";
async function importInstallFile(o, fname){
  /* אותה התקנה כבר במכשיר: הרשומה המקורית (אותו אייפד), או ייבוא קודם */
  const docs=[S, ...localIdx.filter(e=>e.id!==S.id).map(e=>readJSON(kDoc(e.id))).filter(Boolean)].map(normalize);
  const orig=docs.find(d=>d.id===o.from);
  if(orig){
    if(confirm(`ההתקנה הזו נרשמה במכשיר הזה, ברשומה ״${docTitle(orig)}״. לפתוח אותה?`)) await openDoc(orig.id);
    return;
  }
  const dup=docs.find(d=>isGas(d) && d.gas.imported && d.gas.imported.from===o.from);
  if(dup) return dupDialog(dup, o, fname);
  persistNow();
  const d=blankRecord("gas","full");
  Object.assign(d.head, o.head);
  d.gas.inst={...d.gas.inst, ...o.inst};
  d.gas.wells=o.wells.map(w=>({...blankWell(), ...w, auto:[]}));
  d.sigs.gi=o.sig||"";
  d.changes=structuredClone(o.changes||[]);
  d.gas.imported={from:o.from, by:o.by, exportedAt:o.exportedAt, at:stamp(), file:fname};
  d.changes.push({t:stamp(), who:"לא נבחר דוגם", label:"ייבוא התקנה מקובץ", from:"",
    to:`${fname} · נשלח ${whenShort(o.exportedAt)} מהאייפד של ${o.by||"הדוגם המתקין"}`});
  d.updated=stamp();
  flash=null;
  if(!await switchTo(normalize(d))) return;
  persistLocal();
  active="samp";
  flash=`ההתקנה יובאה: ${S.gas.wells.length} בארות. ממלאים כאן את יום הדיגום.`;
  render();
}
/* ייבוא כפול: פתיחת הרשומה הקיימת, או — כשהקובץ חדש יותר — עדכון ההתקנה בה */
function dupDialog(dup, o, fname){
  const newer=(o.exportedAt||"")>(dup.gas.imported.exportedAt||"");
  const close=()=>m.remove();
  const m=el("div",{class:"modal",role:"dialog","aria-modal":"true"},
    el("div",{class:"card"},
      el("h2",{},"ההתקנה כבר יובאה"),
      el("div",{class:"sub"},`ברשומה ״${docTitle(dup)}״, מקובץ שנשלח ב-${whenShort(dup.gas.imported.exportedAt)}. `+
        (newer ? `הקובץ הזה נשלח ב-${whenShort(o.exportedAt)} — חדש יותר.` : "הקובץ הזה אינו חדש יותר.")),
      dup.locked ? el("div",{class:"note warn",style:"margin-top:10px"},"הרשומה נעולה. לעדכון יש לפתוח אותה לעריכה.") : null,
      el("div",{class:"bar"},
        el("button",{class:"btn ghost",type:"button",onclick:async()=>{ close(); await openDoc(dup.id); }},"פתיחת הרשומה"),
        newer && !dup.locked ? el("button",{class:"btn",type:"button",onclick:async()=>{
          close(); await openDoc(dup.id); updateFromInstall(o,fname); }},"עדכון ההתקנה מהקובץ") : null,
        el("span",{class:"spacer"}),
        el("button",{class:"btn ghost",type:"button",onclick:close},"ביטול"))));
  document.body.append(m);
}
/* עדכון חלק ההתקנה ברשומה הפתוחה מקובץ חדש יותר. כל שדה ששונה נרשם בתיעוד על שם הדוגם המתקין.
   שדות הדיגום של הבארות (שלב 3) אינם נגעים */
function updateFromInstall(o, fname){
  flushChanges();
  const g=S.gas, who=o.by||"לא נבחר דוגם", pre="עדכון מקובץ התקנה — ", log=[];
  const diff=(label,a,b)=>{ const f=String(flat(a)), t=String(flat(b)); if(f!==t) log.push({label:pre+label, from:f, to:t}); };
  for(const [k,label] of Object.entries(INST_HEAD_LABEL)){ diff(label,S.head[k],o.head[k]); S.head[k]=o.head[k]; }
  for(const [k,label] of Object.entries(INST_LABEL)){ diff(label,g.inst[k],o.inst[k]); g.inst[k]=o.inst[k]; }
  const byId=new Map(g.wells.map(w=>[w.id,w]));
  const next=o.wells.map(src=>{
    const w=byId.get(src.id);
    if(!w){ log.push({label:pre+"באר נוספה", from:"", to:src.name||"באר"}); return {...blankWell(), ...src, auto:[]}; }
    for(const k of INST_WELL){ diff(`${WELL_LABEL[k]} · ${src.name||w.name||"באר"}`,w[k],src[k]); w[k]=src[k]; }
    /* נ"צ מההתקנה — רק כשנמדד שם. מדידה שנעשתה כאן ביום הדיגום לא נמחקת */
    if(src.gx||src.gy) for(const k of COORD_KEYS) w[k]=src[k]??"";
    byId.delete(src.id); return w;
  });
  for(const w of byId.values()) log.push({label:pre+"באר הוסרה", from:w.name||"באר", to:""});
  g.wells=next;
  if((S.sigs.gi||"")!==(o.sig||"")){ log.push({label:pre+"חתימת הדוגם המתקין", from:S.sigs.gi?"חתום":"", to:o.sig?"חתום":""}); S.sigs.gi=o.sig||""; }
  /* שינויים שהמתקין רשם אצלו אחרי הקובץ הקודם */
  const seen=new Set(S.changes.map(c=>c.t+"|"+c.label));
  const theirs=(o.changes||[]).filter(c=>!seen.has(c.t+"|"+c.label));
  const t=stamp();
  S.changes.push(...theirs, ...log.map(e=>({t, who, ...e})),
    {t, who:actor(), label:"עדכון ההתקנה מקובץ", from:`נשלח ${whenShort(g.imported.exportedAt)}`, to:`${fname} · נשלח ${whenShort(o.exportedAt)}`});
  g.imported={...g.imported, exportedAt:o.exportedAt, at:t, file:fname};
  flash=`ההתקנה עודכנה מהקובץ: ${log.length} שינויים נרשמו בתיעוד השינויים.`;
  active="inst";
  save();
}

        "aria-current":cur?"true":null, onclick:()=>openDoc(d.id)},
      el("span",{class:"dt"},d.title),
      el("span",{class:"dm"},[d.client, `${d.n||0} ${d.kind==="gas"?"בארות":"דגימות"}`, d.updated?`עודכן ${when(d.updated)}`:"טרם נשמרה"]
        .filter(Boolean).join(" · ")),
      el("span",{class:"tags"},
        d.kind==="gas"?el("span",{class:"pill"},"גז קרקע"):null,
        cur?el("span",{class:"pill live"},"פתוחה כעת"):null,
        d.locked?el("span",{class:"pill lock"},"נעולה"):null,
        !cur&&!onDevice.has(d.id)?el("span",{class:"pill"},"במאגר המשותף"):null)),
      canDelete(d)?el("button",{type:"button",class:"btn ghost sm","aria-label":`מחיקת ${d.title}`,onclick:()=>askDelete(d)},"מחיקה"):null));
  }
  const st=storeState();
  return el("div",{},el("div",{class:"card"},
    el("h2",{},"רשומות"),
    el("div",{class:"sub"},(db?"ימי הדיגום במכשיר הזה ובמאגר המשותף. ":"ימי הדיגום שנשמרו במכשיר הזה. ")+
      "שם הרשומה נבנה מהאתר, התאריך, אות היום ודוגם 1. אפשר למחוק כל רשומה חוץ מהפתוחה — אחרי שהמסמכים שלה בתיק הלקוח בענן"),
    el("div",{class:"bar",style:"margin:0 0 14px"},
      el("button",{class:"btn",type:"button",onclick:newDocDialog},"שמירה ורשומה חדשה"),
      el("button",{class:"btn ghost",type:"button",onclick:importInstall},"ייבוא התקנה"),
      el("span",{class:"spacer"}),
      el("span",{class:"pill"},`${docs.length} רשומות`)),
    list),
    /* הגדרה של המכשיר, לא של הרשומה — לכן לא תלויה בנעילת הרשומה הפתוחה */
    el("div",{class:"card"},
      el("h2",{},"המכשיר הזה"),
      el("div",{class:"bar",style:"margin:0 0 12px"},
        el("span",{class:"pill"+(st.pct>=STORE_WARN?" lock":"")},`אחסון: ${pctText(Math.min(1,st.pct))}`),
        goneN?el("span",{class:"pill"},`${goneN} רשומות נמחקו`):null,
        goneN?el("button",{class:"btn ghost sm",type:"button",onclick:exportGone},"תיעוד השינויים שלהן"):null),
      el("div",{class:"sub"},"מדלקים רק באייפד עם כרטיס SIM (יש בו GPS) או עם מקלט GPS חיצוני מחובר. כשכבוי — אין כפתור מדידת מיקום"),
      el("div",{class:"chips"},el("button",{class:"chip",type:"button","aria-pressed":String(gpsOn()),
        onclick:()=>setGpsOn(!gpsOn())},"מדידת מיקום ב-GPS"))));
}

/* ============ shell ============ */
/* when — הלשונית מוצגת רק כשמתקיים (קרקע / גז קרקע). בגז "דיגום בלבד" אין לשונית התקנה */
const soilOnly = () => !isGas();
const TABS=[
  {id:"docs", label:"רשומות", view:viewDocs, count:()=>allDocs().length},
  {id:"day", label:()=>isGas()?"פרטי הסקר":"יום דיגום", view:viewDay, count:()=>null},
  {id:"log", label:"יומן שדה", view:viewLog, count:()=>S.samples.length, when:soilOnly},
  {id:"coc", label:"שרשרת משמורת", view:()=>custodyView("coc"), count:()=>custodyRows(false).length, when:soilOnly},
  {id:"spl", label:"משמורת פיצול", view:()=>custodyView("split"), count:()=>custodyRows(true).length, when:soilOnly},
  {id:"inst",label:"התקנה", view:viewInst, count:()=>S.gas.wells.length, when:()=>isGas() && S.gas.mode!=="manual"},
  {id:"samp",label:"דיגום", view:viewSamp, count:()=>null, when:isGas},
  {id:"hand",label:"מסירה וקבצים", view:viewHand, count:()=>null},
  {id:"hist",label:"תיעוד שינויים", view:viewHist, count:()=>S.changes.length},
];
const shownTab = t => !t.when || t.when();
let active="day";

/* בנייה מחדש בזמן שגלגלת שעה/תאריך פתוחה מחליפה את השדה מתחתיה והחלונית קופצת
   (למשל כששינוי קודם נרשם בתיעוד אחרי 3 שניות). הבנייה נדחית עד שהחלונית נסגרת */
let renderWaiting=false;
function pickerOpen(){
  const a=document.activeElement;
  if(!(a && a.matches && a.matches("main input[type=time], main input[type=date]"))) return false;
  if(!renderWaiting){ renderWaiting=true; a.addEventListener("blur",()=>{ renderWaiting=false; renderSoon(); },{once:true}); }
  return true;
}
/* בזמן הקלדה לא בונים את המסך מחדש: השדה הפעיל נשאר במקומו, ורק מה שסביבו מתחלף (patchAround).
   לפני כן כל מעבר בין שדות, וכל רישום בתיעוד (3 שניות אחרי שינוי), מחק את השדה הפעיל: ההקלדה נפלה,
   המסך קפץ, ומה שעוד לא נשמר אבד (דיווח מהשטח, 23.11.2026) */
let drawnKey="", drawnS=null, soonT=null, pointerAt=0;
const viewKey=()=>[active,S.id,!!S.locked].join("|");
const editing=()=>{ const a=document.activeElement;
  return a && a.matches && a.matches("main input:not([type=file]), main textarea, main select") ? a : null; };
const commitField=()=>{ const a=editing(); if(a) a.blur(); };
addEventListener("pointerdown",()=>{ pointerAt=Date.now(); },true);
for(const ev of ["pointerup","pointercancel"]) addEventListener(ev,()=>{ pointerAt=0; },true);
/* לחיצה על כפתור שומרת קודם את השדה הפתוח — באייפד כפתור לא מוציא ממנו את הסמן */
addEventListener("click",e=>{ if(e.target.closest && e.target.closest("button,a")) commitField(); },true);
function renderSoon(){
  clearTimeout(soonT);
  /* אצבע או עכבר לחוצים — מחכים לשחרור, כדי שהלחיצה תגיע לכפתור שנלחץ */
  soonT=setTimeout(()=>{ if(pointerAt && Date.now()-pointerAt<4000) return renderSoon(); soonT=null; if(!pickerOpen()) draw(); }, pointerAt?60:0);
}
function render(){
  if(pickerOpen()) return;
  if(viewKey()===drawnKey && drawnS===S && (typing || editing())) return renderSoon();
  draw();
}
const nodeSig=x=>{ const t=x.querySelector("h2,label,b"); return x.tagName+"|"+(x.dataset.id||(t?t.textContent:"")); };
/* o — התוכן על המסך, n — התוכן החדש. מחליף הכול חוץ מהשדה הפעיל ומה שעוטף אותו. false — המבנה סביבו השתנה */
function patchAround(o,n,focus){
  const plan=[];
  let a=o, b=n;
  while(a!==focus){
    const ac=[...a.children].find(c=>c.contains(focus)), A=[...a.childNodes], B=[...b.childNodes];
    let bc;
    if(A.length===B.length) bc=B[A.indexOf(ac)];
    else{
      const same=L=>L.filter(x=>x.nodeType===1 && nodeSig(x)===nodeSig(ac)), m=same(B);
      if(m.length!==1 || same(A).length!==1) return false;
      bc=m[0];
    }
    if(!bc || bc.nodeType!==1 || bc.tagName!==ac.tagName || (bc.dataset.id||"")!==(ac.dataset.id||"")) return false;
    const label=x=>{ const l=x.classList.contains("f") && x.querySelector("label"); return l?l.textContent:""; };
    if(label(ac)!==label(bc)) return false;
    plan.push([a,b,ac,bc]); a=ac; b=bc;
  }
  if(b.type!==a.type || b.disabled!==a.disabled) return false;
  for(const [p,q,ac,bc] of plan){
    const B=[...q.childNodes], k=B.indexOf(bc);
    for(const x of [...p.childNodes]) if(x!==ac) x.remove();
    ac.before(...B.slice(0,k)); ac.after(...B.slice(k+1));
    if(ac!==focus) ac.className=bc.className;
  }
  return true;
}
function draw(){
  clearTimeout(soonT); soonT=null;
  const nav=document.getElementById("tabs");
  nav.textContent="";
  /* לשונית שאינה קיימת בסוג הרשומה הפתוחה — חוזרים לפרטים */
  if(!TABS.some(t=>t.id===active && shownTab(t))) active="day";
  for(const t of TABS){
    if(!shownTab(t)) continue;
    const c=t.count();
    nav.append(el("button",{role:"tab","aria-selected":String(active===t.id),
      onclick:()=>{active=t.id; flash=null; render(); window.scrollTo(0,0);}},
      typeof t.label==="function"?t.label():t.label, c!=null?el("span",{class:"n"},String(c)):null));
  }
  for(const t of TABS){
    const s=document.getElementById("v-"+t.id);
    s.hidden = active!==t.id;
    if(!s.hidden){
      const key=viewKey(), same=key===drawnKey && drawnS===S, a=same?editing():null;
      const next=el("div",{},flash?el("div",{class:"note",style:"margin-bottom:14px"},flash):null,t.view());
      const top=a && s.contains(a) ? a.getBoundingClientRect().top : null;
      if(top!=null && patchAround(s,next,a)) window.scrollBy(0,a.getBoundingClientRect().top-top);
      else{
        const y=window.scrollY;
        /* הערך שבשדה הפתוח נשמר לפני שהשדה מוחלף */
        if(same) commitField();
        s.textContent=""; s.append(...next.childNodes);
        if(same) window.scrollTo(0,y);
      }
      drawnKey=key; drawnS=S;
    }
  }
  const bar=document.getElementById("docbar");
  bar.textContent="";
  bar.append(
    el("button",{class:"doccur",type:"button",title:"לכל הרשומות",onclick:()=>{active="docs"; flash=null; render();}},
      "רשומה: ",el("b",{},docTitle(S))),
    el("span",{class:"spacer"}),
    el("button",{class:"btn ghost sm",type:"button",onclick:newDocDialog},"שמירה ורשומה חדשה"));
  document.getElementById("lockPill").hidden=!S.locked;
  document.getElementById("fullPill").hidden=!storageFull;
}

function persistNow(){
  commitField();
  const n=S.changes.length;
  flushChanges();
  if(pristine(S)) return;
  /* סגירת האפליקציה אינה עריכה — רשומה ישנה שרק נפתחה לעיון לא נעשית "חדשה" (גיל הרשומה קובע מתי מותר למחוק) */
  if(S.changes.length!==n) S.updated=stamp();
  persistLocal();
}
addEventListener("pagehide",persistNow);

/* ============ אפליקציה מותקנת — עבודה בלי קליטה, עדכונים, התקנה ============
   sw.js שומר את האפליקציה במכשיר: היא נפתחת מהמטמון מיד, ובודקת ברקע אם יש גרסה חדשה.
   כשהדף נפתח מקובץ (file://) אין service worker — הכול עובד, רק בלי מטמון ובלי עדכונים */
const K_HINT="vasa-install-hint";
const standalone=()=>matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
const appleTouch=()=>/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);

function installHint(){
  const box=document.getElementById("installHint");
  let off=false; try{ off=localStorage.getItem(K_HINT)==="off"; }catch(e){}
  if(off || standalone() || !appleTouch() || !/^https:$/.test(location.protocol)){ box.hidden=true; return; }
  box.textContent="";
  box.append(el("div",{class:"note install"},
    el("span",{},el("b",{},"להתקנה במסך הבית: "),
      "לחץ על כפתור השיתוף של Safari ובחר ״הוספה למסך הבית״. האפליקציה תיפתח מהסמל ותעבוד גם בלי קליטה. ",
      el("b",{},"כדאי להתקין לפני שמתחילים לעבוד"),
      " — רשומות שנשמרו כאן בדפדפן אינן עוברות לאפליקציה המותקנת."),
    el("button",{class:"btn ghost sm",type:"button",onclick:()=>{
      try{ localStorage.setItem(K_HINT,"off"); }catch(e){} box.hidden=true; }},"הבנתי")));
  box.hidden=false;
}

function setupApp(){
  const upd=document.getElementById("updPill"), inst=document.getElementById("installPill");
  upd.onclick=()=>{
    persistNow();
    if(storageFull && !db && !confirm("האחסון במכשיר מלא והרשומה הפתוחה לא נשמרה. רענון ימחק את השינויים האחרונים. לרענן בכל זאת?")) return;
    location.reload();
  };
  if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    const sw=navigator.serviceWorker;
    sw.onmessage=e=>{ if(e.data && e.data.type==="update-ready") upd.hidden=false; };
    /* בפתיחה, וגם כשחוזרים לאפליקציה — באייפד אפליקציה מותקנת בדרך כלל ממשיכה ולא נטענת מחדש */
    const check=()=>{ if(sw.controller) sw.controller.postMessage({type:"check-update"}); };
    sw.register("sw.js").then(check).catch(()=>{});
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ check(); checkStorage(); } });
  }
  /* מבקש מהדפדפן לא למחוק את הרשומות כשהמכשיר מתמלא */
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  /* מחשב (Chrome / Edge): כפתור התקנה. באייפד אין אירוע כזה — שם מופיעה ההנחיה */
  let deferred=null;
  addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferred=e; inst.hidden=false; });
  addEventListener("appinstalled",()=>{ deferred=null; inst.hidden=true; });
  inst.onclick=async()=>{ if(!deferred) return; deferred.prompt(); try{ await deferred.userChoice; }catch(e){} deferred=null; inst.hidden=true; };
  installHint();
}

(async function init(){
  setupApp();
  localIdx=readJSON(K_INDEX)||[];
  migrateOld();
  let cur=null; try{ cur=localStorage.getItem(K_CUR); }catch(e){}
  const d=cur?readJSON(kDoc(cur)):null;
  S = d ? normalize(d) : blankDay();
  render();
  loadCert(); moveOldCerts(); loadGone();
  certDo(()=>{ checkStorage(); if(active==="docs") render(); });

  db=await useCap("db");
  if(db){
    db.collection("index").onSnapshot(q=>{
      remoteIdx=new Map(q.docs.filter(x=>x.exists).map(x=>[x.id,x.data()]));
      if(active==="docs") render();
    },()=>{});
    await attachRemote();
  } else setPill("local");
})();
</script>
