<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="יומן שדה">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="color-scheme" content="light">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}</style>
<title>יומן שדה ומשמורת</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ערכת צבעים אחת, בהירה וחדה, לעבודה באייפד בשמש: טקסט כמעט שחור, קווים כהים,
   צבעי מצב רוויים. אין מצב כהה — מסך כהה כמעט לא קריא באור יום חזק */
:root{
  --ground:#E6EAE7; --surface:#FFFFFF; --sunk:#F1F4F2; --head:#D6DDD8;
  --ink:#0A0F0C; --ink-2:#1E2622; --muted:#3D4641;
  --line:#5E6862; --line-2:#AEB6B1;
  --accent:#005C45; --accent-ink:#00402F; --accent-soft:#C6EBDD;
  --warn:#8A3F00; --warn-soft:#FFD89E;
  --danger:#A3001B; --danger-soft:#FFD3D8;
  --ok:#14571F;
  --r:10px;
}

*{box-sizing:border-box}
html{direction:rtl}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Heebo","Segoe UI",Arial,sans-serif; font-size:15px; font-weight:500; line-height:1.5;
  margin:0; -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:"Frank Ruhl Libre",Georgia,serif; margin:0; text-wrap:balance}
button,input,select,textarea{font:inherit; color:inherit; max-width:100%}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- chrome ---------- */
.top{position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:2px solid var(--line)}
.top-in{max-width:1240px; margin:0 auto; padding:10px 16px 0; display:flex; flex-direction:column; gap:8px}
.brandrow{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.brand{font-size:19px; font-weight:700; letter-spacing:-.2px}
.brand small{font-family:"Heebo",sans-serif; font-size:12px; font-weight:500; color:var(--muted); letter-spacing:.4px}
.statewrap{margin-inline-start:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.pill{
  font-size:12px; font-weight:700; letter-spacing:.2px; padding:3px 10px;
  border-radius:999px; border:1.5px solid var(--line); color:var(--ink); background:var(--sunk); white-space:nowrap;
}
.pill.live{border-color:var(--accent); color:#fff; background:var(--accent)}
.pill.lock{border-color:var(--ok); color:var(--ok); background:var(--surface)}
.pill.local{border-color:var(--warn); color:var(--warn); background:var(--warn-soft)}
nav{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  background:none; border:0; border-bottom:4px solid transparent; cursor:pointer;
  padding:9px 12px 9px; font-size:14px; font-weight:500; color:var(--ink-2); white-space:nowrap;
}
nav button[aria-selected="true"]{color:var(--accent-ink); border-bottom-color:var(--accent); font-weight:700}
nav button .n{
  font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:500; color:var(--ink);
  background:var(--head); border-radius:5px; padding:1px 5px; margin-inline-start:5px;
}

main{max-width:1240px; margin:0 auto; padding:18px 16px 120px}
section[hidden]{display:none!important}
.card{background:var(--surface); border:1.5px solid var(--line-2); border-radius:var(--r); padding:16px}
.card + .card{margin-top:14px}
.card > h2{font-size:17px; margin-bottom:3px}
.card > .sub{font-size:13px; color:var(--muted); margin-bottom:14px}

/* ---------- fields — generous tracks so nothing collides ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px 18px; align-items:start}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.f{display:flex; flex-direction:column; gap:5px; min-width:0}
.f > label{font-size:12.5px; font-weight:700; letter-spacing:.2px; color:var(--ink-2)}
.f input,.f select,.f textarea{
  background:var(--surface); border:1.5px solid var(--line); border-radius:8px;
  padding:9px 10px; font-size:16px; width:100%; min-width:0; min-height:44px;
}
.f textarea{min-height:64px; resize:vertical}
.f input:disabled,.f select:disabled,.f textarea:disabled{opacity:.6}
.f .hint{font-size:12px; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:1.5px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px; font-size:14px; font-weight:500; cursor:pointer; min-height:42px}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700}

/* ---------- tables ---------- */
.scroll{overflow-x:auto; border:1.5px solid var(--line); border-radius:var(--r); background:var(--surface)}
table{border-collapse:collapse; width:100%; min-width:max-content; font-size:14px}
th{
  background:var(--head); text-align:right; font-weight:700; font-size:12px; letter-spacing:.2px;
  color:var(--ink); padding:9px 8px; border-bottom:1.5px solid var(--line);
  white-space:nowrap; position:sticky; top:0; z-index:2;
}
th.vt{writing-mode:horizontal-tb; white-space:normal; width:62px; max-width:62px; line-height:1.25; font-size:11px}
td{border-bottom:1px solid var(--line-2); padding:4px 6px; vertical-align:middle}
tr:last-child td{border-bottom:0}
/* תאים עם מסגרת גלויה — באייפד אין ריחוף, ובשמש שדה בלי מסגרת נראה כמו טקסט */
td input,td select{
  background:var(--surface); border:1px solid var(--line-2); border-radius:6px;
  padding:7px 6px; font-size:14px; width:100%; min-width:0; min-height:40px;
}
td input:focus,td select:focus{border:2px solid var(--accent)}
td.mono input,.mono{font-family:"IBM Plex Mono",monospace; font-weight:500; font-variant-numeric:tabular-nums}
td.rownum{color:var(--ink-2); font-family:"IBM Plex Mono",monospace; font-size:12px; text-align:center; width:36px}
tr.hot td.rownum{color:var(--warn); font-weight:700}
tr.hot{background:var(--warn-soft)}
/* משמורת: לחיצה ארוכה על שורה = חזרה. הרקע מתמלא במשך 3 השניות, כדי שהדוגם יידע להמשיך להחזיק */
tr.lp td{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
tr.lp td input{-webkit-user-select:text; user-select:text}
tr.pressing{background:var(--accent-soft); transition:background 3s linear}
tr.xrow{background:var(--sunk)}
tr.fresh td{border-top:3px solid var(--accent); border-bottom:3px solid var(--accent)}
.rowdel{border:0; background:none; color:var(--danger); font-size:17px; font-weight:700; cursor:pointer; min-width:30px; min-height:30px; padding:0}
.rowdel:disabled{opacity:.35; cursor:default}
.w-xs{width:64px} .w-s{width:84px} .w-m{width:112px} .w-l{width:158px} .w-xl{width:200px}
.tickcell{text-align:center; width:48px}
.tick{width:30px; height:30px; border:2px solid var(--line); border-radius:6px; background:var(--surface); cursor:pointer; padding:0; line-height:1; font-size:16px; font-weight:700; color:transparent}
.tick[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.tick.alt[aria-pressed="true"]{background:var(--warn); border-color:var(--warn)}
.tick:disabled{opacity:.4; cursor:default}

/* ---------- misc ---------- */
.btn{background:var(--accent); color:#fff; border:2px solid var(--accent); border-radius:8px; padding:9px 16px; font-size:14.5px; font-weight:700; cursor:pointer; min-height:44px}
.btn.ghost{background:var(--surface); color:var(--accent-ink); border-color:var(--accent)}
.btn.warnb{background:var(--danger); border-color:var(--danger)}
.btn:disabled{opacity:.45; cursor:default}
.bar{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-top:14px}
.spacer{flex:1}
.note{border-inline-start:5px solid var(--accent); background:var(--accent-soft); color:var(--ink); padding:11px 13px; border-radius:0 8px 8px 0; font-size:14px}
.note.warn{border-color:var(--warn); background:var(--warn-soft)}
.note.bad{border-color:var(--danger); background:var(--danger-soft)}
.note b{font-weight:700}
.empty{text-align:center; color:var(--muted); font-size:14px; padding:26px 12px}
.sigbox{border:2px dashed var(--line); border-radius:8px; background:var(--surface); touch-action:none; width:100%; height:120px; display:block}
.sigwrap{display:flex; flex-direction:column; gap:6px; min-width:0}
.hist{font-size:13px; list-style:none; margin:0; padding:0}
.hist li{display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:9px 0; border-bottom:1px solid var(--line-2)}
.hist li:last-child{border-bottom:0}
.hist .what{font-weight:700}
.hist .when{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); white-space:nowrap}
.hist .delta{grid-column:1/-1; color:var(--ink-2); font-size:13px; word-break:break-word}
.hist .from{color:var(--danger); text-decoration:line-through}
.hist .to{color:var(--ok); font-weight:700}
.sketch{border:2px solid var(--line); border-radius:8px; background:var(--surface); touch-action:none; width:100%; max-width:560px; height:300px; display:block}
.shot{max-width:100%; border:1.5px solid var(--line); border-radius:8px; display:block}
.seg{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap}

/* ---------- records ---------- */
.docbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.doccur{background:none; border:0; padding:0; cursor:pointer; font-size:14px; color:var(--muted); text-align:right; min-height:40px; min-width:0; overflow-wrap:anywhere}
.doccur b{color:var(--ink); font-weight:700}
.btn.sm{min-height:40px; padding:6px 13px; font-size:13.5px}
.docs{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.docrow{
  width:100%; display:grid; grid-template-columns:1fr auto; gap:3px 12px; align-items:center; text-align:right;
  background:var(--surface); border:1.5px solid var(--line); border-radius:8px; padding:11px 13px; cursor:pointer; min-height:56px;
}
.delrow{display:flex; gap:8px; align-items:center}
.delrow .docrow{flex:1; min-width:0}
.docrow:hover{border-color:var(--accent)}
/* גז קרקע — כרטיס לכל באר / בלאנק במסך הדיגום */
.well{border:1.5px solid var(--line-2); border-radius:8px; padding:12px; margin:0 0 12px; background:var(--sunk)}
.well.bad{border-color:var(--warn); border-width:2px}
.wellhead{margin:0 0 10px; font-size:15px}
.docrow.cur{background:var(--accent-soft); border:2.5px solid var(--accent)}
.docrow .dt{font-weight:700; font-size:15px; overflow-wrap:anywhere}
.docrow .dm{grid-column:1; font-size:12.5px; color:var(--muted)}
.docrow .tags{grid-column:2; grid-row:1 / 3; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}

/* ---------- number fields — type=number opens the numeric keyboard on iPad ---------- */
input[type=number]{-moz-appearance:textfield; appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none; margin:0}

/* ---------- field log — fits an iPad in landscape without sideways scrolling ---------- */
table.compact{table-layout:fixed; min-width:876px}
table.compact th{white-space:normal; padding:6px 3px; font-size:11.5px; line-height:1.2; letter-spacing:0; vertical-align:bottom}
.pair{display:flex; gap:2px}
table.compact td{padding:2px 2px}
table.compact td input,table.compact td select{padding:6px 3px; font-size:13px; min-height:38px}
table.compact td select{-webkit-appearance:none; appearance:none; text-overflow:ellipsis}
table.compact td.rownum,table.compact .tickcell{width:auto}

/* ---------- file dialog ---------- */
.modal{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px}
.modal .card{width:100%; max-width:440px}
.modal .bar a.btn{text-decoration:none; display:inline-flex; align-items:center}
.modal .card{max-height:calc(100vh - 32px); overflow-y:auto}

/* ---------- installed app — update, install ---------- */
button.pill{font-family:inherit; cursor:pointer; min-height:30px}
.pill.act{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft)}
.install{margin-bottom:14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.install > span{flex:1; min-width:220px}

/* ---------- email ---------- */
.picks{display:flex; flex-direction:column; gap:8px; margin:14px 0 4px}
.picks .chip{text-align:right; width:100%}
.picks .ck{display:inline-block; width:1.5em; font-weight:700}
.mailbody{white-space:pre-line; font-size:13px; background:var(--sunk); border:1.5px solid var(--line-2); border-radius:8px; padding:10px 12px; max-height:180px; overflow-y:auto; margin-top:10px}
.files{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:13.5px}
.files li{display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; overflow-wrap:anywhere}
.files a.btn{text-decoration:none; display:inline-flex; align-items:center}
</style>
</head>
<body>


<div class="top">
  <div class="top-in">
    <div class="brandrow">
      <span class="brand">יומן שדה ומשמורת <small>וזה אקולוגיה · ISO 17025 · 294</small></span>
      <span class="statewrap">
        <span class="pill" id="syncPill">מקומי</span>
        <span class="pill lock" id="lockPill" hidden>נעול</span>
        <span class="pill local" id="fullPill" hidden>האחסון במכשיר מלא — השינוי האחרון לא נשמר</span>
        <button class="pill act" id="updPill" type="button" hidden>גרסה חדשה מוכנה — רענון</button>
        <button class="pill act" id="installPill" type="button" hidden>התקנה כאפליקציה</button>
      </span>
    </div>
    <div class="docbar" id="docbar"></div>
    <nav id="tabs" role="tablist"></nav>
  </div>
</div>

<main>
  <div id="installHint" hidden></div>
  <section id="v-docs" role="tabpanel" hidden></section>
  <section id="v-day" role="tabpanel"></section>
  <section id="v-log" role="tabpanel" hidden></section>
  <section id="v-coc" role="tabpanel" hidden></section>
  <section id="v-spl" role="tabpanel" hidden></section>
  <section id="v-inst" role="tabpanel" hidden></section>
  <section id="v-samp" role="tabpanel" hidden></section>
  <section id="v-hand" role="tabpanel" hidden></section>
  <section id="v-hist" role="tabpanel" hidden></section>
</main>

<script>
"use strict";

async function useCap(name){
  try{ if(typeof claude!=="undefined" && claude && typeof claude.use==="function") return await claude.use(name); }catch(e){}
  return null;
}

/* ============ reference data — הנחיות למילוי שדות ============ */
const SAMPLERS = ["ענב אורן","אורן פלדמן","ראמי גאנם","עמית אורן","דני וזה"];
/* 590-914791 — המספר הסידורי כפי שעל המכשיר ("SN:" לפניו). "SM590-914791" היה שגוי (ענב, 19.11.2026);
   ברשומות ישנות הוא נשאר כפי שנרשם — ראה sel() */
const PIDS     = ["XT-103253","XT-103411","XT-100270","T-118415","07-0127","590-914791"];
/* מעבדות לבחירה. "אחר" פותח הקלדה חופשית */
const LABS     = ["בקטוכם","אלכם","אמינולאב","מכון הנפט"];
const OTHER    = "אחר";
const RIGS     = ["דחיקה ישירה – גיאופרוב","דיגום ידני"];
const WEATHER  = ["שמשי","מעונן","מעונן חלקי","גשום","חם","חם מאוד"];
const LANDUSE  = ["מגורים","תעשייה","מסחר","חקלאי"];
const SOIL     = ["חרסית","חרסית שמנה","חמרה","לס","כורכר","חול","מצעים","אחר"];
const COLOR    = ["חום","שחור","אדום","כתום","אפור","לבן","צהוב","אחר"];
const ODOUR    = ["לא","כן","חזק"];
const MOIST    = ["יבש","לח","רטוב"];
const TOOL     = ["צנצנת","ליינר"];
const LINER    = new Set(["ליינר","שרוול"]);   /* "שרוול" — שם ישן של הליינר ברשומות קודמות */
/* VOC ו-TPH GRO נדגמים בצנצנת + ויילים, אסור בליינר (ממצא הרשות להסמכה, 22.10.2026; GRO — החלטת דני 29.10.2026) */
const vocInLiner = b => LINER.has(b.tool) && b.tests.some(t=>/^VOC$|GRO/i.test(String(t).trim()));
const STYPE    = ["חטף","מורכב"];
const PACKS    = ["1","2","3","4","5"];
const DAYS     = ["A","B","C","D","E","F","G"];
/* העמודות הקבועות בטופס 33.1, בסדר שלהן מימין לשמאל, ואחריהן ארבע עמודות פתוחות.
   במהדורה 22 (15.10.2026) TPH GRO הפכה לעמודה קבועה */
const TESTS    = ["TPH D+O","ICP מתכות","PFAS","CR6+","PH","SVOC","VOC","TPH GRO"];
const EXTRA_N  = 4;
/* שמות מגרסאות קודמות של האפליקציה */
const TEST_OLD = {"TPH DRO ORO":"TPH D+O","ICP":"ICP מתכות"};
const PID_HOT  = 20;
const BILL_US  = "וזה אקולוגיה";

/* גז קרקע אקטיבי, בארות קבועות — טופס 59.1 (התקנה, מהדורה 6) וטופס 59 (שרשרת משמורת, מהדורה 11),
   הוראת עבודה 40002 ונספחיה. הטפסים משמשים כמו שהם (החלטת דני 16.11.2026): נאסף רק מה שיש בהם */
const GAS_METHODS = ["דחיקה ישירה – גיאופרוב","מקדח ידני"];
/* קוטרי הקידוח בנספחים A ו-C להוראת העבודה */
const BORE_DIA    = ['1"','1.25"','1.5"','1.75"','2"','3"','4"','6"'];
const LAMPS       = ["10.6 eV","11.7 eV"];
const PURGE_VOLS  = ["3","5"];
/* 1.4 ליטר — יש מעבדות שמספקות כך (דני, 23.11.2026) */
const CAN_VOLS    = ["1","1.4","6"];
const GAS_MODE    = {full:"התקנה ודיגום", manual:"דיגום בלבד"};

const todayISO = () => new Date().toISOString().slice(0,10);
const nowHM    = () => new Date().toTimeString().slice(0,5);
const stamp    = () => new Date().toISOString();
function ddmmyy(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split("-");
  return `${d}${m}${y.slice(2)}`;
}

function blankSample(boring){
  return {id:crypto.randomUUID(), boring:boring||"", depth:"", time:"", name:"", nameAuto:true,
    dayLetter:"", soil:[], color:[], odour:"לא", moist:"", pid:"", pid20:"", note:"",
    toCoc:false, tool:"צנצנת", packs:"1", stype:"חטף", tests:[], extra:[], cocNote:"", qc:"",
    toSplit:false, sp:{tool:"צנצנת", packs:"1", stype:"חטף", tests:[], extra:[], note:""},
    /* ברירות מחדל (דני, 24.11.2026): ריח — לא; כלי דיגום — צנצנת; מספר אריזות — 1 */
    auto:["odour","tool","packs","stype","sp.tool","sp.packs","sp.stype"]};
}

/* שורה שקיימת רק בשרשרת המשמורת (או בפיצול), ולא ביומן השדה:
   dup:false — שורה שהדוגם הוסיף ומילא חופשי; dup:true — חזרה (בקרת איכות) של שורה אחרת.
   after — מזהה השורה שהחזרה מוצגת מתחתיה; "" — בסוף הטבלה */
function blankExtra(){
  return {id:crypto.randomUUID(), dup:false, after:"", name:"", depth:"", time:"", pid:"", dayLetter:"",
    tool:"צנצנת", packs:"1", stype:"חטף", tests:[], note:"", auto:["tool","packs","stype"]};
}

const newId = () => `day-${todayISO()}-${crypto.randomUUID().slice(0,8)}`;

/* רשומת גז קרקע: סקר אחד — התקנה (inst) ודיגום (samp), לרוב בימים שונים ובידי דוגמים שונים.
   mode: full — ההתקנה נרשמת ברשומה הזו (או מיובאת); manual — דיגום בלבד, פרטי ההתקנה מוקלדים מטופס 59.
   wells — טבלת הבארות: שדות ההתקנה (טופס 59.1) ושדות הדיגום (טופס 59) של כל באר.
   imported — כשההתקנה יובאה מקובץ של אייפד אחר: {from, by, exportedAt, at, file}. חלק ההתקנה אז לקריאה בלבד */
function blankGas(mode){
  return {mode:mode==="manual"?"manual":"full",
    /* ברירות מחדל (דני, 26.11.2026): צנרת טפלון 1/4 אינץ׳. ב-auto — השינוי הראשון מהן אינו נרשם */
    inst:{date:"", s1:"", weather:[], method:"", methodOther:"", boreDia:"", tubeType:"טפלון", tubeDia:"1/4 אינץ׳", probe:"", auto:["tubeType","tubeDia"],
      pid:"", lamp:"", pidOpen:"", calLab:false, cal100:false, notes:""},
    samp:{date:"", s1:"", weather:[], instDate:"", tube:"טפלון 1/4 אינץ׳", auto:["tube"], purgeVols:"", canSupplier:"", canSupplierOther:"", canDate:"",
      pid:"", lamp:"", calLab:false, cal100:false, deviation:"", notes:"", notesSplit:""},
    wells:[], blanks:[], imported:null};
}
/* באר. שדות ההתקנה — כסדר העמודות בטופס 59.1, בלי עמודת המלט (ירד מהוראת העבודה, החלטת דני 16.11.2026).
   שדות הדיגום — כסדר העמודות בטופס 59. dup — אנליזת חזרה מאותו קניסטר; split — קניסטר שני במפצל T, למעבדה המשנית */
function blankWell(name){
  return {id:crypto.randomUUID(), name:name||"",
    tStart:"", tEnd:"", pidHole:"", perm:"", sand:false, bentGran:false, bentWet:false, depth:"", profile:"", note:"",
    can:"", vol:"", vacFrom:"", vacTo:"", flow:"", purgeMin:"", purgeVols:"", pidAfter:"", ipa:false, sStart:"", sEnd:"",
    canFrom:"", canTo:"", to15:true, sNote:"", dup:false, split:false, spCan:"", spVol:"", spCanFrom:"", spCanTo:"",
    /* נ"צ (ITM), דיוק במטרים, שעה, מקור (GPS / ידני), ובאיזה יום נמדד (inst / samp) — ראה COORD_KEYS */
    gx:"", gy:"", gacc:"", gt:"", gsrc:"", gday:"",
    auto:[]};
}
/* בלאנק: EB — בלאנק חומרים (מחובר לרכבת הדיגום, משמש גם כבלאנק רקע); AB — בלאנק רקע, אוויר באתר */
function blankBlank(type){
  return {id:crypto.randomUUID(), type:type==="AB"?"AB":"EB", name:"", can:"", vol:"", sStart:"", sEnd:"",
    canFrom:"", canTo:"", to15:true, note:"", auto:[]};
}
/* שם הבאר הבאה: המספר שבסוף השם הקודם גדל באחד (SG-3 ← SG-4) */
const nextWellName = prev => { const m=String(prev||"").match(/^(.*?)(\d+)$/); return m ? m[1]+(Number(m[2])+1) : ""; };

function blankDay(id){
  return {
    v:1, id:id||newId(), kind:"soil", locked:false, updated:"",
    head:{
      site:"", address:"", date:todayISO(), client:"", clientRep:"", contact:"", billTo:"",
      weather:[], landuse:"", gwl:"", pid:"", pidOpen:"", rig:"", rigOther:"",
      s1:"", s2:"", approver:"", arrive:"", finish:"", tStart:"", tEnd:"",
      accredited:true, ready5556:false, cooled:true, subDrill:false, subSample:false,
      calLab:false, cal100:false,
      /* מהדורה 22: planDeclared — תוכנית מאושרת על פי הצהרת יועץ; planShown — תוכנית מאושרת שהוצגה למעבדה.
         planApproved (תוכנית מאושרת, בלי ציון איך) — ממהדורה 21. נשמר ברשומות ישנות, לא מוצג ולא מודפס */
      guideSurvey:false, guidePiles:false, planApproved:false, planDeclared:false, planShown:false,
      /* lab / labSplit: שם מ-LABS או "אחר", ואז השם המוקלד ב-labOther / labSplitOther. לשם המודפס — labName() */
      dayLetter:"A", lab:"", labOther:"", labSplit:"", labSplitOther:"", extraTests:Array(EXTRA_N).fill(""),
      notesLog:"", notesCoc:"", notesSplit:""
    },
    samples:[blankSample()], deviations:[],
    cocExtra:[], splitExtra:[],
    /* tempOk — ברירת מחדל "תקין" (דני, 24.11.2026); auto כמו בדגימה: הבחירה הראשונה בו אינה שינוי */
    storage:{place:"", keeper:"", fromD:"", fromT:"", toD:"", toT:"", tempOk:"תקין", auto:["tempOk"]},
    /* הפיצולים נמסרים למעבדה אחרת — מסירה וקבלה נפרדות, וחתימות bySplit / labSplit */
    handover:{byName:"", byDate:"", byTime:"", labName:"", labDate:"", labTime:""},
    handoverSplit:{byName:"", byDate:"", byTime:"", labName:"", labDate:"", labTime:""},
    /* gi / gs — חתימות הדוגם ביום ההתקנה וביום הדיגום של גז קרקע */
    sigs:{s1:"", s2:"", by:"", lab:"", bySplit:"", labSplit:"", gi:"", gs:""},
    sketch:"", sketchPhoto:"", changes:[],
    /* גז קרקע: עמודי תעודת הניקיון של הקניסטרים, מצולמים (JPEG data URL). נשמרים מחוץ למסמך היום, כמו צילום השרטוט */
    canCert:[], certN:0,
    /* צילומי שטח — רק התיאור; התמונות ב-IndexedDB "photo" (ראה צילומי שטח) */
    photos:[],
    /* קרקע: נ"צ לכל קידוח — {מס' קידוח: {x, y, acc, t, src}}. נכנס לאקסל (יומן שדה) בלבד, לא לטפסים */
    coords:{},
    gas:blankGas()
  };
}
/* רשומה חדשה מהסוג שנבחר. בגז, תאריך היום נכנס ליום שהרשומה מתחילה בו */
function blankRecord(kind, mode){
  const d=blankDay();
  if(kind!=="gas") return d;
  d.kind="gas"; d.head.date=""; d.head.dayLetter="";
  d.gas=blankGas(mode);
  d.gas[d.gas.mode==="manual"?"samp":"inst"].date=todayISO();
  return d;
}
const isGas = (d=S) => d.kind==="gas";
/* התאריך שמזהה את הרשומה ברשימה: בגז — יום הדיגום, ועד שנקבע — יום ההתקנה */
const recDate = d => isGas(d) ? (d.gas.samp.date || d.gas.inst.date || "") : (d.head.date || "");
/* מבצע השינוי בתיעוד: דוגם 1 בקרקע. בגז — שינוי בפרטי ההתקנה ובחתימתה נרשם על הדוגם של יום ההתקנה;
   כל שינוי אחר — על הדוגם של יום הדיגום, ועד שנבחר — של יום ההתקנה */
const INST_KEY = /^(gas\.inst\.|gas\.well\.inst\.|sig\.gi$)/;
const actor = key => (!isGas() ? S.head.s1
  : INST_KEY.test(key||"") ? S.gas.inst.s1
  : (S.gas.samp.s1 || S.gas.inst.s1)) || "לא נבחר דוגם";

/* משלים שדות חסרים ברשומות שנשמרו בגרסאות קודמות */
function normalize(d){
  const b=blankDay(d.id);
  const n={...b, ...d,
    head:{...b.head, ...(d.head||{})}, storage:{...b.storage, ...(d.storage||{})},
    handover:{...b.handover, ...(d.handover||{})}, handoverSplit:{...b.handoverSplit, ...(d.handoverSplit||{})},
    sigs:{...b.sigs, ...(d.sigs||{})}};
  /* רשומות מלפני גז הקרקע הן רשומות קרקע */
  n.kind = d.kind==="gas" ? "gas" : "soil";
  /* רשומה מלפני ברירת המחדל של הטמפרטורה — נשארת כמו שהייתה */
  if(!Array.isArray((d.storage||{}).auto)){
    n.storage.auto=[];
    if(!d.storage || !("tempOk" in d.storage)) n.storage.tempOk="";
  }
  n.canCert = Array.isArray(d.canCert) ? d.canCert : [];
  n.photos = Array.isArray(d.photos) ? d.photos.filter(p=>p && p.id) : [];
  n.certN = n.canCert.length || Number(d.certN) || 0;
  n.coords = d.coords && typeof d.coords==="object" && !Array.isArray(d.coords) ? d.coords : {};
  const g=d.gas||{};
  n.gas={...b.gas, ...g, mode:g.mode==="manual"?"manual":"full",
    /* רשומה מלפני ברירות המחדל של הצנרת — נשארת כמו שהייתה, וכל שינוי בה נרשם */
    inst:{...b.gas.inst, ...(g.inst ? {tubeType:"", tubeDia:"", auto:[], ...g.inst} : {})},
    samp:{...b.gas.samp, ...(g.samp ? {tube:"", auto:[], ...g.samp} : {})},
    wells:(Array.isArray(g.wells)?g.wells:[]).map(w=>({...blankWell(), ...w})),
    blanks:(Array.isArray(g.blanks)?g.blanks:[]).map(b=>({...blankBlank(b.type), ...b})), imported:g.imported||null};
  /* שם מעבדה שהוקלד חופשי בגרסאות קודמות ואינו ברשימה — עובר ל"אחר" עם אותו שם, כך שהמודפס לא משתנה */
  for(const k of ["lab","labSplit"]){
    const v=String(n.head[k]||"").trim();
    if(v && v!==OTHER && !LABS.includes(v)){ n.head[k+"Other"]=n.head[k+"Other"]||v; n.head[k]=OTHER; }
  }
  /* עמודות פתוחות: שם שהפך לעמודה קבועה (TPH GRO במהדורה 22) יוצא מהן, השאר נדחסות לפי הסדר.
     עמודה פתוחה מעבר לארבע — נשמרת, אבל אין לה מקום בטופס */
  const fixed=new Set(TESTS.map(x=>x.toUpperCase()));
  const ex=(Array.isArray(n.head.extraTests)?n.head.extraTests:[])
    .map(x=>String(x||"").trim()).filter(x=>x && !fixed.has(x.toUpperCase()));
  n.head.extraTests=Array.from({length:Math.max(EXTRA_N,ex.length)},(_,i)=>ex[i]||"");
  const tests=t=>(t||[]).map(x=>TEST_OLD[x]||x);
  n.samples=(d.samples||[]).map(s=>{
    const b=blankSample(), m={...b, ...s, sp:{...b.sp, ...(s.sp||{})}};
    m.tests=tests(m.tests); m.sp.tests=tests(m.sp.tests);
    return m;
  });
  if(!n.samples.length) n.samples=[blankSample()];
  for(const k of ["cocExtra","splitExtra"])
    n[k]=(Array.isArray(d[k])?d[k]:[]).map(e=>{ const m={...blankExtra(), ...e}; m.tests=tests(m.tests); return m; });
  if(!n.id) n.id="day-"+n.head.date;
  return n;
}

let S = blankDay();

let db=null, unsubDay=null, saveT=null, suppress=false, flash=null;

/* ============ change log ============
   נרשם רק שינוי של ערך קיים, אחרי שהתייצב. הזנה ראשונה לשדה ריק אינה שינוי —
   כך גם נגיעה בשדה שעת/תאריך, שבאייפד ממלאת ערך מעצמה, לא נרשמת.
   מבצע השינוי הוא תמיד דוגם 1. */
const COMMIT_MS = 3000;
const pendingChg = new Map();

/* תקופת למידה (מ-22.10.2026, החלטת דני): לפני כל שינוי שנרשם בתיעוד נשאל הדוגם "האם לתעד שינוי?".
   השינוי נרשם בכל מקרה — התשובה רק נשמרת לידו (ask, ו-k = מפתח השדה), ונשלחת לדני מלשונית תיעוד השינויים.
   לפי התשובות יעודכנו הכללים מתי לתעד. כבוי מ-26.11.2026 (דני), אחרי ניתוח התשובות של אורן: 56 שינויים, 53 "כן" */
const ASK_LOG = false;
/* תיבת סימון נרשמת כ-true/false — לדוגם מוצג "מסומן" / "לא מסומן" */
const shown = v => v==="true" ? "מסומן" : v==="false" ? "לא מסומן" : (v || "ריק");
const askQueue = [];
let asking = false;
function askLog(label, from, to){
  const q = {ask:"", entry:null};
  askQueue.push({q, label, from, to});
  nextAsk();
  return q;
}
function nextAsk(){
  if(asking || !askQueue.length) return;
  asking = true;
  const {q, label, from, to} = askQueue.shift();
  const answer = a => {
    m.remove(); q.ask = a;
    /* השינוי כבר נרשם (עברו 3 שניות) — התשובה נכתבת לרשומה שלו */
    if(q.entry){ q.entry.ask = a; save(); }
    asking = false; nextAsk();
  };
  const m = el("div",{class:"modal",role:"dialog","aria-modal":"true"},
    el("div",{class:"card"},
      el("h2",{},"האם לתעד שינוי?"),
      el("div",{class:"sub",style:"overflow-wrap:anywhere"}, el("b",{},label), el("br"), `${shown(from)} ← ${shown(to)}`),
      el("div",{class:"note",style:"margin-top:10px"},
        "השינוי נרשם בתיעוד בכל מקרה. התשובה עוזרת לקבוע מתי צריך לתעד שינוי ומתי לא."),
      el("div",{class:"bar"},
        el("button",{class:"btn",type:"button",onclick:()=>answer("כן")},"כן, לתעד"),
        el("span",{class:"spacer"}),
        el("button",{class:"btn ghost",type:"button",onclick:()=>answer("לא")},"לא צריך לתעד"))));
  document.body.append(m);
}

/* כללי התיעוד — החלטת דני 29.10.2026, אחרי סבב התשובות הראשון של "האם לתעד שינוי?":
   1. סימון ראשון של תיבה אינו שינוי — "לא מסומן" הוא ברירת מחדל, לא ערך שהדוגם הזין. ביטול סימון נרשם.
   2. תיקון ערך קיים נרשם, כמו קודם.
   3. אנליזות: הוספה אינה שינוי. הסרת אנליזה שכבר נבחרה נרשמת.
   4. מחיקת שורה ריקה מהמשמורת אינה נרשמת (deleteRow).
   5. חתימות, מסירה ושרטוט נרשמים תמיד. אחרי שמעבדה חתמה, סעיפים 1 ו-3 לא חלים: כל סימון והוספה נרשמים */
const flat = x => Array.isArray(x) ? x.join(", ") : (x ?? "");
const labSignedAny = () => Object.values(HAND).some(H=>!!S.sigs[H.lab]);
function isChange(from, to, key){
  const f = String(flat(from)), t = String(flat(to));
  if(f === t) return false;
  const signed = labSignedAny();
  if(from === false && !signed) return false;
  if(f === "") return false;
  /* 6. חתימה חוזרת או מחיקה של חתימת המוסר לפני שנציג המעבדה חתם — לא נרשמת.
     תשובות אורן (26.11.2026): פעמיים "לא" על חתימת המוסר, לפני חתימת המעבדה */
  const H = Object.values(HAND).find(H=>key==="sig."+H.by);
  if(H && !S.sigs[H.lab]) return false;
  if(/\.tests$/.test(key) && !signed && Array.isArray(from) && Array.isArray(to))
    return from.some(x=>!to.includes(x));
  return true;
}

function commitChange(key){
  const rec = pendingChg.get(key);
  pendingChg.delete(key);
  if(!rec) return false;
  clearTimeout(rec.timer);
  if(!isChange(rec.from, rec.to, key)) return false;
  const entry = {t:stamp(), who:actor(key), label:rec.label,
                 from:String(flat(rec.from)), to:String(flat(rec.to))};
  if(rec.q){ entry.ask = rec.q.ask; entry.k = key; rec.q.entry = entry; }
  S.changes.push(entry);
  return true;
}
/* לפני מעבר רשומה או סגירת הדף — שינוי שטרם התייצב לא ילך לאיבוד או יירשם ברשומה הלא נכונה */
function flushChanges(){ for(const k of [...pendingChg.keys()]) commitChange(k); }

function logChange(label, from, to, key){
  if(suppress) return;
  key = key || label;
  const prev = pendingChg.get(key);
  /* הערך המקורי נשמר כמו שהוא (מערך, בוליאני) — כללי התיעוד בודקים את סוגו */
  const origin = prev ? prev.from : Array.isArray(from) ? [...from] : from;
  if(prev) clearTimeout(prev.timer);
  /* שואלים פעם אחת לכל שינוי שיירשם. עריכות חוזרות באותו שדה לפני הרישום — אותה שאלה */
  let q = prev ? prev.q : null;
  if(!q && ASK_LOG && isChange(origin, to, key)) q = askLog(label, String(flat(origin)), String(flat(to)));
  const timer = setTimeout(()=>{ if(commitChange(key)) save(); }, COMMIT_MS);
  pendingChg.set(key, {label, from:origin, to, timer, q});
}

function setHead(k,v,label){ logChange(label,S.head[k],v,"head."+k); S.head[k]=v; save(); }
function setSub(obj,k,v,label,key){
  if(Array.isArray(obj.auto) && obj.auto.includes(k)) obj.auto=obj.auto.filter(x=>x!==k);
  else logChange(label,obj[k],v,key||label);
  obj[k]=v; save();
}
function setSample(sm,k,v,label){
  /* ערך שהועתק לשורה חדשה אינו הזנה של הדוגם — הבחירה הראשונה בו אינה שינוי */
  if(sm.auto.includes(k)) sm.auto=sm.auto.filter(x=>x!==k);
  else logChange(`${label} · ${sm.name||"דגימה חדשה"}`, sm[k], v, sm.id+"."+k);
  sm[k]=v;
  if((k==="boring"||k==="depth") && sm.nameAuto) sm.name = autoName(sm);
  save();
}
function setSplit(sm,k,v,label){
  if(sm.auto.includes("sp."+k)) sm.auto=sm.auto.filter(x=>x!=="sp."+k);
  else logChange(`פיצול — ${label} · ${sm.name||"דגימה"}`, sm.sp[k], v, sm.id+".sp."+k);
  sm.sp[k]=v; save();
}
/* שורה שנוספה במשמורת. ערכים שהועתקו לחזרה מסומנים ב-auto, כמו בשורה חדשה ביומן */
function setExtra(e,k,v,label,isSplit){
  if(e.auto.includes(k)) e.auto=e.auto.filter(x=>x!==k);
  else logChange(`${isSplit?"פיצול — ":""}${label} · ${e.name||"שורה חדשה"}`, e[k], v, e.id+"."+k);
  e[k]=v; save();
}
function setColor(sm,i,x){
  const c=[sm.color[0]||"", sm.color[1]||""]; c[i]=x;
  setSample(sm,"color",[...new Set(c.filter(Boolean))],"צבע");
}
function autoName(sm){
  const b=(sm.boring||"").trim(), d=(sm.depth||"").toString().trim();
  return b && d ? `${b}-${d}` : b || "";
}

/* ============ records — כל יום דיגום הוא רשומה נפרדת ============ */
const K_INDEX="vasa-index", K_CUR="vasa-current", K_OLD="vasa-day", kDoc=id=>"vasa-doc:"+id;
let localIdx=[], remoteIdx=new Map(), storageFull=false;

function fmtDate(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}.${m}.${y.slice(2)}`; }
function docTitle(d){
  const h=d.head||{};
  if(isGas(d)) return [(h.site||"").trim()||"ללא שם אתר", "גז קרקע", fmtDate(recDate(d)), d.gas.samp.s1||d.gas.inst.s1||""]
    .filter(Boolean).join(" · ");
  return [(h.site||"").trim()||"ללא שם אתר", fmtDate(h.date), h.dayLetter?`יום ${h.dayLetter}`:"", h.s1||""]
    .filter(Boolean).join(" · ");
}
function meta(d){
  return {id:d.id, kind:d.kind||"soil", title:docTitle(d), date:recDate(d), client:d.head.client||"",
    n:isGas(d) ? d.gas.wells.length : d.samples.filter(s=>s.boring||s.depth||s.name).length,

const pristine = d => !d.updated;
function readJSON(key){ try{ return JSON.parse(localStorage.getItem(key)); }catch(e){ return null; } }

function allDocs(){
  const m=new Map();
  const put=e=>{ const o=m.get(e.id); if(!o || (e.updated||"")>=(o.updated||"")) m.set(e.id,e); };

/* ============ persistence ============ */
/* עמודי תעודת הניקיון ב-IndexedDB: עמוד מצולם הוא כחצי מיליון תווים, וכל localStorage באייפד כ-5MB —
   כמה תעודות ממלאות אותו והשינויים לא נשמרים (23.11.2026). בלי IndexedDB העמודים נשארים ברשומה, כמו קודם.
   certMoved — רשומות שהעמודים שלהן כבר שם; certN — כמה עמודים יש, כדי לדעת לטעון */
const certMoved=new Set();
let certDb=null, certFail="", certJob=Promise.resolve();
const certDo=f=>certJob=certJob.then(f,f);
function certOpen(){
  if(!certDb) certDb=new Promise((res,rej)=>{
    const q=indexedDB.open("vasa-files",3);
    q.onupgradeneeded=()=>{ for(const n of ["cert","gone","photo"]) if(!q.result.objectStoreNames.contains(n)) q.result.createObjectStore(n); };
    q.onsuccess=()=>{ const d=q.result; d.onversionchange=()=>{ d.close(); certDb=null; }; res(d); };
    q.onerror=()=>rej(q.error); q.onblocked=()=>rej(new Error("blocked"));
  }).catch(e=>{ certDb=null; throw e; });
  return certDb;
}
async function certTx(mode,f,store="cert"){
  const d=await certOpen();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,mode), q=f(t.objectStore(store));
    t.oncomplete=()=>res(q.result); t.onerror=t.onabort=()=>rej(t.error||new Error("aborted"));
  });
}
const certGet=async id=>(await certTx("readonly",s=>s.get(id)))||[];
/* כתיבה, ואז קריאה חזרה — רק אחרי שהעמודים נקראו שלמים מותר להוציא אותם מהרשומה */
async function certPut(id,pages){
  await certTx("readwrite",s=>s.put(pages,id));
  if(JSON.stringify(await certGet(id))!==JSON.stringify(pages)) throw new Error("הבדיקה אחרי השמירה נכשלה");
  certMoved.add(id);
}
/* שינוי בעמודים של הרשומה id. נקרא רק מתוך certDo */
async function certSet(id,pages){

  if(S.id===id){ S.canCert=pages; S.certN=pages.length; save(); }
}
/* בפתיחת רשומה: עמודים שעוד בתוכה (גרסה קודמת) עוברים ל-IndexedDB; אחרת נטענים משם */
const loadCert=()=>certDo(async()=>{
  const id=S.id;
  if(!isGas()) return;
  if(S.canCert.length && !certMoved.has(id)){
    const n=S.canCert.length;
    try{ await certPut(id,S.canCert); }catch(e){ return; }
    if(S.id===id){ S.certN=n; persistLocal(); render(); }
  }else if(S.certN && !S.canCert.length){
    try{
      const pages=await certGet(id);
      if(S.id!==id) return;
      if(!pages.length) throw new Error("empty");
      certMoved.add(id); S.canCert=pages; S.certN=pages.length; certFail="";
    }catch(e){ if(S.id!==id) return; certFail=id; }

});
/* פעם אחת בפתיחת האפליקציה: מפנה את האחסון מהרשומות האחרות */
const moveOldCerts=()=>certDo(async()=>{

/* ---------- נפח האחסון ומחיקת רשומות (דני, 23.11.2026; מחיקה בכל זמן — דני, 24.11.2026) ----------
   המסמכים נשמרים בתיק הלקוח בענן. הדוגם מוחק רשומה מהאייפד מתי שירצה, אחת אחת, חוץ מהרשומה הפתוחה.
   כשהאחסון מגיע ל-80% האפליקציה מציעה בעצמה רק רשומות מעל חודש וחצי — מהישנה לחדשה, עד כ-50%.
   תיעוד השינויים של רשומה שנמחקה נשאר במכשיר (IndexedDB, "gone"): בקרקע הוא לא נמצא ב-PDF */
const DEL_DAYS=45, STORE_WARN=.8, STORE_TARGET=.5, K_CAP="vasa-cap", K_ASKED="vasa-store-asked", STORE_5MB=5*1024*1024;
/* גודל כפי שהדפדפן סופר: בית לתו, ושניים כשיש תו שאינו לטיני */
const strBytes=x=>x.length*(/[^\x00-\xff]/.test(x)?2:1);
const keyBytes=k=>strBytes(k)+strBytes(localStorage.getItem(k)||"");
function storeUsed(){
  let n=0;
  try{ for(let i=0;i<localStorage.length;i++) n+=keyBytes(localStorage.key(i)); }catch(e){}
  return n;
}
/* הנפח המרבי אינו ידוע מראש: מניחים 5MB. נכשלה שמירה לפני כן — זה הנפח; נכנס יותר — הנפח כפול */
function storeCap(used){
  let cap=STORE_5MB;
  try{ cap=Number(localStorage.getItem(K_CAP))||cap; }catch(e){}
  return used>cap ? Math.max(2*STORE_5MB,used) : cap;
}
/* אחרי שמירה שנכשלה — המכשיר מלא, גם אם ההערכה של הנפח גדולה יותר */
function storeState(){ const used=storeUsed(), c=storeCap(used), cap=storageFull?Math.min(c,used):c; return {used, cap, pct:used/cap}; }
/* ימים מהעבודה או מהעריכה האחרונה, המאוחר מביניהם — תאריך שהוזן בטעות לא הופך רשומה טרייה לישנה */
function ageDays(e){
  const last=Math.max(Date.parse(e.date||"")||0, Date.parse(e.updated||"")||0);
  return last ? Math.floor((Date.now()-last)/864e5) : 0;
}
const canDelete=e=>e.id!==S.id && localIdx.some(x=>x.id===e.id);
/* מה שהאפליקציה מציעה בעצמה כשהאחסון מתמלא — רק רשומות ישנות */
const canOffer=e=>canDelete(e) && ageDays(e)>=DEL_DAYS;
const goneAll=()=>certTx("readonly",s=>s.getAll(),"gone");
/* מוחק רשומה אחת. תיעוד השינויים נשמר ונקרא חזרה לפני המחיקה; אם נכשל — לא מוחקים */
const deleteDoc=id=>certDo(async()=>{
  const d=readJSON(kDoc(id));
  if(!d || id===S.id) return false;
  const m=meta(normalize(d));
  if(!canDelete(m)) return false;
  const g={id, kind:m.kind, title:m.title, date:m.date, client:m.client, updated:m.updated, locked:m.locked, n:m.n,
    deletedAt:stamp(), changes:d.changes||[]};
  try{
    await certTx("readwrite",s=>s.put(g,id),"gone");
    if(JSON.stringify(await certTx("readonly",s=>s.get(id),"gone"))!==JSON.stringify(g)) throw new Error("verify");
  }catch(e){ alert("הרשומה לא נמחקה: לא ניתן היה לשמור את תיעוד השינויים שלה."); return false; }
  if(id===S.id) return false;
  try{
    localStorage.removeItem(kDoc(id));
    localIdx=localIdx.filter(e=>e.id!==id);
    localStorage.setItem(K_INDEX, JSON.stringify(localIdx));
  }catch(e){}
  certMoved.delete(id);
  try{ await certTx("readwrite",s=>s.delete(id)); }catch(e){}
  for(const p of Array.isArray(d.photos)?d.photos:[]) try{ await certTx("readwrite",s=>s.delete(p.id),"photo"); }catch(e){}
  return true;
});
function askDelete(e){

/* כמה רשומות ישנות, מהישנה לחדשה, צריך למחוק כדי לרדת ליעד */
function cleanupPlan(st){
  const plan=[];
  let left=st.used;
  const old=localIdx.filter(canOffer).sort((a,b)=>ageDays(b)-ageDays(a));
  for(const e of old){
    if(left<=st.cap*STORE_TARGET) break;
    const size=keyBytes(kDoc(e.id));
    plan.push({e,size}); left-=size;
  }
  return plan;
}
const pctText=x=>`${Math.round(x*100)}%`;
/* מופיעה בפתיחה, בחזרה לאפליקציה, במעבר רשומה, וכשהאחסון התמלא. "לא עכשיו" — לא שואלת שוב עד מחר */
function checkStorage(){
  if(document.querySelector(".modal")) return;
  const st=storeState();
  if(st.pct<STORE_WARN && !storageFull) return;
  const tag=todayISO()+(storageFull?"!":"");
  try{ if(localStorage.getItem(K_ASKED)===tag) return; }catch(e){}
  const plan=cleanupPlan(st), pick=new Set(plan.map(p=>p.e.id));
  const later=()=>{ try{ localStorage.setItem(K_ASKED,tag); }catch(e){} m.remove(); };
  const card=el("div",{class:"card"}), m=el("div",{class:"modal",role:"dialog","aria-modal":"true"},card);
  let busy=false;
  const run=async()=>{
    busy=true; paint();
    let done=0;
    for(const p of plan) if(pick.has(p.e.id)){ if(!await deleteDoc(p.e.id)) break; done++; }
    if(!pristine(S)) persistLocal();
    await loadGone();

    render();

    const freed=plan.filter(p=>pick.has(p.e.id)).reduce((a,p)=>a+p.size,0);
    card.textContent="";
    card.append(...el("div",{},
      el("h2",{},storageFull?"האחסון במכשיר מלא":`האחסון במכשיר הגיע ל-${pctText(st.pct)}`),
      el("div",{class:"sub"},plan.length
        ? `למחוק מהאייפד רשומות ישנות (מעל חודש וחצי)? ודא שהמסמכים שלהן בתיק הלקוח בענן. לחיצה על רשומה משאירה אותה. אחרי המחיקה: כ-${pctText((st.used-freed)/st.cap)}. תיעוד השינויים נשמר`
        : "אין במכשיר רשומות ישנות מחודש וחצי, ולכן אין מה למחוק. שולחים את הקבצים של הרשומה הפתוחה במייל ופונים לדני."),
      storageFull?el("div",{class:"note warn",style:"margin-bottom:12px"},"השינוי האחרון לא נשמר. לא סוגרים את האפליקציה."):null,
      plan.length?el("div",{class:"picks"},plan.map(p=>el("button",{class:"chip",type:"button",disabled:busy,
          "aria-pressed":String(pick.has(p.e.id)),
          onclick:()=>{ pick.has(p.e.id)?pick.delete(p.e.id):pick.add(p.e.id); paint(); }},
        el("span",{class:"ck","aria-hidden":"true"},pick.has(p.e.id)?"✓":""),
        `${p.e.title}${p.e.locked?"":" · לא נעולה"}`))):null,
      el("div",{class:"bar"},
        plan.length?el("button",{class:"btn warnb",type:"button",disabled:busy||!pick.size,onclick:run},
          busy?"מוחק…":pick.size===1?"מחיקת רשומה אחת":`מחיקת ${pick.size} רשומות`):null,
        el("span",{class:"spacer"}),
        el("button",{class:"btn ghost",type:"button",disabled:busy,onclick:later},plan.length?"לא עכשיו":"הבנתי"))).childNodes);
  };
  paint(); document.body.append(m);
}

let goneN=0;
const loadGone=()=>certDo(async()=>{ try{ goneN=(await goneAll()).length; }catch(e){} });
function persistLocal(){
  try{
    localStorage.setItem(kDoc(S.id), JSON.stringify(certMoved.has(S.id) ? {...S, canCert:[]} : S));
    localIdx = localIdx.filter(e=>e.id!==S.id).concat([meta(S)]);
    localStorage.setItem(K_INDEX, JSON.stringify(localIdx));
    localStorage.setItem(K_CUR, S.id);
    storageFull=false;
    try{ const c=localStorage.getItem(K_CAP); if(c && storeUsed()>Number(c)) localStorage.removeItem(K_CAP); }catch(e){}
  }catch(e){

      try{

/* רשומה ריקה שנשמרה רק כדי לזכור את סוגה (גז קרקע) — יוצאת מהמכשיר כשעוברים ממנה בלי שנגעו בה */

async function attachRemote(){
  if(!db) return;
  const id=S.id, r=refsFor(id);

    const [d,g,l,p,c]=await Promise.all([r.day.get(),r.sig.get(),r.log.get(),r.shot.get(),r.cert.get()]);
    if(S.id!==id) return;
    /* data() מוחזר מוקפא — עותק, כדי שאפשר יהיה להמשיך לערוך */
    suppress=true;
    const next={...S};
    if(d.exists) Object.assign(next, structuredClone(d.data()));
    if(g.exists){ const {sketch,...sg}=structuredClone(g.data()); next.sigs={...next.sigs,...sg}; next.sketch=sketch||""; }
    if(l.exists) next.changes=structuredClone(l.data().items||[]);
    if(p.exists) next.sketchPhoto=p.data().photo||"";
    if(c.exists && (c.data().pages||[]).length) next.canCert=[...c.data().pages];
    S=normalize(next);
    suppress=false;
    if(d.exists) persistLocal();

  }catch(e){ suppress=false; setPill("local"); }

  },()=>setPill("local"));

function migrateOld(){
  const old=readJSON(K_OLD);
  if(!old) return;
  try{
    const d=normalize(old);
    if(d.changes.length || d.head.site || d.samples.some(s=>s.boring||s.depth)){
      if(!d.updated) d.updated=stamp();
      if(!localStorage.getItem(kDoc(d.id))){
        localStorage.setItem(kDoc(d.id), JSON.stringify(d));
        localIdx=localIdx.filter(e=>e.id!==d.id).concat([meta(d)]);
        localStorage.setItem(K_INDEX, JSON.stringify(localIdx));
      }
      if(!localStorage.getItem(K_CUR)) localStorage.setItem(K_CUR, d.id);
    }
    localStorage.removeItem(K_OLD);
  }catch(e){}
}

/* דגימות היומן שסומנו למשמורת / לפיצול */
const cocRows   = () => S.samples.filter(s=>s.toCoc);
const splitRows = () => S.samples.filter(s=>s.toSplit);
const extras    = isSplit => isSplit ? S.splitExtra : S.cocExtra;
/* כל שורות טופס 33.1, בסדר ההדפסה: הדגימות מהיומן, השורות שנוספו במשמורת,
   וכל חזרה מתחת לשורה שממנה נעשתה. חזרה שהשורה שלה ירדה מהמשמורת — בסוף.
   לכל שורה: bag — היכן נשמרים כלי הדיגום, האריזות, הסוג והאנליזות; x — השורה הנוספת, אם זו כזו */
function custodyRows(isSplit){
  const fromLog=s=>{ const b=isSplit?s.sp:s;
    return {id:s.id, src:s, x:null, bag:b, name:s.name, depth:s.depth, time:s.time, pid:s.pid,
      dayLetter:s.dayLetter, note:isSplit?b.note:s.cocNote, dup:false}; };
  const added=e=>({id:e.id, src:null, x:e, bag:e, name:e.name, depth:e.depth, time:e.time, pid:e.pid,
    dayLetter:e.dayLetter, note:e.note, dup:e.dup});
  const list=[...(isSplit?splitRows():cocRows()).map(fromLog), ...extras(isSplit).filter(e=>!e.after).map(added)];
  let wait=extras(isSplit).filter(e=>e.after), moved=true;
  while(wait.length && moved){
    moved=false;
    wait=wait.filter(e=>{
      const at=list.findIndex(r=>r.id===e.after);
      if(at<0) return true;
      let j=at+1;
      while(j<list.length && list[j].x && list[j].x.after===e.after) j++;
      list.splice(j,0,added(e)); moved=true;
      return false;
    });
  }
  return list.concat(wait.map(added));
}
const hasSplit = () => isGas() ? S.gas.wells.some(w=>w.split) : custodyRows(true).length>0;
/* חזרות ופיצולים נדרשים, לפי מספר הדגימות במשמורת (בלי החזרות עצמן) */
function qcNeeded(){
  const rows=custodyRows(false), n=rows.filter(r=>!r.dup).length;
  const dup = n===0?0:(n<10?1:Math.ceil(n/20));
  const spl = n<=9?0:Math.ceil(n*0.1);
  return {n, dup, spl, haveDup: rows.filter(r=>r.dup).length, haveSpl: custodyRows(true).filter(r=>!r.dup).length,
    /* חזרה ופיצול אינם נשלחים ל-VOC ול-TPH GRO */
    badDup: rows.filter(r=>r.dup && r.bag.tests.some(t=>/^VOC$|GRO/i.test(t.trim())))};
}

const el=(t,a={},...kids)=>{
  const n=document.createElement(t);
  for(const[k,v] of Object.entries(a)){
    if(v===false||v==null) continue;
    if(k==="class") n.className=v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2),v);
    else n.setAttribute(k, v===true?"":v);
  }
  for(const k of kids.flat()) if(k!=null) n.append(k.nodeType?k:document.createTextNode(k));
  return n;
};

/* שינוי שמגיע משדה: הבנייה מחדש נדחית עד שהמעבר לשדה הבא הסתיים (renderSoon), כדי שהשדה שנגעו בו לא יוחלף */
let typing=0;
const fromField=on=>v=>{ typing++; try{ on(v); } finally{ typing--; } };
function txt(val,on,opts={}){
  on=fromField(on);
  const i=el("input",{type:opts.type||"text", value:val||"", placeholder:opts.ph||"",
    step:opts.type==="number"?"any":null, disabled:RO()});
  if(opts.type==="time"||opts.type==="date"){
    /* באייפד גלגלת השעה/התאריך שולחת change בכל סיבוב. שמירה בכל סיבוב בונה את המסך מחדש
       וחלונית הגלגלת קופצת — לכן הערך נשמר רק כשהחלונית נסגרת */
    let dirty=false, pre=false;
    /* לוח שנה ריק נפתח באייפד על חודש אחר (דני, 26.11.2026: "נפתח באוגוסט") — שדה תאריך ריק מקבל את התאריך של היום
       ברגע שנוגעים בו, לפני שהלוח נפתח. סגירה בלי שינוי משאירה את היום — כמו שעה, שהאייפד ממלא מעצמו */
    if(opts.type==="date"){
      const today=()=>{ if(!i.value && !i.disabled){ i.value=todayISO(); pre=true;
        /* נגיעה בזמן גלילה לא פותחת את הלוח — מחזירים לריק, כדי שלא יוצג תאריך שלא נשמר */
        setTimeout(()=>{ if(pre && document.activeElement!==i){ pre=false; i.value=""; } },800); } };
      i.addEventListener("touchstart",today,{passive:true}); i.addEventListener("mousedown",today); i.addEventListener("focus",today);
    }
    i.addEventListener("change",()=>{ if(document.activeElement===i) dirty=true; else on(i.value); });
    i.addEventListener("blur",()=>{ if(dirty){ dirty=false; pre=false; on(i.value); } else if(pre){ pre=false; if(i.value) on(i.value); } });
  } else if(opts.type==="number"){
    /* ".5" נשמר כ-"0.5" (ענב, 19.11.2026) */
    /* neg — לחץ קניסטר (ואקום): הדוגם מקליד בלי מינוס, והערך נשמר ומוצג שלילי (דני, 26.11.2026) */
    i.addEventListener("change",()=>{ let v=i.value.replace(/^(-?)\./,"$10.");
      if(opts.neg && v.trim()!=="" && Number(v)>0) v="-"+v.trim();
      i.value=v; on(v); });
  } else i.addEventListener("change",()=>on(i.value));
  return i;
}

/* ============ signature pad ============ */
function pad(key,label,store){
  const c=el("canvas",{class:"sigbox"});
  const wrap=el("div",{class:"sigwrap"},
    el("label",{style:"font-size:12.5px;font-weight:700;letter-spacing:.2px;color:var(--ink-2)"},label),c,
    el("div",{},el("button",{class:"btn ghost",type:"button",disabled:RO(),onclick:()=>{
      c.getContext("2d").clearRect(0,0,c.width,c.height);
      logChange(`חתימה — ${label}`, store[key]?"חתום":"", "", "sig."+key); store[key]=""; save();
    }},"נקה")));
  requestAnimationFrame(()=>{
    const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    c.width=r.width*dpr; c.height=r.height*dpr;
    const ctx=c.getContext("2d"); ctx.scale(dpr,dpr);
    ctx.lineWidth=2.1; ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.strokeStyle=getComputedStyle(document.body).color;
    if(store[key]){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height); im.src=store[key]; }
    let drawing=false, drew=false;
    const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top];};
    c.addEventListener("pointerdown",e=>{ if(RO())return; drawing=true; drew=false; c.setPointerCapture(e.pointerId); const[x,y]=pt(e); ctx.beginPath(); ctx.moveTo(x,y); });
    c.addEventListener("pointermove",e=>{ if(!drawing)return; drew=true; const[x,y]=pt(e); ctx.lineTo(x,y); ctx.stroke(); });
    const end=()=>{ if(!drawing)return; drawing=false; if(!drew) return;
      const had=!!store[key]; store[key]=c.toDataURL("image/png");
      logChange(`חתימה — ${label}`, had?"חתום":"", "נחתם", "sig."+key); save(); };
    c.addEventListener("pointerup",end); c.addEventListener("pointercancel",end);
  });
  return wrap;
}

/* נספח A להוראת עבודה 40002: נפח המילוי לפי קוטר הקידוח, בסמ"ק — אותו נפח לחול הקוורץ ולבנטונייט הגרגרים */
const FILL_CC={'1"':152,'1.25"':238,'1.5"':343,'1.75"':464,'2"':608,'3"':1368,'4"':2432,'6"':5472};
/* חדירות תקינה: תת לחץ יציב עד 7.5 אינץ' כספית בספיקה של 100 מ"ל לדקה (הוראת עבודה 9.8.2, הנחיות המשרד).
   עומק הדיגום לא רדוד מ-1 מ' (הנחיות המשרד) */
const PERM_MAX=7.5, DEPTH_MIN=1;
const num = x => String(x??"").trim()==="" ? NaN : parseFloat(x);
const wellHasInst = w => ["tStart","tEnd","pidHole","perm","depth","profile","note"].some(k=>String(w[k]??"").trim()!=="")
  || w.sand || w.bentGran || w.bentWet;
function wellInstIssues(w){
  const out=[];
  if(num(w.perm)>PERM_MAX) out.push(`חדירות נמוכה — ${w.perm} אינץ׳ כספית, מעל ${PERM_MAX}. משנים מיקום או עומק בתיאום עם המשרד (הוראת עבודה 9.8.2.3)`);
  if(num(w.depth)<DEPTH_MIN) out.push(`עומק הגשש ${w.depth} מ׳ — רדוד מ-${DEPTH_MIN} מ׳ (הנחיות המשרד)`);
  if(w.tStart && w.tEnd && w.tEnd<w.tStart) out.push("שעת סיום ההתקנה לפני שעת ההתחלה");
  if(w.tEnd && !(w.sand && w.bentGran && w.bentWet)) out.push("לא סומנו כל שכבות המילוי");
  return out;
}
/* שדה בבאר. part: inst / samp — קובע על שם מי השינוי נרשם (actor) */
function setWell(w,k,v,part="inst"){
  if(w.auto.includes(k)) w.auto=w.auto.filter(x=>x!==k);
  else logChange(`${part==="inst"?"התקנה":"דיגום"} — ${WELL_LABEL[k]||SAMP_LABEL[k]||k} · ${w.name||"באר חדשה"}`, w[k], v, `gas.well.${part}.${w.id}.${k}`);
  w[k]=v; save();
}
function addWell(part="inst"){
  const prev=S.gas.wells[S.gas.wells.length-1];
  const w=blankWell(nextWellName(prev&&prev.name));
  if(w.name) w.auto.push("name");
  if(part==="inst"){ w.tStart=nowHM(); w.auto.push("tStart"); }
  S.gas.wells.push(w);
  logChange(`${part==="inst"?"התקנה":"דיגום"} — הוספת באר`,"",`שורה ${S.gas.wells.length}`,`gas.well.${part}.add.${w.id}`); save();
}
function dropLastWell(part="inst"){
  const w=S.gas.wells[S.gas.wells.length-1]; if(!w) return;
  /* כמו שורה ריקה במשמורת — מחיקת באר בלי נתונים אינה שינוי */
  if(w.name || wellHasInst(w)) logChange(`${part==="inst"?"התקנה":"דיגום"} — מחיקת באר`, w.name||`שורה ${S.gas.wells.length}`, "", `gas.well.${part}.del.${w.id}`);
  S.gas.wells.pop(); save();
}

/* עומק בין שורות — השורה העמוקה הבאה; עד 1.5 מ' — שורת 1.5; קוטר 1.75" — עמודת 2". כולם לכיוון שטיפה ארוכה יותר.
   ספיקה שבין הטבלאות — לפי הטבלה הקרובה, ביחס הפוך לספיקה. בלי ספיקה (או מחוץ לטווח) — 150.
   vols — מס' הנפחים שנבחר לבאר, כשהוא שונה ממה שהטבלה מניחה */
function purgeNeeded(depth, dia, flow, vols){
  const d=num(depth), c=PURGE_DIA.indexOf(dia==='1.75"'?'2"':dia);
  if(!(d>0) || c<0) return null;
  let f=num(flow); if(!(f>=FLOW[0] && f<=FLOW[1])) f=150;
  const near=[150,100,200].reduce((a,b)=>Math.abs(b-f)<Math.abs(a-f)?b:a);
  const row=PURGE_T[near].find(r=>r[0]>=d);
  if(!row) return null;
  const base=row[0]<=1.5?3:5;
  return Math.round(row[c+1]*near/f*(Number(vols)||base)/base);

/* מס' נפחי השטיפה לפי העומק: 3 עד 1.5 מ', 5 מעבר (הוראת עבודה 9.8.4.2, הנחיות המשרד) */

function purgeVolsForm(){
  const v=S.gas.wells.map(wellVols), set=[...new Set(v.filter(Boolean))].sort();

}
/* שעות בין סיום ההתקנה לתחילת הדיגום. null כשחסר נתון */
function eqHours(w){
  const i=S.gas.inst, o=S.gas.samp;

const EQ_HOURS=8, SHUT=[7.5,15], SHUT_DROP=.5, FLOW=[100,200], CAN_START=[26,30], CAN_END=[3,5];

  const r=[], sampled=String(w.can||"").trim()!=="";

    const h=eqHours(w);
    if(h!=null && h<EQ_HOURS) r.push(`עברו ${h.toFixed(1)} שעות מסיום ההתקנה — נדרשות לפחות ${EQ_HOURS} (הנחיות המשרד, טבלה 2)`);
    const need=purgeNeeded(w.depth,S.gas.inst.boreDia,w.flow,wellVols(w));
    if(need!=null && num(w.purgeMin)<need) r.push(`שטיפה ${w.purgeMin} דק׳ — נדרשות ${need} לפי נספח C`);
  }

  const vf=num(w.vacFrom), vt=num(w.vacTo);
  if(outside(vf,SHUT)) r.push(`מבחן אטימות: ${w.vacFrom} — מחוץ לטווח ${SHUT[0]} עד ${SHUT[1]} אינץ׳ כספית`);
  if(vf-vt>SHUT_DROP) r.push(`מבחן אטימות: ירידה של ${(vf-vt).toFixed(1)} — מעל ${SHUT_DROP}. יש לאתר דליפה`);
  if(outside(num(w.flow),FLOW)) r.push(`ספיקה ${w.flow} — מחוץ לטווח ${FLOW[0]} עד ${FLOW[1]} מ״ל לדקה`);
  for(const [k,rng,label] of [["canFrom",CAN_START,"לחץ התחלתי בקניסטר"],["canTo",CAN_END,"לחץ בסיום"],
      ...(w.split?[["spCanFrom",CAN_START,"פיצול — לחץ התחלתי"],["spCanTo",CAN_END,"פיצול — לחץ בסיום"]]:[])])
    if(outside(Math.abs(num(w[k])),rng)) r.push(`${label} ${w[k]} — מחוץ לטווח ${rng[0]} עד ${rng[1]} אינץ׳ כספית`);
  if(w.sStart && w.sEnd && w.sEnd<w.sStart) r.push("שעת סיום הדיגום לפני שעת ההתחלה");
  if(sampled && !w.ipa) r.push("לא סומנה בדיקת IPA");

  if(sampled && !w.to15) r.push("לא סומן TO-15");

/* בקרות איכות — רק מ-10 דגימות (הנחיות המשרד): בלאנק רקע ובלאנק חומרים בכל יום (כל אחד יכול לשמש גם כשני),
   פיצול וחזרה — 1 לכל 20, ולפחות 1 */
function gasQc(){
  const g=S.gas, n=g.wells.filter(w=>String(w.can||"").trim()).length, per=Math.ceil(n/20);
  const have={dup:g.wells.filter(w=>w.dup).length, split:g.wells.filter(w=>w.split).length,
    EB:g.blanks.filter(b=>b.type==="EB").length, AB:g.blanks.filter(b=>b.type==="AB").length};

function gasQcCard(){
  const q=gasQc(), lack=[];

    lack.length ? el("div",{class:"note warn",style:"margin-top:12px"},el("b",{},"חסרות בקרות: "),lack.join(" · ")) :
      q.need ? el("div",{class:"note",style:"margin-top:12px"},"הבקרות הנדרשות סומנו.") : null,
    q.have.split ? el("div",{class:"note",style:"margin-top:12px"},"קניסטר הפיצול נשלח למעבדה אחרת — משמורת פיצול נפרדת, ומסירה וקבלה משלה בלשונית המסירה.") : null);

const BLANK_LABEL={EB:"בלאנק חומרים", AB:"בלאנק רקע"};

    b[k], v, `gas.blank.${b.id}.${k}`);
  b[k]=v; save();
}
function addBlank(type){
  const b=blankBlank(type), same=S.gas.blanks.filter(x=>x.type===type).length;

function dropLastBlank(){

  const bad=[];
  /* לחץ הקניסטר הוא ואקום — נרשם גם עם מינוס (דני, 26.11.2026); הטווח נבדק בלי הסימן */
  if(outside(Math.abs(num(b.canFrom)),CAN_START)) bad.push(`לחץ התחלתי ${b.canFrom} — מחוץ לטווח 26 עד 30`);

/* ============ תעודת ניקיון הקניסטרים — דני (18.11.2026): לתייק את התעודה מהמעבדה, ולצרף למייל ============
   כל עמוד מצולם במצלמה ועובר עיבוד כמו בסריקה: גווני אפור, הנייר מולבן והכתב מוכהה. ב-PDF — עמוד לכל צילום */
const CERT_MAX=6, CERT_PX=1600;
function scanImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("לא ניתן לקרוא את התמונה")); };
    im.onload=()=>{
      URL.revokeObjectURL(url);
      const sc=Math.min(1,CERT_PX/Math.max(im.width,im.height));
      const cv=document.createElement("canvas"); cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
      const g=cv.getContext("2d"); g.drawImage(im,0,0,cv.width,cv.height);
      const d=g.getImageData(0,0,cv.width,cv.height), p=d.data, n=p.length/4, hist=new Uint32Array(256), Y=new Uint8Array(n);
      for(let i=0;i<n;i++){ const y=(p[4*i]*.299+p[4*i+1]*.587+p[4*i+2]*.114)|0; Y[i]=y; hist[y]++; }
      /* נקודת שחור — האחוזון ה-1 (הכתב); נקודת לבן — האחוזון ה-90 (הנייר תופס את רוב התמונה) */
      const pct=q=>{ let s=0; for(let v=0;v<256;v++){ s+=hist[v]; if(s>=n*q) return v; } return 255; };
      const lo=pct(.01), hi=Math.max(lo+40,pct(.9)), k=255/(hi-lo);
      for(let i=0;i<n;i++){ const v=Math.max(0,Math.min(255,(Y[i]-lo)*k)); p[4*i]=p[4*i+1]=p[4*i+2]=v; }
      g.putImageData(d,0,0);
      res(cv.toDataURL("image/jpeg",.6));
    };
    im.src=url;
  });
}

      "התעודה מצורפת למייל כקובץ PDF נפרד"),
    el("div",{class:"bar",style:"margin-top:0"},
      el("button",{class:"btn",type:"button",disabled:RO()||full,onclick:()=>cam.click()},pages.length?"סריקת עמוד נוסף":"סריקת התעודה"),
      el("button",{class:"btn ghost",type:"button",disabled:RO()||full,onclick:()=>lib.click()},"מהתמונות"),
      el("span",{class:"spacer"}),

    loading?el("div",{class:certFail===S.id?"note warn":"sub",style:"margin-top:8px"},certFail===S.id
      ? "עמודי התעודה לא נמצאו באחסון המכשיר. יש לסרוק אותם שוב" : "טוען את התעודה…")
      : full?el("div",{class:"sub",style:"margin-top:8px"},`עד ${CERT_MAX} עמודים`):null,
    pages.length?el("div",{style:"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px"},

            logChange(`תעודת ניקיון קניסטרים — הסרת עמוד ${i+1}`, count(S.canCert.length), count(S.canCert.length-1)||"הוסרה", "canCert.del");
            const id=S.id;

/* PDF של התעודה: רוחב A4, הגובה לפי יחס הצילום */
async function certPdf(){
  const out=[];
  for(const src of S.canCert){
    const im=await loadImg(src); if(!im) continue;
    const bin=atob(src.slice(src.indexOf(",")+1)), jpeg=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) jpeg[i]=bin.charCodeAt(i);
    const w=595.28;
    out.push({jpeg, w, h:+(w*im.naturalHeight/im.naturalWidth).toFixed(2), px:im.naturalWidth, py:im.naturalHeight});
  }
  return pdfFromJpegs(out);
}

/* ============ צילומי שטח — דני (24.11.2026) ============
   צילומי האתר (כמה שרוצים, קרקע וגז) בסוף לשונית יום הדיגום / פרטי הסקר, וצילום אחד לכל קידוח ביומן השדה.
   כל צילום מוקטן ל-100–300KB, ועל גביו נכתבים שם האתר, הקידוח (בצילום קידוח) ותאריך הצילום.
   הצילומים מצורפים למייל כקובצי JPG. שם הקובץ: האתר והתאריך (ובצילום קידוח — גם הקידוח).
   התמונות נשמרות ב-IndexedDB ("photo"), לא ברשומה: צילום אחד הוא כ-200KB, וכל localStorage באייפד כ-5MB.
   ברשומה נשמר רק התיאור: {id, kind:"site"|"bore"|"well", b, d (תאריך הצילום), t (שעה)}. הצילומים לא עוברים למאגר המשותף.
   גז קרקע (דני, 24.11.2026): צילום אחד לכל באר. b — מזהה הבאר (לא השם), כך ששינוי שם הבאר לא מנתק את הצילום */
const PHOTO_PX=1600, PHOTO_MIN=100*1024, PHOTO_MAX=300*1024;
const photoUrl=new Map();            /* id → כתובת לתצוגה (object URL) */
const photoMiss=new Set();           /* צילומים שלא נמצאו באחסון המכשיר */
const photoBlob=async id=>{
  const r=await certTx("readonly",s=>s.get(id),"photo");
  return r && r.buf ? new Blob([r.buf],{type:r.type||"image/jpeg"}) : null;
};
const toBlob=(cv,q)=>new Promise(res=>cv.toBlob(b=>res(b),"image/jpeg",q));
function readImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("לא ניתן לקרוא את התמונה")); };
    im.onload=()=>{ URL.revokeObjectURL(url); res(im); };
    im.src=url;
  });
}
/* הכיתוב בפינה הימנית התחתונה: רקע כהה שקוף למחצה וטקסט לבן, בגודל יחסי לתמונה */
function stampPhoto(cv, lines){
  const g=cv.getContext("2d"), fs=Math.max(16,Math.round(Math.min(cv.width,cv.height)*0.035)), pad=Math.round(fs*0.5), lh=Math.round(fs*1.25);
  g.font=`bold ${fs}px ${PFONT}`; g.direction="rtl"; g.textAlign="right"; g.textBaseline="top";
  const w=Math.min(cv.width-2*pad, Math.max(...lines.map(l=>g.measureText(l).width))+2*pad), h=lines.length*lh+2*pad-(lh-fs);
  const x1=cv.width-pad, y0=cv.height-pad-h;
  g.fillStyle="rgba(0,0,0,.55)"; g.fillRect(x1-w,y0,w,h);
  g.fillStyle="#fff";
  lines.forEach((l,i)=>g.fillText(l,x1-pad,y0+pad+i*lh,w-2*pad));
}
/* מקטין, כותב על התמונה, ומכווץ ל-100–300KB */
async function makePhoto(file, lines){
  const im=await readImage(file);
  let sc=Math.min(1,PHOTO_PX/Math.max(im.width,im.height)), blob=null;
  for(let round=0; round<6; round++){
    const cv=document.createElement("canvas"); cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
    cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
    stampPhoto(cv,lines);
    let q=.82; blob=await toBlob(cv,q);
    while(blob && blob.size>PHOTO_MAX && q>.45){ q-=.08; blob=await toBlob(cv,q); }
    while(blob && blob.size<PHOTO_MIN && q<.95){ const b=await toBlob(cv,Math.min(.95,q+=.05)); if(!b || b.size>PHOTO_MAX) break; blob=b; }
    if(!blob) throw new Error("יצירת התמונה נכשלה");
    if(blob.size<=PHOTO_MAX) break;
    sc*=.8;
  }
  return blob;
}
const siteOf=()=>(S.head.site||"").trim();
const wellName=id=>{ const i=S.gas.wells.findIndex(w=>w.id===id); return i<0 ? "באר" : (S.gas.wells[i].name||"").trim()||`באר ${i+1}`; };
const ONE_PER={bore:true, well:true};
const photoLines=p=>[siteOf(), ...(p.kind==="bore"?[`קידוח ${p.b}`]:p.kind==="well"?[wellName(p.b)]:[]), fmtFull(p.d)];
/* שמות הקבצים: "<אתר> <ddmmyy>", בצילום קידוח "<אתר> קידוח <מס׳> <ddmmyy>". צילומים באותו שם ממוספרים (2), (3)… */
function photoNames(){
  const clean=s=>String(s).trim().replace(/[\\/:*?"<>|]/g,"-");
  const seen=new Map(), out=new Map();
  for(const p of S.photos){
    const base=clean(p.kind==="bore" ? `${siteOf()||"אתר"} קידוח ${p.b} ${ddmmyy(p.d)}`
      : p.kind==="well" ? `${siteOf()||"אתר"} ${wellName(p.b)} ${ddmmyy(p.d)}` : `${siteOf()||"אתר"} ${ddmmyy(p.d)}`);
    const n=(seen.get(base)||0)+1; seen.set(base,n);
    out.set(p.id, n>1?`${base} (${n})`:base);
  }
  return out;
}
/* צילום חדש. בצילום קידוח — מחליף את הקודם של אותו קידוח (ההחלפה נרשמת בתיעוד) */
async function addPhoto(file, kind, b){
  if(!file || RO()) return;
  if(!siteOf()){ alert("יש למלא שם אתר לפני הצילום: הוא נכתב על הצילום ובשם הקובץ."); return; }
  const id=S.id, p={id:crypto.randomUUID(), kind, b:ONE_PER[kind]?b:"", d:todayISO(), t:nowHM()};
  try{
    const blob=await makePhoto(file, photoLines(p));
    const buf=await blob.arrayBuffer();
    await certDo(async()=>{
      await certTx("readwrite",s=>s.put({type:blob.type, buf},p.id),"photo");
      const back=await certTx("readonly",s=>s.get(p.id),"photo");
      if(!back || !back.buf || back.buf.byteLength!==buf.byteLength) throw new Error("הבדיקה אחרי השמירה נכשלה");
    });
    if(S.id!==id || RO()){ certDo(()=>certTx("readwrite",s=>s.delete(p.id),"photo")).catch(()=>{}); return; }
    photoUrl.set(p.id, URL.createObjectURL(blob));
    const old=ONE_PER[kind] ? S.photos.find(x=>x.kind===kind && x.b===b) : null;
    if(old){
      /* צילום חוזר אינו נרשם בתיעוד (דני, 24.11.2026) */
      S.photos=S.photos.filter(x=>x!==old); dropPhoto(old.id);
    }
    S.photos=[...S.photos, p];
    save();
  }catch(e){ alert("הצילום לא נשמר: "+((e&&e.message)||e)); }
}
function dropPhoto(pid){
  const u=photoUrl.get(pid); if(u){ URL.revokeObjectURL(u); photoUrl.delete(pid); }
  certDo(()=>certTx("readwrite",s=>s.delete(pid),"photo")).catch(()=>{});
}
function removePhoto(p, name){
  askYes("להסיר את הצילום?", `${showName(name)}.jpg יוסר מהרשומה. ההסרה נרשמת בתיעוד השינויים.`, "כן, להסיר", ()=>{
    logChange(p.kind==="bore"?`צילום קידוח ${p.b}`:p.kind==="well"?`צילום באר ${wellName(p.b)}`:"צילום האתר", `${showName(name)}.jpg`, "הוסר", `photo.${p.kind}.${p.id}`);
    S.photos=S.photos.filter(x=>x!==p); dropPhoto(p.id); save();
  }, true);
}

let photoRec="";
const loadPhotos=()=>certDo(async()=>{
  if(photoRec!==S.id){ photoRec=S.id; photoMiss.clear(); }
  const id=S.id; let changed=false;
  for(const p of S.photos){
    if(photoUrl.has(p.id) || photoMiss.has(p.id)) continue;
    try{ const b=await photoBlob(p.id); if(S.id!==id) return; if(b) photoUrl.set(p.id,URL.createObjectURL(b)); else photoMiss.add(p.id); }
    catch(e){ photoMiss.add(p.id); }
    changed=true;
  }
  if(changed && S.id===id) renderSoon();
});

/* צילום שאינו באייפד הזה (רשומה שנפתחה ממכשיר אחר) — מדלגים עליו ומודיעים, ולא עוצרים את כל המייל */
async function photoFiles(){
  const names=photoNames(), out=[], miss=[];
  for(const p of S.photos){
    let blob=null; try{ blob=await photoBlob(p.id); }catch(e){}
    if(!blob){ miss.push(names.get(p.id)+".jpg"); continue; }
    out.push({name:names.get(p.id)+".jpg", blob});
  }
  if(miss.length) alert(`${miss.length===1?"צילום אחד לא נמצא באייפד הזה ולא צורף":`${miss.length} צילומים לא נמצאו באייפד הזה ולא צורפו`} למייל:\n${miss.join("\n")}`);
  return out;
}

/* ============ נ"צ — מדידת מיקום ב-GPS (דני, 19.11.2026) ============
   הנחיות סקר קרקע (21.04.2016) סעיף 3.1.5: סימון ב-GPS "ברמת דיוק של עד 2.5 מ'".
   אין דרך לדעת מהדפדפן אם באייפד יש GPS — לכן מתג לכל מכשיר (localStorage), כבוי כברירת מחדל.
   בלי המתג אין כפתור מדידה. מדידת GPS לא נרשמת בתיעוד השינויים; שינוי בהקלדה ידנית — כן */
const K_GPS="vasa-gps", GPS_SECS=30, GPS_MAX=2.5;
function gpsOn(){ try{ return localStorage.getItem(K_GPS)==="1"; }catch(e){ return false; } }
function setGpsOn(on){ try{ on?localStorage.setItem(K_GPS,"1"):localStorage.removeItem(K_GPS); }catch(e){} render(); }

/* WGS84 → ITM (EPSG:2039): העתקת הלמרט ואז טרנסוורס מרקטור על GRS80. הפרמטרים (ITM→WGS84, כאן הפוך) כפי שמתפרסמים
   ל-EPSG:2039: 23.772,17.49,17.859,-0.3132,-1.85274,1.67299,-5.4262. עד 23.11.2026 שימשו פרמטרים אחרים — הפרש של 0.6–2.6 מ׳ */
function wgs2itm(lat,lon){
  const rad=Math.PI/180;
  const ecef=(la,lo,a,f)=>{ const e2=f*(2-f), sl=Math.sin(la*rad), N=a/Math.sqrt(1-e2*sl*sl);
    return [N*Math.cos(la*rad)*Math.cos(lo*rad), N*Math.cos(la*rad)*Math.sin(lo*rad), N*(1-e2)*sl]; };
  let [x,y,z]=ecef(lat,lon,6378137,1/298.257223563);
  const r=Math.PI/(180*3600), rx=-.3132*r, ry=-1.85274*r, rz=1.67299*r, s=1-5.4262e-6;
  [x,y,z]=[(x-23.772)/s, (y-17.49)/s, (z-17.859)/s];
  [x,y,z]=[x+rz*y-ry*z, -rz*x+y+rx*z, ry*x-rx*y+z];
  const a=6378137, f=1/298.257222101, e2=f*(2-f), ep2=e2/(1-e2);
  const lo=Math.atan2(y,x), p=Math.hypot(x,y);
  let la=Math.atan2(z,p*(1-e2));
  for(let i=0;i<10;i++){ const N=a/Math.sqrt(1-e2*Math.sin(la)**2), h=p/Math.cos(la)-N; la=Math.atan2(z,p*(1-e2*N/(N+h))); }
  const la0=31.7343936111111*rad, lo0=35.2045169444444*rad, k0=1.0000067, FE=219529.584, FN=626907.39;
  const M=ph=>a*((1-e2/4-3*e2**2/64-5*e2**3/256)*ph-(3*e2/8+3*e2**2/32+45*e2**3/1024)*Math.sin(2*ph)
    +(15*e2**2/256+45*e2**3/1024)*Math.sin(4*ph)-(35*e2**3/3072)*Math.sin(6*ph));
  const N=a/Math.sqrt(1-e2*Math.sin(la)**2), T=Math.tan(la)**2, C=ep2*Math.cos(la)**2, A=(lo-lo0)*Math.cos(la);
  return [FE+k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120),
          FN+k0*(M(la)-M(la0)+N*Math.tan(la)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720))];
}

/* חלון המדידה: עד GPS_SECS שניות, נשמרת הקריאה עם הדיוק הטוב ביותר. onSave({x,y,acc,t}) */
function gpsDialog(title,onSave){
  let best=null, last=null, err="", id=null;
  const t0=Date.now();
  const card=el("div",{class:"card"}), m=el("div",{class:"modal",role:"dialog","aria-modal":"true"},card);
  const stop=()=>{ if(id!=null) navigator.geolocation.clearWatch(id); id=null; clearInterval(tick); };
  const close=()=>{ stop(); m.remove(); };
  const save=()=>{
    if(!best) return;
    stop(); m.remove();
    const [x,y]=wgs2itm(best.lat,best.lon);
    onSave({x:String(Math.round(x)), y:String(Math.round(y)), acc:best.acc.toFixed(1), t:nowHM()});
  };
  const draw=()=>{
    const secs=Math.min(GPS_SECS,Math.round((Date.now()-t0)/1000)), live=id!=null;
    card.textContent="";
    /* append המקורי כותב null כטקסט — לכן דרך el, שמדלג על null */
    card.append(...el("div",{},el("h2",{},`מדידת מיקום — ${title}`),
      err ? el("div",{class:"note warn"},err)
        : el("div",{class:"sub"},live?`מודד… ${secs} מתוך ${GPS_SECS} שניות. עומדים על הנקודה, האייפד פתוח לשמיים`:"המדידה הסתיימה"),
      best ? el("div",{class:"grid",style:"margin-top:8px"},
        fixedField("דיוק נוכחי",last?`±${last.acc.toFixed(1)} מ׳`:"—"),
        fixedField("הדיוק הטוב ביותר",`±${best.acc.toFixed(1)} מ׳`)) : null,
      best && best.acc>GPS_MAX ? el("div",{class:"note warn",style:"margin-top:10px"},
        `הדיוק מעל ${GPS_MAX} מ׳ — הדרישה בהנחיות סקר קרקע (סעיף 3.1.5). אפשר להמתין, לשמור כך, או למדוד שוב במקום פתוח יותר`) : null,
      el("div",{class:"bar"},
        el("button",{class:"btn",type:"button",disabled:!best,onclick:save},live?"שמירה עכשיו":"שמירה"),
        el("span",{class:"spacer"}),
        el("button",{class:"btn ghost",type:"button",onclick:close},"ביטול"))).childNodes);
  };
  const tick=setInterval(()=>{
    if(id!=null && Date.now()-t0>=GPS_SECS*1000){ if(best) return save(); err="לא התקבל מיקום. בודקים שהמקלט מחובר או יוצאים למקום פתוח"; stop(); }
    draw();
  },1000);
  if(!navigator.geolocation){ err="המכשיר לא מאפשר מדידת מיקום"; }
  else id=navigator.geolocation.watchPosition(p=>{
    last={lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy};
    if(!best || last.acc<best.acc) best=last;
    draw();
  },e=>{
    err=e.code===1 ? "אין הרשאת מיקום. בהגדרות האייפד: פרטיות ואבטחה ← שירותי מיקום ← מאשרים לאפליקציה או ל-Safari"
                   : "לא התקבל מיקום. בודקים שהמקלט מחובר או יוצאים למקום פתוח";
    stop(); draw();
  },{enableHighAccuracy:true, maximumAge:0, timeout:GPS_SECS*1000});
  draw(); document.body.append(m);
}

/* מדידה חוזרת דורסת נקודת GPS קודמת רק כשהיא מדויקת יותר (דני, 26.11.2026). נקודה שהוקלדה — אין דיוק להשוות, נדרסת */
function keepBest(it,p){
  const c=it.c;
  if(c.src==="GPS" && num(c.acc)>=0 && !(num(p.acc)<num(c.acc))){
    flash=`${it.label}: נשאר המיקום הקודם (±${c.acc} מ׳). המדידה החדשה (±${p.acc} מ׳) לא מדויקת יותר`;
    render(); return;
  }
  it.gps(p);
}
/* כרטיס נ"צ: שורה לכל קידוח / באר. item: {label, c:{x,y,acc,t,src}, ro, manual(k,v), gps(c)} */
function coordsCard(title, sub, items){
  if(!gpsOn() && !items.some(it=>it.c.x||it.c.y)) return null;
  const tb=el("tbody",{});
  for(const it of items){
    const c=it.c, has=!!(c.x||c.y), far=c.src==="GPS" && num(c.acc)>GPS_MAX;
    const info=c.src==="GPS" ? `±${c.acc} מ׳ · GPS ${c.t||""}` : c.src==="ידני" ? "הוקלד" : "";
    /* שדות ההקלדה נבנים מושבתים בשורה נעולה (RO() קורא את roInst) */
    roInst=it.ro;
    try{ tb.append(el("tr",{class:far?"hot":""},
      el("td",{class:"mono"},it.label),
      el("td",{class:"mono"},txt(c.x,v=>it.manual("x",v),{type:"number",ph:"X"})),
      el("td",{class:"mono"},txt(c.y,v=>it.manual("y",v),{type:"number",ph:"Y"})),
      el("td",{},info, far?el("div",{class:"hint"},`מעל ${GPS_MAX} מ׳`):null),
      el("td",{},gpsOn() && !it.ro ? el("button",{class:"btn ghost sm",type:"button",
        onclick:()=>gpsDialog(it.label,p=>keepBest(it,p))},has?"מדידה חוזרת":"מדידת מיקום") : null))); }
    finally{ roInst=false; }
  }
  return el("div",{class:"card"},
    el("h2",{},title),
    el("div",{class:"sub"},sub+` · רשת ישראל החדשה (ITM). נדרש דיוק של עד ${GPS_MAX} מ׳ (הנחיות סקר קרקע, סעיף 3.1.5). נכנס לאקסל בלבד — לא לטפסים`),
    items.length ? el("div",{class:"scroll"},el("table",{class:"compact",style:"min-width:0"},
      el("colgroup",{},[90,110,110,null,120].map(w=>el("col",{style:w?`width:${w}px`:null}))),
      el("thead",{},el("tr",{},el("th",{},"נקודה"),el("th",{},"X"),el("th",{},"Y"),el("th",{},"דיוק"),el("th",{},""))),tb))
      : el("div",{class:"empty"},"אין עדיין נקודות."));
}

/* ============ sketch — draw, or photograph a paper sketch ============ */
function sketchCard(){
  const card=el("div",{class:"card"},
    el("h2",{},"שרטוט"),
    el("div",{class:"sub"},"נדרש בדיגום ערמות ובדיגום מוודא — סעיף 7ג. אפשר לשרטט כאן או לצלם שרטוט שנעשה על נייר"));

  const fileIn=el("input",{type:"file",accept:"image/*",capture:"environment",hidden:true});
  fileIn.addEventListener("change",()=>{
    const f=fileIn.files&&fileIn.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const max=1000, sc=Math.min(1,max/Math.max(im.width,im.height));
        const cv=el("canvas",{}); cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
        cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
        const had=!!S.sketchPhoto;
        S.sketchPhoto=cv.toDataURL("image/jpeg",0.6);
        logChange("צילום שרטוט", had?"קיים":"", "צולם", "sketchPhoto");
        save();
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  });

  card.append(el("div",{class:"seg"},
    el("button",{class:"btn",type:"button",disabled:RO(),onclick:()=>fileIn.click()},"צלם שרטוט מנייר"),
    S.sketchPhoto?el("button",{class:"btn ghost",type:"button",disabled:RO(),onclick:()=>{
      logChange("צילום שרטוט","קיים","","sketchPhoto"); S.sketchPhoto=""; save();
    }},"הסר צילום"):null), fileIn);

  if(S.sketchPhoto) card.append(el("img",{class:"shot",src:S.sketchPhoto,alt:"שרטוט מצולם"}));

  const c=el("canvas",{class:"sketch"});
  card.append(el("div",{class:"sub",style:"margin:14px 0 6px"},"או שרטוט על המסך:"),c,
    el("div",{class:"bar"},el("button",{class:"btn ghost",type:"button",disabled:RO(),onclick:()=>{
      c.getContext("2d").clearRect(0,0,c.width,c.height);
      logChange("שרטוט",S.sketch?"קיים":"","","sketch"); S.sketch=""; save();
    }},"נקה שרטוט")));
  requestAnimationFrame(()=>{
    const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    c.width=r.width*dpr; c.height=r.height*dpr;
    const ctx=c.getContext("2d"); ctx.scale(dpr,dpr);
    ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.strokeStyle=getComputedStyle(document.body).color;
    if(S.sketch){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height); im.src=S.sketch; }
    let d=false, drew=false;
    const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top];};
    c.addEventListener("pointerdown",e=>{ if(RO())return; d=true; drew=false; c.setPointerCapture(e.pointerId); const[x,y]=pt(e); ctx.beginPath(); ctx.moveTo(x,y); });
    c.addEventListener("pointermove",e=>{ if(!d)return; drew=true; const[x,y]=pt(e); ctx.lineTo(x,y); ctx.stroke(); });
    const end=()=>{ if(!d)return; d=false; if(!drew) return; S.sketch=c.toDataURL("image/png"); save(); };
    c.addEventListener("pointerup",end); c.addEventListener("pointercancel",end);
  });
  return card;
}
