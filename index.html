<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="יומן שדה">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="color-scheme" content="light">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}</style>
<title>יומן שדה ומשמורת</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ערכת צבעים אחת, בהירה וחדה, לעבודה באייפד בשמש: טקסט כמעט שחור, קווים כהים,
   צבעי מצב רוויים. אין מצב כהה — מסך כהה כמעט לא קריא באור יום חזק */
:root{
  --ground:#E6EAE7; --surface:#FFFFFF; --sunk:#F1F4F2; --head:#D6DDD8;
  --ink:#0A0F0C; --ink-2:#1E2622; --muted:#3D4641;
  --line:#5E6862; --line-2:#AEB6B1;
  --accent:#005C45; --accent-ink:#00402F; --accent-soft:#C6EBDD;
  --warn:#8A3F00; --warn-soft:#FFD89E;
  --danger:#A3001B; --danger-soft:#FFD3D8;
  --ok:#14571F;
  --r:10px;
}

*{box-sizing:border-box}
html{direction:rtl}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Heebo","Segoe UI",Arial,sans-serif; font-size:15px; font-weight:500; line-height:1.5;
  margin:0; -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:"Frank Ruhl Libre",Georgia,serif; margin:0; text-wrap:balance}
button,input,select,textarea{font:inherit; color:inherit; max-width:100%}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- chrome ---------- */
.top{position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:2px solid var(--line)}
.top-in{max-width:1240px; margin:0 auto; padding:10px 16px 0; display:flex; flex-direction:column; gap:8px}
.brandrow{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.brand{font-size:19px; font-weight:700; letter-spacing:-.2px}
.brand small{font-family:"Heebo",sans-serif; font-size:12px; font-weight:500; color:var(--muted); letter-spacing:.4px}
.statewrap{margin-inline-start:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.pill{
  font-size:12px; font-weight:700; letter-spacing:.2px; padding:3px 10px;
  border-radius:999px; border:1.5px solid var(--line); color:var(--ink); background:var(--sunk); white-space:nowrap;
}
.pill.live{border-color:var(--accent); color:#fff; background:var(--accent)}
.pill.lock{border-color:var(--ok); color:var(--ok); background:var(--surface)}
.pill.local{border-color:var(--warn); color:var(--warn); background:var(--warn-soft)}
nav{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  background:none; border:0; border-bottom:4px solid transparent; cursor:pointer;
  padding:9px 12px 9px; font-size:14px; font-weight:500; color:var(--ink-2); white-space:nowrap;
}
nav button[aria-selected="true"]{color:var(--accent-ink); border-bottom-color:var(--accent); font-weight:700}
nav button .n{
  font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:500; color:var(--ink);
  background:var(--head); border-radius:5px; padding:1px 5px; margin-inline-start:5px;
}

main{max-width:1240px; margin:0 auto; padding:18px 16px 120px}
section[hidden]{display:none!important}
.card{background:var(--surface); border:1.5px solid var(--line-2); border-radius:var(--r); padding:16px}
.card + .card{margin-top:14px}
.card > h2{font-size:17px; margin-bottom:3px}
.card > .sub{font-size:13px; color:var(--muted); margin-bottom:14px}

/* ---------- fields — generous tracks so nothing collides ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px 18px; align-items:start}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.f{display:flex; flex-direction:column; gap:5px; min-width:0}
.f > label{font-size:12.5px; font-weight:700; letter-spacing:.2px; color:var(--ink-2)}
.f input,.f select,.f textarea{
  background:var(--surface); border:1.5px solid var(--line); border-radius:8px;
  padding:9px 10px; font-size:16px; width:100%; min-width:0; min-height:44px;
}
.f textarea{min-height:64px; resize:vertical}
.f input:disabled,.f select:disabled,.f textarea:disabled{opacity:.6}
.f .hint{font-size:12px; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:1.5px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px; font-size:14px; font-weight:500; cursor:pointer; min-height:42px}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700}

/* ---------- tables ---------- */
.scroll{overflow-x:auto; border:1.5px solid var(--line); border-radius:var(--r); background:var(--surface)}
table{border-collapse:collapse; width:100%; min-width:max-content; font-size:14px}
th{
  background:var(--head); text-align:right; font-weight:700; font-size:12px; letter-spacing:.2px;
  color:var(--ink); padding:9px 8px; border-bottom:1.5px solid var(--line);
  white-space:nowrap; position:sticky; top:0; z-index:2;
}
th.vt{writing-mode:horizontal-tb; white-space:normal; width:62px; max-width:62px; line-height:1.25; font-size:11px}
td{border-bottom:1px solid var(--line-2); padding:4px 6px; vertical-align:middle}
tr:last-child td{border-bottom:0}
/* תאים עם מסגרת גלויה — באייפד אין ריחוף, ובשמש שדה בלי מסגרת נראה כמו טקסט */
td input,td select{
  background:var(--surface); border:1px solid var(--line-2); border-radius:6px;
  padding:7px 6px; font-size:14px; width:100%; min-width:0; min-height:40px;
}
td input:focus,td select:focus{border:2px solid var(--accent)}
td.mono input,.mono{font-family:"IBM Plex Mono",monospace; font-weight:500; font-variant-numeric:tabular-nums}
td.rownum{color:var(--ink-2); font-family:"IBM Plex Mono",monospace; font-size:12px; text-align:center; width:36px}
tr.hot td.rownum{color:var(--warn); font-weight:700}
tr.hot{background:var(--warn-soft)}
/* משמורת: לחיצה ארוכה על שורה = חזרה. הרקע מתמלא במשך 3 השניות, כדי שהדוגם יידע להמשיך להחזיק */
tr.lp td{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
tr.lp td input{-webkit-user-select:text; user-select:text}
tr.pressing{background:var(--accent-soft); transition:background 3s linear}
tr.xrow{background:var(--sunk)}
tr.fresh td{border-top:3px solid var(--accent); border-bottom:3px solid var(--accent)}
.rowdel{border:0; background:none; color:var(--danger); font-size:17px; font-weight:700; cursor:pointer; min-width:30px; min-height:30px; padding:0}
.rowdel:disabled{opacity:.35; cursor:default}
.w-xs{width:64px} .w-s{width:84px} .w-m{width:112px} .w-l{width:158px} .w-xl{width:200px}
.tickcell{text-align:center; width:48px}
.tick{width:30px; height:30px; border:2px solid var(--line); border-radius:6px; background:var(--surface); cursor:pointer; padding:0; line-height:1; font-size:16px; font-weight:700; color:transparent}
.tick[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.tick.alt[aria-pressed="true"]{background:var(--warn); border-color:var(--warn)}
.tick:disabled{opacity:.4; cursor:default}

/* ---------- misc ---------- */
.btn{background:var(--accent); color:#fff; border:2px solid var(--accent); border-radius:8px; padding:9px 16px; font-size:14.5px; font-weight:700; cursor:pointer; min-height:44px}
.btn.ghost{background:var(--surface); color:var(--accent-ink); border-color:var(--accent)}
.btn.warnb{background:var(--danger); border-color:var(--danger)}
.btn:disabled{opacity:.45; cursor:default}
.bar{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-top:14px}
.spacer{flex:1}
.note{border-inline-start:5px solid var(--accent); background:var(--accent-soft); color:var(--ink); padding:11px 13px; border-radius:0 8px 8px 0; font-size:14px}
.note.warn{border-color:var(--warn); background:var(--warn-soft)}
.note.bad{border-color:var(--danger); background:var(--danger-soft)}
.note b{font-weight:700}
.empty{text-align:center; color:var(--muted); font-size:14px; padding:26px 12px}
.sigbox{border:2px dashed var(--line); border-radius:8px; background:var(--surface); touch-action:none; width:100%; height:120px; display:block}
.sigwrap{display:flex; flex-direction:column; gap:6px; min-width:0}
.hist{font-size:13px; list-style:none; margin:0; padding:0}
.hist li{display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:9px 0; border-bottom:1px solid var(--line-2)}
.hist li:last-child{border-bottom:0}
.hist .what{font-weight:700}
.hist .when{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); white-space:nowrap}
.hist .delta{grid-column:1/-1; color:var(--ink-2); font-size:13px; word-break:break-word}
.hist .from{color:var(--danger); text-decoration:line-through}
.hist .to{color:var(--ok); font-weight:700}
.sketch{border:2px solid var(--line); border-radius:8px; background:var(--surface); touch-action:none; width:100%; max-width:560px; height:300px; display:block}
.shot{max-width:100%; border:1.5px solid var(--line); border-radius:8px; display:block}
.seg{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap}

/* ---------- records ---------- */
.docbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.doccur{background:none; border:0; padding:0; cursor:pointer; font-size:14px; color:var(--muted); text-align:right; min-height:40px; min-width:0; overflow-wrap:anywhere}
.doccur b{color:var(--ink); font-weight:700}
.btn.sm{min-height:40px; padding:6px 13px; font-size:13.5px}
.docs{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.docrow{
  width:100%; display:grid; grid-template-columns:1fr auto; gap:3px 12px; align-items:center; text-align:right;
  background:var(--surface); border:1.5px solid var(--line); border-radius:8px; padding:11px 13px; cursor:pointer; min-height:56px;
}
.docrow:hover{border-color:var(--accent)}
.docrow.cur{background:var(--accent-soft); border:2.5px solid var(--accent)}
.docrow .dt{font-weight:700; font-size:15px; overflow-wrap:anywhere}
.docrow .dm{grid-column:1; font-size:12.5px; color:var(--muted)}
.docrow .tags{grid-column:2; grid-row:1 / 3; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}

/* ---------- number fields — type=number opens the numeric keyboard on iPad ---------- */
input[type=number]{-moz-appearance:textfield; appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none; margin:0}

/* ---------- field log — fits an iPad in landscape without sideways scrolling ---------- */
table.compact{table-layout:fixed; min-width:876px}
table.compact th{white-space:normal; padding:6px 3px; font-size:11.5px; line-height:1.2; letter-spacing:0; vertical-align:bottom}
.pair{display:flex; gap:2px}
table.compact td{padding:2px 2px}
table.compact td input,table.compact td select{padding:6px 3px; font-size:13px; min-height:38px}
table.compact td select{-webkit-appearance:none; appearance:none; text-overflow:ellipsis}
table.compact td.rownum,table.compact .tickcell{width:auto}

/* ---------- file dialog ---------- */
.modal{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px}
.modal .card{width:100%; max-width:440px}
.modal .bar a.btn{text-decoration:none; display:inline-flex; align-items:center}
.modal .card{max-height:calc(100vh - 32px); overflow-y:auto}

/* ---------- installed app — update, install ---------- */
button.pill{font-family:inherit; cursor:pointer; min-height:30px}
.pill.act{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft)}
.install{margin-bottom:14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.install > span{flex:1; min-width:220px}

/* ---------- email ---------- */
.picks{display:flex; flex-direction:column; gap:8px; margin:14px 0 4px}
.picks .chip{text-align:right; width:100%}
.picks .ck{display:inline-block; width:1.5em; font-weight:700}
.mailbody{white-space:pre-line; font-size:13px; background:var(--sunk); border:1.5px solid var(--line-2); border-radius:8px; padding:10px 12px; max-height:180px; overflow-y:auto; margin-top:10px}
.files{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:13.5px}
.files li{display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; overflow-wrap:anywhere}
.files a.btn{text-decoration:none; display:inline-flex; align-items:center}
</style>
</head>
<body>


<div class="top">
  <div class="top-in">
    <div class="brandrow">
      <span class="brand">יומן שדה ומשמורת <small>וזה אקולוגיה · ISO 17025 · 294</small></span>
      <span class="statewrap">
        <span class="pill" id="syncPill">מקומי</span>
        <span class="pill lock" id="lockPill" hidden>נעול</span>
        <span class="pill local" id="fullPill" hidden>האחסון במכשיר מלא — השינוי האחרון לא נשמר</span>
        <button class="pill act" id="updPill" type="button" hidden>גרסה חדשה מוכנה — רענון</button>
        <button class="pill act" id="installPill" type="button" hidden>התקנה כאפליקציה</button>
      </span>
    </div>
    <div class="docbar" id="docbar"></div>
    <nav id="tabs" role="tablist"></nav>
  </div>
</div>

<main>
  <div id="installHint" hidden></div>
  <section id="v-docs" role="tabpanel" hidden></section>
  <section id="v-day" role="tabpanel"></section>
  <section id="v-log" role="tabpanel" hidden></section>
  <section id="v-coc" role="tabpanel" hidden></section>
  <section id="v-spl" role="tabpanel" hidden></section>
  <section id="v-hand" role="tabpanel" hidden></section>
  <section id="v-hist" role="tabpanel" hidden></section>
</main>

<script>
"use strict";

async function useCap(name){
  try{ if(typeof claude!=="undefined" && claude && typeof claude.use==="function") return await claude.use(name); }catch(e){}
  return null;
}

/* ============ reference data — הנחיות למילוי שדות ============ */
const SAMPLERS = ["ענב אורן","אורן פלדמן","ראמי גאנם","עמית אורן","דני וזה"];
const PIDS     = ["XT-103253","XT-103411","XT-100270","T-118415","07-0127"];
/* מעבדות לבחירה. "אחר" פותח הקלדה חופשית */
const LABS     = ["בקטוכם","אלכם","אמינולאב","מכון הנפט"];
const OTHER    = "אחר";
const RIGS     = ["דחיקה ישירה – גיאופרוב","דיגום ידני"];
const WEATHER  = ["שמשי","מעונן","מעונן חלקי","גשום","חם","חם מאוד"];
const LANDUSE  = ["מגורים","תעשייה","מסחר","חקלאי"];
const SOIL     = ["חרסית","חרסית שמנה","חמרה","לס","כורכר","חול","מצעים","אחר"];
const COLOR    = ["חום","שחור","אדום","אפור","לבן","צהוב","אחר"];
const ODOUR    = ["לא","כן","חזק"];
const MOIST    = ["יבש","לח","רטוב"];
const TOOL     = ["צנצנת","ליינר"];
const STYPE    = ["חטף","מורכב"];
const PACKS    = ["1","2","3","4","5"];
const DAYS     = ["A","B","C","D","E","F","G"];
/* העמודות הקבועות בטופס 33.1, בסדר שלהן מימין לשמאל, ואחריהן חמש עמודות פתוחות */
const TESTS    = ["TPH D+O","ICP מתכות","PFAS","CR6+","PH","SVOC","VOC"];
const EXTRA_N  = 5;
/* שמות מגרסאות קודמות של האפליקציה */
const TEST_OLD = {"TPH DRO ORO":"TPH D+O","ICP":"ICP מתכות"};
const PID_HOT  = 20;
const BILL_US  = "וזה אקולוגיה";

const todayISO = () => new Date().toISOString().slice(0,10);
const nowHM    = () => new Date().toTimeString().slice(0,5);
const stamp    = () => new Date().toISOString();
function ddmmyy(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split("-");
  return `${d}${m}${y.slice(2)}`;
}

function blankSample(boring){
  return {id:crypto.randomUUID(), boring:boring||"", depth:"", time:"", name:"", nameAuto:true,
    dayLetter:"", soil:[], color:[], odour:"", moist:"", pid:"", pid20:"", note:"",
    toCoc:false, tool:"", packs:"", stype:"חטף", tests:[], extra:[], cocNote:"", qc:"",
    toSplit:false, sp:{tool:"", packs:"", stype:"חטף", tests:[], extra:[], note:""},
    auto:["stype","sp.stype"]};
}

/* שורה שקיימת רק בשרשרת המשמורת (או בפיצול), ולא ביומן השדה:
   dup:false — שורה שהדוגם הוסיף ומילא חופשי; dup:true — חזרה (בקרת איכות) של שורה אחרת.
   after — מזהה השורה שהחזרה מוצגת מתחתיה; "" — בסוף הטבלה */
function blankExtra(){
  return {id:crypto.randomUUID(), dup:false, after:"", name:"", depth:"", time:"", pid:"", dayLetter:"",
    tool:"", packs:"", stype:"חטף", tests:[], note:"", auto:["stype"]};
}

const newId = () => `day-${todayISO()}-${crypto.randomUUID().slice(0,8)}`;

function blankDay(id){
  return {
    v:1, id:id||newId(), locked:false, updated:"",
    head:{
      site:"", address:"", date:todayISO(), client:"", clientRep:"", contact:"", billTo:"",
      weather:[], landuse:"", gwl:"", pid:"", pidOpen:"", rig:"", rigOther:"",
      s1:"", s2:"", approver:"", arrive:"", finish:"", tStart:"", tEnd:"",
      accredited:true, ready5556:false, cooled:true, subDrill:false, subSample:false,
      calLab:false, cal100:false,
      guideSurvey:false, guidePiles:false, planApproved:false, planShown:false,
      /* lab / labSplit: שם מ-LABS או "אחר", ואז השם המוקלד ב-labOther / labSplitOther. לשם המודפס — labName() */
      dayLetter:"A", lab:"", labOther:"", labSplit:"", labSplitOther:"", extraTests:Array(EXTRA_N).fill(""),
      notesLog:"", notesCoc:"", notesSplit:""
    },
    samples:[blankSample()], deviations:[],
    cocExtra:[], splitExtra:[],
    storage:{place:"", keeper:"", fromD:"", fromT:"", toD:"", toT:"", tempOk:""},
    /* הפיצולים נמסרים למעבדה אחרת — מסירה וקבלה נפרדות, וחתימות bySplit / labSplit */
    handover:{byName:"", byDate:"", byTime:"", labName:"", labDate:"", labTime:""},
    handoverSplit:{byName:"", byDate:"", byTime:"", labName:"", labDate:"", labTime:""},
    sigs:{s1:"", s2:"", by:"", lab:"", bySplit:"", labSplit:""},
    sketch:"", sketchPhoto:"", changes:[]
  };
}

/* משלים שדות חסרים ברשומות שנשמרו בגרסאות קודמות */
function normalize(d){
  const b=blankDay(d.id);
  const n={...b, ...d,
    head:{...b.head, ...(d.head||{})}, storage:{...b.storage, ...(d.storage||{})},
    handover:{...b.handover, ...(d.handover||{})}, handoverSplit:{...b.handoverSplit, ...(d.handoverSplit||{})},
    sigs:{...b.sigs, ...(d.sigs||{})}};
  /* שם מעבדה שהוקלד חופשי בגרסאות קודמות ואינו ברשימה — עובר ל"אחר" עם אותו שם, כך שהמודפס לא משתנה */
  for(const k of ["lab","labSplit"]){
    const v=String(n.head[k]||"").trim();
    if(v && v!==OTHER && !LABS.includes(v)){ n.head[k+"Other"]=n.head[k+"Other"]||v; n.head[k]=OTHER; }
  }
  const ex=Array.isArray(n.head.extraTests)?n.head.extraTests:[];
  n.head.extraTests=Array.from({length:EXTRA_N},(_,i)=>ex[i]||"");
  const tests=t=>(t||[]).map(x=>TEST_OLD[x]||x);
  n.samples=(d.samples||[]).map(s=>{
    const b=blankSample(), m={...b, ...s, sp:{...b.sp, ...(s.sp||{})}};
    m.tests=tests(m.tests); m.sp.tests=tests(m.sp.tests);
    return m;
  });
  if(!n.samples.length) n.samples=[blankSample()];
  for(const k of ["cocExtra","splitExtra"])
    n[k]=(Array.isArray(d[k])?d[k]:[]).map(e=>{ const m={...blankExtra(), ...e}; m.tests=tests(m.tests); return m; });
  if(!n.id) n.id="day-"+n.head.date;
  return n;
}

let S = blankDay();

let db=null, unsubDay=null, saveT=null, suppress=false, flash=null;

/* ============ change log ============
   נרשם רק שינוי של ערך קיים, אחרי שהתייצב. הזנה ראשונה לשדה ריק אינה שינוי —
   כך גם נגיעה בשדה שעת/תאריך, שבאייפד ממלאת ערך מעצמה, לא נרשמת.
   מבצע השינוי הוא תמיד דוגם 1. */
const COMMIT_MS = 3000;
const pendingChg = new Map();

function commitChange(key){
  const rec = pendingChg.get(key);
  pendingChg.delete(key);
  if(!rec) return false;
  clearTimeout(rec.timer);
  if(rec.from === "" || String(rec.from) === String(rec.to)) return false;
  S.changes.push({t:stamp(), who:S.head.s1 || "לא נבחר דוגם", label:rec.label,
                  from:String(rec.from), to:String(rec.to)});
  return true;
}
/* לפני מעבר רשומה או סגירת הדף — שינוי שטרם התייצב לא ילך לאיבוד או יירשם ברשומה הלא נכונה */
function flushChanges(){ for(const k of [...pendingChg.keys()]) commitChange(k); }

function logChange(label, from, to, key){
  if(suppress) return;
  const flat = x => Array.isArray(x) ? x.join(", ") : (x ?? "");
  const f = String(flat(from)), t = String(flat(to));
  key = key || label;
  const prev = pendingChg.get(key);
  const origin = prev ? prev.from : f;
  if(prev) clearTimeout(prev.timer);
  const timer = setTimeout(()=>{ if(commitChange(key)) save(); }, COMMIT_MS);
  pendingChg.set(key, {label, from:origin, to:t, timer});
}

function setHead(k,v,label){ logChange(label,S.head[k],v,"head."+k); S.head[k]=v; save(); }
function setSub(obj,k,v,label,key){ logChange(label,obj[k],v,key||label); obj[k]=v; save(); }
function setSample(sm,k,v,label){
  /* ערך שהועתק לשורה חדשה אינו הזנה של הדוגם — הבחירה הראשונה בו אינה שינוי */
  if(sm.auto.includes(k)) sm.auto=sm.auto.filter(x=>x!==k);
  else logChange(`${label} · ${sm.name||"דגימה חדשה"}`, sm[k], v, sm.id+"."+k);
  sm[k]=v;
  if((k==="boring"||k==="depth") && sm.nameAuto) sm.name = autoName(sm);
  save();
}
function setSplit(sm,k,v,label){
  if(sm.auto.includes("sp."+k)) sm.auto=sm.auto.filter(x=>x!=="sp."+k);
  else logChange(`פיצול — ${label} · ${sm.name||"דגימה"}`, sm.sp[k], v, sm.id+".sp."+k);
  sm.sp[k]=v; save();
}
/* שורה שנוספה במשמורת. ערכים שהועתקו לחזרה מסומנים ב-auto, כמו בשורה חדשה ביומן */
function setExtra(e,k,v,label,isSplit){
  if(e.auto.includes(k)) e.auto=e.auto.filter(x=>x!==k);
  else logChange(`${isSplit?"פיצול — ":""}${label} · ${e.name||"שורה חדשה"}`, e[k], v, e.id+"."+k);
  e[k]=v; save();
}
function setColor(sm,i,x){
  const c=[sm.color[0]||"", sm.color[1]||""]; c[i]=x;
  setSample(sm,"color",[...new Set(c.filter(Boolean))],"צבע");
}
function autoName(sm){
  const b=(sm.boring||"").trim(), d=(sm.depth||"").toString().trim();
  return b && d ? `${b}-${d}` : b || "";
}

/* ============ records — כל יום דיגום הוא רשומה נפרדת ============ */
const K_INDEX="vasa-index", K_CUR="vasa-current", K_OLD="vasa-day", kDoc=id=>"vasa-doc:"+id;
let localIdx=[], remoteIdx=new Map(), storageFull=false;

function fmtDate(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}.${m}.${y.slice(2)}`; }
function docTitle(d){
  const h=d.head||{};
  return [(h.site||"").trim()||"ללא שם אתר", fmtDate(h.date), h.dayLetter?`יום ${h.dayLetter}`:"", h.s1||""]
    .filter(Boolean).join(" · ");
}
function meta(d){
  return {id:d.id, title:docTitle(d), date:d.head.date||"", client:d.head.client||"",
    n:d.samples.filter(s=>s.boring||s.depth||s.name).length, locked:!!d.locked, updated:d.updated||""};
}
const pristine = d => !d.updated;
function readJSON(key){ try{ return JSON.parse(localStorage.getItem(key)); }catch(e){ return null; } }

function allDocs(){
  const m=new Map();
  const put=e=>{ const o=m.get(e.id); if(!o || (e.updated||"")>=(o.updated||"")) m.set(e.id,e); };
  remoteIdx.forEach(put); localIdx.forEach(put); put(meta(S));
  return [...m.values()].sort((a,b)=>(b.date||"").localeCompare(a.date||"") || (b.updated||"").localeCompare(a.updated||""));
}

/* ============ persistence ============ */
function persistLocal(){
  try{
    localStorage.setItem(kDoc(S.id), JSON.stringify(S));
    localIdx = localIdx.filter(e=>e.id!==S.id).concat([meta(S)]);
    localStorage.setItem(K_INDEX, JSON.stringify(localIdx));
    localStorage.setItem(K_CUR, S.id);
    storageFull=false;
  }catch(e){ storageFull=true; }
}
function save(){
  S.updated=stamp();
  persistLocal();
  render();
  clearTimeout(saveT);
  saveT = setTimeout(pushRemote, 700);
}
const refsFor = id => ({
  day:db.doc(`days/${id}`), sig:db.doc(`days/${id}/sig/signatures`),
  log:db.doc(`days/${id}/log/changes`), shot:db.doc(`days/${id}/shot/sketch`),
  idx:db.doc(`index/${id}`)});
async function pushRemote(){
  if(!db || pristine(S)) return;
  /* נלכד מראש — אם הדוגם עובר רשומה באמצע, הכתיבה נשארת ברשומה הנכונה */
  const r=refsFor(S.id), m=meta(S);
  const {sigs, sketch, sketchPhoto, changes, ...rest} = S;
  try{
    await r.day.set(rest);
    await r.sig.set({...sigs, sketch});
    await r.log.set({items:changes.slice(-800)});
    await r.shot.set({photo:sketchPhoto||""});
    await r.idx.set(m);
    setPill("synced");
  }catch(e){ setPill("local"); }
}

async function attachRemote(){
  if(!db) return;
  const id=S.id, r=refsFor(id);
  try{
    const [d,g,l,p]=await Promise.all([r.day.get(),r.sig.get(),r.log.get(),r.shot.get()]);
    if(S.id!==id) return;
    /* data() מוחזר מוקפא — עותק, כדי שאפשר יהיה להמשיך לערוך */
    suppress=true;
    const next={...S};
    if(d.exists) Object.assign(next, structuredClone(d.data()));
    if(g.exists){ const {sketch,...sg}=structuredClone(g.data()); next.sigs={...next.sigs,...sg}; next.sketch=sketch||""; }
    if(l.exists) next.changes=structuredClone(l.data().items||[]);
    if(p.exists) next.sketchPhoto=p.data().photo||"";
    S=normalize(next);
    suppress=false;
    if(d.exists) persistLocal();
    setPill("synced"); render();
  }catch(e){ suppress=false; setPill("local"); }
  if(S.id!==id) return;
  unsubDay=r.day.onSnapshot(s=>{
    if(!s.exists||s.metadata.hasPendingWrites||S.id!==id) return;
    suppress=true; S=normalize({...S, ...structuredClone(s.data())}); suppress=false;
    setPill("synced"); render();
  },()=>setPill("local"));
}

async function switchTo(next){
  flushChanges();
  clearTimeout(saveT);
  if(!pristine(S)){ persistLocal(); await pushRemote(); }
  if(unsubDay){ unsubDay(); unsubDay=null; }
  S=next;
  try{ localStorage.setItem(K_CUR, S.id); }catch(e){}
  active="day"; render(); window.scrollTo(0,0);
  await attachRemote();
}
async function openDoc(id){
  if(id===S.id){ active="day"; flash=null; render(); window.scrollTo(0,0); return; }
  const d=readJSON(kDoc(id));
  if(!d){
    /* רשומה שנפתחה במכשיר אחר — פותחים רק אם המאגר המשותף מחזיר אותה, כדי לא לדרוס אותה ברשומה ריקה */
    try{
      if(!db || !(await refsFor(id).day.get()).exists){ alert("הרשומה לא נמצאה במאגר המשותף."); return; }
    }catch(e){ alert("אין חיבור למאגר המשותף. נסה שוב כשיש קליטה."); return; }
  }
  flash=null;
  await switchTo(normalize(d||{id}));
}
async function newDoc(){
  if(pristine(S)){ active="day"; flash=null; render(); window.scrollTo(0,0); return; }
  const prevTitle=docTitle(S);
  await switchTo(blankDay());
  flash=`הרשומה ״${prevTitle}״ נשמרה. אפשר לחזור אליה מלשונית רשומות.`;
  render();
}

/* רשומת היום היחידה מהגרסה הקודמת הופכת לרשומה הראשונה ברשימה */
function migrateOld(){
  const old=readJSON(K_OLD);
  if(!old) return;
  try{
    const d=normalize(old);
    if(d.changes.length || d.head.site || d.samples.some(s=>s.boring||s.depth)){
      if(!d.updated) d.updated=stamp();
      if(!localStorage.getItem(kDoc(d.id))){
        localStorage.setItem(kDoc(d.id), JSON.stringify(d));
        localIdx=localIdx.filter(e=>e.id!==d.id).concat([meta(d)]);
        localStorage.setItem(K_INDEX, JSON.stringify(localIdx));
      }
      if(!localStorage.getItem(K_CUR)) localStorage.setItem(K_CUR, d.id);
    }
    localStorage.removeItem(K_OLD);
  }catch(e){}
}
function setPill(mode){
  const p=document.getElementById("syncPill");
  if(mode==="synced"){ p.textContent="מסונכרן — זמין לכל מי שבחברה"; p.className="pill live"; }
  else if(mode==="local"){ p.textContent="מקומי בלבד"; p.className="pill local"; }
  else { p.textContent="מקומי"; p.className="pill"; }
}

/* ============ derived ============ */
/* דגימות היומן שסומנו למשמורת / לפיצול */
const cocRows   = () => S.samples.filter(s=>s.toCoc);
const splitRows = () => S.samples.filter(s=>s.toSplit);
const extras    = isSplit => isSplit ? S.splitExtra : S.cocExtra;
/* כל שורות טופס 33.1, בסדר ההדפסה: הדגימות מהיומן, השורות שנוספו במשמורת,
   וכל חזרה מתחת לשורה שממנה נעשתה. חזרה שהשורה שלה ירדה מהמשמורת — בסוף.
   לכל שורה: bag — היכן נשמרים כלי הדיגום, האריזות, הסוג והאנליזות; x — השורה הנוספת, אם זו כזו */
function custodyRows(isSplit){
  const fromLog=s=>{ const b=isSplit?s.sp:s;
    return {id:s.id, src:s, x:null, bag:b, name:s.name, depth:s.depth, time:s.time, pid:s.pid,
      dayLetter:s.dayLetter, note:isSplit?b.note:s.cocNote, dup:false}; };
  const added=e=>({id:e.id, src:null, x:e, bag:e, name:e.name, depth:e.depth, time:e.time, pid:e.pid,
    dayLetter:e.dayLetter, note:e.note, dup:e.dup});
  const list=[...(isSplit?splitRows():cocRows()).map(fromLog), ...extras(isSplit).filter(e=>!e.after).map(added)];
  let wait=extras(isSplit).filter(e=>e.after), moved=true;
  while(wait.length && moved){
    moved=false;
    wait=wait.filter(e=>{
      const at=list.findIndex(r=>r.id===e.after);
      if(at<0) return true;
      let j=at+1;
      while(j<list.length && list[j].x && list[j].x.after===e.after) j++;
      list.splice(j,0,added(e)); moved=true;
      return false;
    });
  }
  return list.concat(wait.map(added));
}
const hasSplit = () => custodyRows(true).length>0;
/* חזרות ופיצולים נדרשים, לפי מספר הדגימות במשמורת (בלי החזרות עצמן) */
function qcNeeded(){
  const rows=custodyRows(false), n=rows.filter(r=>!r.dup).length;
  const dup = n===0?0:(n<10?1:Math.ceil(n/20));
  const spl = n<=9?0:Math.ceil(n*0.1);
  return {n, dup, spl, haveDup: rows.filter(r=>r.dup).length, haveSpl: custodyRows(true).filter(r=>!r.dup).length,
    /* חזרה ופיצול אינם נשלחים ל-VOC ול-TPH GRO */
    badDup: rows.filter(r=>r.dup && r.bag.tests.some(t=>/^VOC$|GRO/i.test(t.trim())))};
}
const allTests = () => TESTS.concat(S.head.extraTests.filter(x=>x && x.trim()));
/* שם המעבדה להדפסה ולקבצים. key — "lab" או "labSplit" */
const labName = key => S.head[key]===OTHER ? String(S.head[key+"Other"]||"").trim() : (S.head[key]||"");

/* ============ DOM helpers ============ */
const el=(t,a={},...kids)=>{
  const n=document.createElement(t);
  for(const[k,v] of Object.entries(a)){
    if(v===false||v==null) continue;
    if(k==="class") n.className=v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2),v);
    else n.setAttribute(k, v===true?"":v);
  }
  for(const k of kids.flat()) if(k!=null) n.append(k.nodeType?k:document.createTextNode(k));
  return n;
};
const RO = () => S.locked;
const field=(label,node,hint)=>el("div",{class:"f"},el("label",{},label),node,hint?el("span",{class:"hint"},hint):null);
function txt(val,on,opts={}){
  const i=el("input",{type:opts.type||"text", value:val||"", placeholder:opts.ph||"",
    step:opts.type==="number"?"any":null, disabled:RO()});
  if(opts.type==="time"||opts.type==="date"){
    /* באייפד גלגלת השעה/התאריך שולחת change בכל סיבוב. שמירה בכל סיבוב בונה את המסך מחדש
       וחלונית הגלגלת קופצת — לכן הערך נשמר רק כשהחלונית נסגרת */
    let dirty=false;
    i.addEventListener("change",()=>{ if(document.activeElement===i) dirty=true; else on(i.value); });
    i.addEventListener("blur",()=>{ if(dirty){ dirty=false; on(i.value); } });
  } else i.addEventListener("change",()=>on(i.value));
  return i;
}
function area(val,on){
  const a=el("textarea",{disabled:RO()});
  a.value=val||"";
  a.addEventListener("change",()=>on(a.value));
  return a;
}
function sel(val,list,on,blank="—"){
  const s=el("select",{disabled:RO()});
  s.append(el("option",{value:""},blank));
  for(const o of list) s.append(el("option",{value:o, selected:val===o},o));
  s.addEventListener("change",()=>on(s.value));
  return s;
}
function multi(vals,list,on){
  const w=el("div",{class:"chips"});
  for(const o of list){
    const isOn=vals.includes(o);
    w.append(el("button",{class:"chip",type:"button","aria-pressed":String(isOn),disabled:RO(),
      onclick:()=>on(isOn?vals.filter(x=>x!==o):[...vals,o])},o));
  }
  return w;
}
const toggle=(val,on,label)=>el("button",{class:"chip",type:"button","aria-pressed":String(!!val),disabled:RO(),onclick:()=>on(!val)},label);
/* בחירת מעבדה מהרשימה, או "אחר" ושם חופשי. אותו שדה מוצג במשמורת ובמסירה */
function labPicker(key,label,hint){

  return el("div",{class:"f"},el("label",{},label),
    sel(h[key],LABS.concat([OTHER]),x=>setHead(key,x,label)),
    h[key]===OTHER ? txt(h[ok],x=>setHead(ok,x,`${label} — שם`),{ph:"שם המעבדה"}) : null,
    hint?el("span",{class:"hint"},hint):null);

/* ============ signature pad ============ */
function pad(key,label,store){
  const c=el("canvas",{class:"sigbox"});
  const wrap=el("div",{class:"sigwrap"},
    el("label",{style:"font-size:12.5px;font-weight:700;letter-spacing:.2px;color:var(--ink-2)"},label),c,
    el("div",{},el("button",{class:"btn ghost",type:"button",disabled:RO(),onclick:()=>{
      c.getContext("2d").clearRect(0,0,c.width,c.height);
      logChange(`חתימה — ${label}`, store[key]?"חתום":"", "", "sig."+key); store[key]=""; save();
    }},"נקה")));
  requestAnimationFrame(()=>{
    const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    c.width=r.width*dpr; c.height=r.height*dpr;
    const ctx=c.getContext("2d"); ctx.scale(dpr,dpr);
    ctx.lineWidth=2.1; ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.strokeStyle=getComputedStyle(document.body).color;
    if(store[key]){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height); im.src=store[key]; }
    let drawing=false, drew=false;
    const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top];};
    c.addEventListener("pointerdown",e=>{ if(RO())return; drawing=true; drew=false; c.setPointerCapture(e.pointerId); const[x,y]=pt(e); ctx.beginPath(); ctx.moveTo(x,y); });
    c.addEventListener("pointermove",e=>{ if(!drawing)return; drew=true; const[x,y]=pt(e); ctx.lineTo(x,y); ctx.stroke(); });
    const end=()=>{ if(!drawing)return; drawing=false; if(!drew) return;
      const had=!!store[key]; store[key]=c.toDataURL("image/png");
      logChange(`חתימה — ${label}`, had?"חתום":"", "נחתם", "sig."+key); save(); };
    c.addEventListener("pointerup",end); c.addEventListener("pointercancel",end);
  });
  return wrap;
}

/* ============ sketch — draw, or photograph a paper sketch ============ */
function sketchCard(){
  const card=el("div",{class:"card"},
    el("h2",{},"שרטוט"),
    el("div",{class:"sub"},"נדרש בדיגום ערמות ובדיגום מוודא — סעיף 7ג. אפשר לשרטט כאן או לצלם שרטוט שנעשה על נייר"));

  const fileIn=el("input",{type:"file",accept:"image/*",capture:"environment",hidden:true});
  fileIn.addEventListener("change",()=>{
    const f=fileIn.files&&fileIn.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const max=1000, sc=Math.min(1,max/Math.max(im.width,im.height));
        const cv=el("canvas",{}); cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
        cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
        const had=!!S.sketchPhoto;
        S.sketchPhoto=cv.toDataURL("image/jpeg",0.6);
        logChange("צילום שרטוט", had?"קיים":"", "צולם", "sketchPhoto");
        save();
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  });

  card.append(el("div",{class:"seg"},
    el("button",{class:"btn",type:"button",disabled:RO(),onclick:()=>fileIn.click()},"צלם שרטוט מנייר"),
    S.sketchPhoto?el("button",{class:"btn ghost",type:"button",disabled:RO(),onclick:()=>{
      logChange("צילום שרטוט","קיים","","sketchPhoto"); S.sketchPhoto=""; save();
    }},"הסר צילום"):null), fileIn);

  if(S.sketchPhoto) card.append(el("img",{class:"shot",src:S.sketchPhoto,alt:"שרטוט מצולם"}));

  const c=el("canvas",{class:"sketch"});
  card.append(el("div",{class:"sub",style:"margin:14px 0 6px"},"או שרטוט על המסך:"),c,
    el("div",{class:"bar"},el("button",{class:"btn ghost",type:"button",disabled:RO(),onclick:()=>{
      c.getContext("2d").clearRect(0,0,c.width,c.height);
      logChange("שרטוט",S.sketch?"קיים":"","","sketch"); S.sketch=""; save();
    }},"נקה שרטוט")));
  requestAnimationFrame(()=>{
    const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    c.width=r.width*dpr; c.height=r.height*dpr;
    const ctx=c.getContext("2d"); ctx.scale(dpr,dpr);
    ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.strokeStyle=getComputedStyle(document.body).color;
    if(S.sketch){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height); im.src=S.sketch; }
    let d=false, drew=false;
    const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top];};
    c.addEventListener("pointerdown",e=>{ if(RO())return; d=true; drew=false; c.setPointerCapture(e.pointerId); const[x,y]=pt(e); ctx.beginPath(); ctx.moveTo(x,y); });
    c.addEventListener("pointermove",e=>{ if(!d)return; drew=true; const[x,y]=pt(e); ctx.lineTo(x,y); ctx.stroke(); });
    const end=()=>{ if(!d)return; d=false; if(!drew) return; S.sketch=c.toDataURL("image/png"); save(); };
    c.addEventListener("pointerup",end); c.addEventListener("pointercancel",end);
  });
  return card;
}

/* ============ custody — shared renderer for main and split ============ */
/* שורה שנוספה עכשיו (שורה חופשית או חזרה) — מודגשת אחרי הבנייה מחדש, כדי שהדוגם יראה אותה ויבחר אנליזות */
let freshRow="";

/* ערך בשורת משמורת: לדגימה מהיומן — לשדות שלה (במשמורת הראשית ההערה היא cocNote), ולשורה שנוספה — לשורה עצמה */
function setRow(r,k,v,label,isSplit){
  if(r.x) setExtra(r.x,k,v,label,isSplit);
  else if(isSplit) setSplit(r.src,k,v,label);
  else if(k==="note") setSample(r.src,"cocNote",v,"הערות משמורת");
  else setSample(r.src,k,v,label);
}

function addRow(isSplit){
  const e=blankExtra(); e.time=nowHM(); e.auto.push("time");
  extras(isSplit).push(e); freshRow=e.id;
  logChange(`${isSplit?"פיצול — ":""}הוספת שורה למשמורת`,"",`שורה ${custodyRows(isSplit).length}`,"add."+e.id);
  save();
}
/* חזרה: שורה חדשה מתחת לשורה שנבחרה, עם כל הנתונים שלה מלבד האנליזות, ו"חזרה" אחרי מס׳ הדגימה */
function duplicateRow(r,isSplit){
  const e=blankExtra(), b=r.bag;
  Object.assign(e,{dup:true, after:r.id, name:`${(r.name||"").trim()} חזרה`.trim(), depth:r.depth, time:r.time, pid:r.pid,
    dayLetter:r.dayLetter, tool:b.tool, packs:b.packs, stype:b.stype, note:r.note, tests:[]});
  e.auto=["name","depth","time","pid","dayLetter","tool","packs","stype","note"].filter(k=>String(e[k]??"")!=="");
  extras(isSplit).push(e); freshRow=e.id;
  logChange(`${isSplit?"פיצול — ":""}חזרה ל-${r.name||"דגימה"}`,"",e.name,"add."+e.id);
  save();
}
/* חלונית אישור בתוך האפליקציה. לא confirm() של הדפדפן: בחלק מהסביבות הוא חסום ומחזיר "ביטול" מיד,
   והפעולה נעצרת בלי שום הודעה */
function askYes(title,text,yes,onYes,danger){
  const close=()=>m.remove();
  const m=el("div",{class:"modal",role:"dialog","aria-modal":"true",onclick:e=>{ if(e.target===m) close(); }},
    el("div",{class:"card"},
      el("h2",{},title),
      el("div",{class:"sub"},text),
      el("div",{class:"bar"},
        el("button",{class:danger?"btn warnb":"btn",type:"button",onclick:()=>{ close(); onYes(); }},yes),
        el("span",{class:"spacer"}),
        el("button",{class:"btn ghost",type:"button",onclick:close},"ביטול"))));
  document.body.append(m);
}
function deleteRow(r,isSplit){
  askYes("למחוק את השורה?", `השורה ${r.name||"ללא שם"} תימחק משרשרת המשמורת. המחיקה נרשמת בתיעוד השינויים.`,
    "כן, למחוק", ()=>{
      const list=extras(isSplit), i=list.indexOf(r.x);
      if(i<0) return;
      logChange(`${isSplit?"פיצול — ":""}מחיקת שורה ממשמורת`, r.name||"שורה ללא שם", "", "del."+r.x.id);
      list.splice(i,1); save();
    }, true);
}

/* "האם לבצע חזרה?" — אחרי לחיצה ארוכה על שורה */
function askDuplicate(r,isSplit){
  askYes("האם לבצע חזרה?", `תיפתח שורה חדשה מתחת ל-${r.name||"שורה זו"}, עם ״חזרה״ בזיהוי הדגימה. `+
    "כל הנתונים מועתקים מלבד האנליזות — יש לבחור אותן לדגימת החזרה.",
    "כן, לבצע חזרה", ()=>duplicateRow(r,isSplit));
}

/* לחיצה ארוכה: 3 שניות על השורה, לא על שדה או כפתור. תזוזה של האצבע (גלילה) מבטלת */
const LONG_MS=3000;
function longPress(tr,fn){
  let t=null, x0=0, y0=0;
  const stop=()=>{ clearTimeout(t); t=null; tr.classList.remove("pressing"); };
  tr.addEventListener("pointerdown",e=>{
    if(RO() || e.button>0 || e.target.closest("input,select,button,textarea,a")) return;
    x0=e.clientX; y0=e.clientY; tr.classList.add("pressing");
    t=setTimeout(()=>{ stop(); fn(); },LONG_MS);
  });
  tr.addEventListener("pointermove",e=>{ if(t && Math.hypot(e.clientX-x0,e.clientY-y0)>12) stop(); });
  for(const ev of ["pointerup","pointercancel","pointerleave"]) tr.addEventListener(ev,stop);
  tr.addEventListener("contextmenu",e=>e.preventDefault());
}

/* ============ handover ============ */
/* שרשרת המשמורת והפיצול נמסרות לשתי מעבדות שונות — לכל אחת מסירה, קבלה וחתימות משלה.
   התוויות והמפתחות של המשמורת הראשית הם אלה מהגרסאות הקודמות, כדי שתיעוד השינויים יישאר רציף */
const HAND={
  coc:  {ho:()=>S.handover,      key:"ho.", pre:"",        by:"by",      lab:"lab",      labKey:"lab",
         labLabel:"מעבדה"},
  split:{ho:()=>S.handoverSplit, key:"hs.", pre:"פיצול — ", by:"bySplit", lab:"labSplit", labKey:"labSplit",
         labLabel:"מעבדה משנית"}};
/* הרשומה שלמה כשכל מעבדה שקיבלה דגימות חתמה ונרשם שם הנציג */
const labSigned = kind => { const H=HAND[kind]; return !!(S.sigs[H.lab] && H.ho().labName); };
const pendingLabs = () => [!labSigned("coc") && "חתימת המעבדה",
  hasSplit() && !labSigned("split") && "חתימת מעבדת הפיצול"].filter(Boolean);

/* סיום האחסון הוא ברירת המחדל למסירה ולקבלה במעבדה. שדה שמולא ידנית בערך אחר אינו נדרס */
const HAND_FROM_STORAGE={
  toD:[["byDate","תאריך מסירה"],["labDate","תאריך קבלה"]],
  toT:[["byTime","שעת מסירה"],["labTime","שעת קבלה"]]};
function storageEnd(k,v){
  const st=S.storage, old=st[k];
  setSub(st,k,v,k==="toD"?"סיום אחסון":"שעת סיום אחסון","st."+k);
  for(const kind of hasSplit()?["coc","split"]:["coc"]){
    const H=HAND[kind], ho=H.ho();
    for(const [f,label] of HAND_FROM_STORAGE[k])
      if(!ho[f] || ho[f]===old) setSub(ho,f,v,H.pre+label,H.key+f);
  }
}

/* כרטיסי מסירה וקבלה במעבדה — למשמורת (coc) או לפיצול (split) */
function handCards(kind){
  const H=HAND[kind], ho=H.ho(), split=kind==="split";
  const fld=(label,k,logLabel,opts)=>field(label,txt(ho[k],x=>setSub(ho,k,x,H.pre+logLabel,H.key+k),opts));
  return [
    el("div",{class:"card"},
      el("h2",{},split?"מסירה — משמורת פיצול":"מסירה"),
      el("div",{class:"sub"},split
        ? "הפיצולים נמסרים למעבדה המשנית בנפרד מהמשמורת"
        : "ייתכן שהמסירה תתבצע על ידי הפקידה במשרד לשליח המעבדה"),
      el("div",{class:"grid"},
        fld("נמסר ע״י","byName","נמסר ע״י",{ph:"שם מלא"}),
        fld("תאריך","byDate","תאריך מסירה",{type:"date"}),
        fld("שעה","byTime","שעת מסירה",{type:"time"})),
      el("div",{style:"margin-top:14px;max-width:420px"}, pad(H.by,split?"חתימת המוסר — פיצול":"חתימת המוסר",S.sigs))),
    el("div",{class:"card"},
      el("h2",{},split?"קבלה במעבדה — משמורת פיצול":"קבלה במעבדה"),
      el("div",{class:"sub"},split
        ? "נציג המעבדה המשנית, שאליה נשלחו הפיצולים, חותם כאן"
        : "נציג המעבדה חותם כאן — באתר או במשרד בעת איסוף הדגימות"),
      el("div",{class:"grid"},
        labPicker(H.labKey,H.labLabel),
        fld("התקבל במעבדה ע״י","labName","התקבל במעבדה ע״י",{ph:"שם נציג המעבדה"}),
        fld("תאריך","labDate","תאריך קבלה",{type:"date"}),
        fld("שעה","labTime","שעת קבלה",{type:"time"})),
      el("div",{style:"margin-top:14px;max-width:420px"},
        pad(H.lab,split?"חתימת נציג מעבדת הפיצול":"חתימת נציג המעבדה",S.sigs)))];
}

const loadImg=src=>new Promise(res=>{
  if(!src) return res(null);
  const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src;
});
/* חתימה ושרטוט נשמרים בצבע הטקסט של המסך — כאן הם נצבעים בשחור לדף הלבן */
function inked(img){
  const c=document.createElement("canvas"); c.width=img.naturalWidth; c.height=img.naturalHeight;
  const g=c.getContext("2d"); g.drawImage(img,0,0);
  g.globalCompositeOperation="source-in"; g.fillStyle="#000"; g.fillRect(0,0,c.width,c.height);
  return c;
}
function wrapText(g,text,width){
  const out=[];
  for(const para of String(text).split("\n")){
    let line="";
    for(const w of para.split(/\s+/).filter(Boolean)){
      const t=line?line+" "+w:w;
      if(!line || g.measureText(t).width<=width) line=t; else { out.push(line); line=w; }
    }
    if(line) out.push(line);
  }
  return out;
}

/* עמוד טופס ריק בגודל המקורי, וההקשר מכויל לנקודות PDF */
async function formPage(F,idx){
  const im=await loadImg(FORM_PAGES[F.key][idx]);
  if(!im) throw new Error("תבנית הטופס לא נטענה");
  const c=document.createElement("canvas"); c.width=im.naturalWidth; c.height=im.naturalHeight;
  const g=c.getContext("2d"); g.drawImage(im,0,0);
  const k=c.width/F.w; g.scale(k,k);
  g.fillStyle="#000"; g.strokeStyle="#000"; g.direction="rtl"; g.textBaseline="middle";
  return {c,g,w:F.w,h:F.h};
}
const fnt=(size,bold)=>`${bold?700:400} ${size}px ${PFONT}`;
/* כותב ערך לתיבה: מקטין עד שנכנס, ואם לא — שובר לשתי שורות */
function put(g,text,box,o={}){
  text=jv(text).trim(); if(!text) return;
  const [x0,x1,y0,y1]=box, w=x1-x0-2, h=y1-y0, min=o.min||5;
  let size=o.size||8.5, lines=[text];
  for(;;){
    g.font=fnt(size,o.bold);
    if(g.measureText(text).width<=w){ lines=[text]; break; }
    const wr=wrapText(g,text,w);
    if(wr.length*size*1.12<=h && wr.every(l=>g.measureText(l).width<=w)){ lines=wr; break; }
    if(size<=min){ lines=wr; break; }
    size=Math.max(min,size-.25);
  }
  g.save(); g.beginPath(); g.rect(x0,y0,x1-x0,h); g.clip();
  g.textAlign=o.align==="center"?"center":"right";
  const x=o.align==="center"?(x0+x1)/2:x1-1, lh=size*1.12, top=(y0+y1)/2-(lines.length-1)*lh/2;
  lines.forEach((t,i)=>g.fillText(t,x,top+i*lh));
  g.restore();
}
function whiteout(g,[x0,x1,y0,y1]){ g.save(); g.fillStyle="#fff"; g.fillRect(x0,y0,x1-x0,y1-y0); g.restore(); }
/* סימון V במרכז תיבה */
function tick(g,[x0,x1,y0,y1],s){
  const cx=(x0+x1)/2, cy=(y0+y1)/2; s=s||Math.min(x1-x0,y1-y0)*.32;
  g.save(); g.lineWidth=1.15; g.lineCap="round"; g.lineJoin="round";
  g.beginPath(); g.moveTo(cx-s,cy); g.lineTo(cx-s*.25,cy+s*.8); g.lineTo(cx+s*1.05,cy-s*.95); g.stroke();
  g.restore();
}
/* עיגול סביב מילה — כן/לא, אין/יש */
function ring(g,[x0,x1,y0,y1]){
  g.save(); g.lineWidth=.8; g.beginPath();
  g.ellipse((x0+x1)/2,(y0+y1)/2,(x1-x0)/2+2.6,(y1-y0)/2+.6,0,0,Math.PI*2); g.stroke();
  g.restore();
}
async function sign(g,src,[x0,x1,y0,y1]){
  const im=await loadImg(src); if(!im) return;
  const ink=inked(im), sc=Math.min((x1-x0-2)/ink.width,(y1-y0-1)/ink.height);
  const w=ink.width*sc, h=ink.height*sc;
  g.drawImage(ink,x1-1-w,(y0+y1)/2-h/2,w,h);
}
/* הערות זורמות לשורות הפנויות: קודם בעמוד הראשון, והיתרה בעמוד האחרון.
   מחזיר כמה מילים לא נכנסו; dry — מדידה בלבד, בלי לכתוב */
const MCTX=document.createElement("canvas").getContext("2d");
function flowNotes(slots,text,dry=false,size=7.5){
  const words=String(text||"").split(/\s+/).filter(Boolean);
  for(const {g,box:[x0,x1,y0,y1]} of slots){
    if(!words.length) break;
    const c=dry?MCTX:g;
    c.font=fnt(size); c.textAlign="right";
    let line=words.shift();
    while(words.length && c.measureText(line+" "+words[0]).width<=x1-x0-2) line+=" "+words.shift();
    if(!dry) c.fillText(line,x1-1,(y0+y1)/2);
  }
  return words.length;
}
/* כמה עמודים: לפי מספר השורות; עמוד יחיד שההערות לא נכנסות בו מקבל עמוד המשך */
function pageCount(F,rows,notes){
  const n=1+Math.ceil(Math.max(0,rows-F.per[0])/F.per[1]);
  return n===1 && flowNotes(F.notes.only.map(box=>({box})),notes,true) ? 2 : n;
}
function writeNotes(F,pages,n,notes){
  const slots = n===1 ? F.notes.only.map(box=>({g:pages[0].g,box}))
    : [...F.notes.first.map(box=>({g:pages[0].g,box})), ...F.notes.last.map(box=>({g:pages[n-1].g,box}))];
  flowNotes(slots,notes);
}
/* מספור עמודים: הסך הכול נכתב בכל עמוד; מעמוד 3 הספרה המודפסת "2" מוחלפת */
function pageMarks(F,g,p,n,start){
  put(g,String(n),F.total,{align:"center",size:12});
  if(p<2) return;
  /* תיבת הספרה צרה מרוחב הספרה, ולכן נכתבת ישירות ולא דרך put שמקטין */
  const [px0,px1,py0,py1]=F.pageNo;
  whiteout(g,F.pageNo); g.font=fnt(12); g.textAlign="center"; g.fillText(String(p+1),(px0+px1)/2,(py0+py1)/2);
  /* מספרי השורות הקטנים בשולי הטבלה */
  const [mx0,mx1]=F.marks.x;
  F.marks.ys.forEach((y,i)=>{
    whiteout(g,[mx0-.2,mx1,y+.55,y+4.4]);
    g.font=fnt(4,F.key==="33.1"); g.textAlign="right"; g.textBaseline="alphabetic";
    g.fillText(String(start+10*(i+1)),mx1,y+3.6); g.textBaseline="middle";
  });
}
const pageStart=(F,p)=>p?F.per[0]+(p-1)*F.per[1]:0;
const rowBox=(F,p,i,[x0,x1])=>{
  const [t,b]=F.rows[p?1:0], rh=(b-t)/F.per[p?1:0];
  return [x0,x1,t+i*rh+.5,t+(i+1)*rh-.5];
};

/* ---------- טופס 57 ---------- */
async function renderLog(){
  const F=F57, h=S.head, rows=S.samples, n=pageCount(F,rows.length,h.notesLog), pages=[];
  /* השרטוט הוא חלק מיומן השדה — עמוד נוסף שנספר ב"דף מתוך" */
  const sk=await loadImg(S.sketchPhoto||S.sketch), total=n+(sk?1:0);
  for(let p=0;p<n;p++){
    const pg=await formPage(F,p?1:0), g=pg.g, start=pageStart(F,p);
    pages.push(pg);
    pageMarks(F,g,p,total,start);
    if(p===0){
      const H=F.head;
      put(g,h.site,H.site); put(g,h.address,H.address); put(g,fmtFull(h.date),H.date);
      if(h.ready5556) tick(g,H.ready);
      put(g,h.rig==="אחר"?h.rigOther:h.rig,H.rig);
      put(g,h.arrive,H.arrive); put(g,h.tStart,H.tStart); put(g,h.finish,H.finish); put(g,h.tEnd,H.tEnd);
      put(g,h.s1,H.s1); await sign(g,S.sigs.s1,H.s1sig); put(g,h.s2,H.s2); await sign(g,S.sigs.s2,H.s2sig);
      put(g,h.client,H.client); put(g,h.clientRep,H.clientRep); put(g,h.pid,H.pid); put(g,h.pidOpen,H.pidOpen);
      put(g,h.weather,H.weather);

    } else {
      put(g,h.site,F.next.site,{size:9}); put(g,fmtFull(h.date),F.next.date,{size:9});
    }
    rows.slice(start,start+F.per[p?1:0]).forEach((s,i)=>{

        .forEach((v,j)=>put(g,v,rowBox(F,p,i,F.cols[j]),{size:8,align:j===10?"right":"center"}));
    });
  }
  writeNotes(F,pages,n,h.notesLog);
  if(sk) pages.push(await sketchPage(sk,n,total));
  return pages;
}

/* עמוד השרטוט: עמוד המשך של טופס 57 — כותרת, אתר ותאריך, כותרת תחתונה ומספור — והשרטוט במקום הטבלה */
async function sketchPage(im,p,total){
  const F=F57, pg=await formPage(F,1), g=pg.g;

  put(g,"שרטוט",F.sketchTitle,{size:12,bold:true});

  const [x0,x1,y0,y1]=F.sketchImg, sc=Math.min((x1-x0)/sw,(y1-y0)/sh), w=sw*sc, hh=sh*sc;
  g.drawImage(pic,x1-w,y0,w,hh); g.lineWidth=.6; g.strokeRect(x1-w,y0,w,hh);
  return pg;
}

async function renderCoc(isSplit){

    isSplit?h.notesSplit:h.notesCoc].filter(Boolean).join(" ");
  const n=pageCount(F,rows.length,notes);
  const testBox=i=>[F.testEdges[i+1]+.5,F.testEdges[i]-.5];
  for(let p=0;p<n;p++){

    /* סמליל הרשות יורד כשהעבודה אינה בהסמכה — הוראת עבודה 30001 סעיף 7ב */
    if(!h.accredited) whiteout(g,F.isrc);
    /* "סוף דו"ח" רק בסוף הטופס: בעמוד יחיד נכתב, בעמודי המשך שאינם אחרונים מולבן */
    if(n===1){ g.font=fnt(10); g.textAlign="center"; g.fillText('*** סוף דו"ח ***',(F.endMarkOnly[0]+F.endMarkOnly[1])/2,(F.endMarkOnly[2]+F.endMarkOnly[3])/2); }
    else if(p>0 && p<n-1) whiteout(g,F.endMark);
    /* שמות העמודות הפתוחות */
    const [ty0,ty1]=F.testHead[p?1:0];
    tests.slice(TESTS.length).forEach((t,i)=>{
      const [x0,x1]=testBox(TESTS.length+i);
      put(g,t,[x0,x1,ty0,ty1],{size:7.5,bold:true,align:"center",min:4.5});

    if(p===0){

      put(g,h.address,H.address); put(g,h.weather,H.weather); put(g,h.landuse,H.landuse);
      put(g,h.gwl,H.gwl); put(g,h.pid,H.pid);
      put(g,h.s1,H.s1); await sign(g,S.sigs.s1,H.s1sig); put(g,h.approver,H.approver);
      put(g,h.client,H.client); put(g,h.contact,H.contact);

      const yn=(on,[yes,no,y0,y1])=>ring(g,on?[...yes,y0,y1]:[...no,y0,y1]);
      yn(h.subDrill,F.yesNo.subDrill); yn(h.subSample,F.yesNo.subSample);
      ring(g,S.deviations.length?F.dev.some:F.dev.none);
      [h.guideSurvey,h.guidePiles,h.planApproved,h.planShown].forEach((on,i)=>{
        if(on) tick(g,[...F.boxes.x,...F.boxes.ys[i]]);
      });

      const T=F.store;
      put(g,st.place,T.place,{size:7.5}); put(g,st.keeper,T.keeper,{size:7.5});
      put(g,fmtFull(st.fromD),T.fromD,{size:7.5,align:"center"}); put(g,st.fromT,T.fromT,{size:7.5,align:"center"});
      put(g,fmtFull(st.toD),T.toD,{size:7.5,align:"center"}); put(g,st.toT,T.toT,{size:7.5,align:"center"});
      if(st.tempOk==="תקין") tick(g,T.ok); else if(st.tempOk==="לא תקין") tick(g,T.bad);

      const D=F.hand;
      put(g,ho.byName,D.byName,{size:7.5}); await sign(g,S.sigs[HK.by],D.bySig);
      put(g,fmtFull(ho.byDate),D.byDate,{size:7.5}); put(g,ho.byTime,D.byTime,{size:7.5});
      put(g,ho.labName,D.labName,{size:7.5}); await sign(g,S.sigs[HK.lab],D.labSig);
      put(g,fmtFull(ho.labDate),D.labDate,{size:7.5}); put(g,ho.labTime,D.labTime,{size:7.5});
    } else {
      put(g,h.site,F.next.site,{size:9}); put(g,lab,F.next.lab,{size:9}); put(g,fmtFull(h.date),F.next.date,{size:9});
    }
    rows.slice(start,start+F.per[p?1:0]).forEach((r,i)=>{
      const bag=r.bag, o={size:8,align:"center"};
      const cells=[r.name,r.depth,r.time,TOOL_CODE[bag.tool]||bag.tool,bag.packs,STYPE_CODE[bag.stype]||bag.stype];
      cells.forEach((v,j)=>put(g,v,rowBox(F,p,i,F.cols[j]),o));
      tests.forEach((t,j)=>{ if(bag.tests.includes(t)) tick(g,rowBox(F,p,i,testBox(j)),3.4); });
      put(g,r.pid,rowBox(F,p,i,F.pid),o);
      put(g,r.note,rowBox(F,p,i,F.note),{size:7.5});
    });
  }
  writeNotes(F,pages,n,notes);
  return pages;
}

async function canvasJpeg(c){
  const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.9));
  return new Uint8Array(await b.arrayBuffer());
}
/* PDF מינימלי: עמוד לכל תמונה, התמונה (JPEG) ממלאת את הדף. pages: [{jpeg,w,h,px,py}] */
function pdfFromJpegs(pages){
  const enc=new TextEncoder(), parts=[], offs=[];
  let len=0;
  const put=x=>{ const b=typeof x==="string"?enc.encode(x):x; parts.push(b); len+=b.length; };
  const obj=(num,body)=>{ offs[num]=len; put(`${num} 0 obj\n`); body(); put("\nendobj\n"); };
  const n=pages.length, total=3+3*n;
  put("%PDF-1.4\n%âãÏÓ\n");
  obj(1,()=>put("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2,()=>put(`<< /Type /Pages /Count ${n} /Kids [${pages.map((_,i)=>`${3+3*i} 0 R`).join(" ")}] >>`));
  pages.forEach((pg,i)=>{
    const p=3+3*i, cs=`q ${pg.w} 0 0 ${pg.h} 0 0 cm /Im0 Do Q`;
    obj(p,()=>put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pg.w} ${pg.h}] /Resources << /XObject << /Im0 ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`));
    obj(p+1,()=>put(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(p+2,()=>{
      put(`<< /Type /XObject /Subtype /Image /Width ${pg.px} /Height ${pg.py} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.jpeg.length} >>\nstream\n`);
      put(pg.jpeg); put("\nendstream");
    });
  });
  const xref=len;
  let x=`xref\n0 ${total}\n0000000000 65535 f \n`;
  for(let i=1;i<total;i++) x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  put(x+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:"application/pdf"});
}
/* יוצר את קובץ ה-PDF של טופס — משמש גם לבדיקה מחוץ לממשק */
async function buildPdf(kind){
  if(document.fonts) await document.fonts.ready;
  const pages=kind==="log"?await renderLog():await renderCoc(kind==="split"), out=[];
  for(const pg of pages) out.push({jpeg:await canvasJpeg(pg.c),w:pg.w,h:pg.h,px:pg.c.width,py:pg.c.height});
  return pdfFromJpegs(out);
}

let pdfBusy=false;
async function makePdf(kind){
  if(pdfBusy) return;
  pdfBusy=true;
  try{
    await offerFile(await buildPdf(kind), fileName(kind)+".pdf");
  }catch(e){ alert("יצירת ה-PDF נכשלה: "+((e&&e.message)||e)); }
  finally{ pdfBusy=false; }
}

/* ============ Excel ללקוח ============
   קובץ אחד ליום דיגום: פרטי היום, יומן שדה, שרשרת משמורת, ומשמורת פיצול כשיש.
   טבלאות נקיות — שורת כותרת ושורה לכל דגימה — שהיועץ מעתיק לדוחות שלו.
   נבנה כאן בלי ספריות, כדי לעבוד גם בלי קליטה: XML של Office בתוך zip לא דחוס */
const XLSX_MIME="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
const CRC_T=(()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; }
  return t; })();

/* zip בשיטת stored. התאריך הקבוע 01.01.1980 הוא המינימום בפורמט */
function zipBlob(files,type){
  const enc=new TextEncoder(), parts=[], cen=[];
  let off=0;
  for(const f of files){
    const name=enc.encode(f.name), data=enc.encode(f.data), crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true);
    h.setUint16(12,0x21,true); h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true);
    h.setUint16(26,name.length,true);
    parts.push(h,name,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true);
    c.setUint16(14,0x21,true); c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true);
    c.setUint16(28,name.length,true); c.setUint32(42,off,true);
    cen.push(c,name);
    off+=30+name.length+data.length;
  }
  const size=cen.reduce((a,x)=>a+x.byteLength,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true);
  e.setUint32(12,size,true); e.setUint32(16,off,true);
  return new Blob([...parts,...cen,e],{type});
}

const xesc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))
  .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");

const xnum=v=>{ const t=jv(v).trim(); return /^-?\d+(\.\d+)?$/.test(t) ? Number(t) : t; };

   בגיליון מימין לשמאל, יישור "לימין" מציב טקסט בימין אבל מספר בשמאל — לכן למספר יישור אוטומטי */

  if(typeof v==="number") return `<c r="${ref}" s="${s===XS.cell?XS.num:s}"><v>${v}</v></c>`;
  return `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;

/* גיליון: rows — מערכי תאים, styles(r,c) — מספר סגנון. table — שורת כותרת קפואה וסינון.

const TOOL_WORD={"ליינר":"שרוול","שרוול":"שרוול","צנצנת":"צנצנת"};
/* טבלת דגימות: הכותרות כמו בטופס, המספרים ממורכזים.

function tableSheet(name,head,rows,widths,wide,totals){
  const filterRows=1+rows.length;
  return {name,widths,table:true,filterRows,rows:totals?[head,...rows,[],totals]:[head,...rows],
    styles:(r,c)=>r===0?XS.head:(r>filterRows?XS.total:(wide.has(c)?XS.cell:XS.mid))};
}
function workbookSheets(){
  const h=S.head, st=S.storage, yn=x=>x?"כן":"לא";
  const when=(d,t)=>[fmtFull(d),t].filter(Boolean).join(" ");
  const split=hasSplit();
  /* מסירה וקבלה — למשמורת, ולפיצול כשיש (מעבדה אחרת) */
  const hand=kind=>{ const H=HAND[kind], ho=H.ho(), pre=kind==="split"?"פיצול — ":"";
    return [[pre+"נמסר ע״י",[ho.byName,when(ho.byDate,ho.byTime)].filter(Boolean).join(" · ")],
            [pre+"התקבל במעבדה ע״י",[ho.labName,when(ho.labDate,ho.labTime)].filter(Boolean).join(" · ")]]; };
  const dev=S.deviations.map((d,i)=>`${i+1}. ${[d.what,d.why,d.who&&`אישר: ${d.who}`].filter(Boolean).join(" — ")}`).join("\n");

    ["שעת הגעה",h.arrive],["שעת סיום",h.finish],["טמפ׳ תחילת הדיגום (°C)",xnum(h.tStart)],["טמפ׳ סוף הדיגום (°C)",xnum(h.tEnd)],
    ["מזג האוויר",jv(h.weather)],["יעוד הקרקע",h.landuse],["מפלס מי תהום משוער (מ׳)",xnum(h.gwl)],
    ["עבודה בהסמכה",yn(h.accredited)],["מעבדה",labName("lab")],
    ...(split?[["מעבדה משנית (פיצול)",labName("labSplit")]]:[]),
    ["קידוח ע״י קבלן משנה",yn(h.subDrill)],["דיגום ע״י קבלן משנה",yn(h.subSample)],
    ["חריגות",dev||"אין"],
    ["אחסון לפני מסירה",st.place?`${st.place}, אחראי: ${st.keeper||""} · ${when(st.fromD,st.fromT)} עד ${when(st.toD,st.toT)} · ${st.tempOk||""}`:""],
    ...hand("coc"), ...(split?hand("split"):[]),
    ["הערות — יומן שדה",h.notesLog],["הערות — שרשרת משמורת",h.notesCoc],
    ...(split?[["הערות — משמורת פיצול",h.notesSplit]]:[])
  ].map(([k,v])=>[k,v==null?"":v]);
  const sheets=[{name:"פרטי יום הדיגום",widths:[28,70],rows:details,table:false,
    styles:(r,c)=>c===0?XS.label:XS.cell}];

  sheets.push(tableSheet("יומן שדה",
    ["מס׳ קידוח","מס׳ דגימה","עומק (מטר)","שעה","סוג קרקע (חתך ליתולוגי)","צבע","ריח","לחות","ערך PID (ppm)","PID 20%","הערות"],
    S.samples.filter(s=>s.boring||s.name||s.depth).map(s=>
      [s.boring,s.name,xnum(s.depth),s.time,jv(s.soil),jv(s.color),s.odour,s.moist,xnum(s.pid),xnum(s.pid20),s.note]),
    [10,14,10,8,22,14,7,8,12,10,30], new Set([4,10])));

  const tests=allTests();
  /* שורת סה״כ: כמות אנליזות מכל סוג מתחת לעמודה שלה, והסך הכול בעמודת ההערות */
  const coc=(name,rows)=>{
    const bag=r=>r.bag, per=tests.map(t=>rows.filter(r=>bag(r).tests.includes(t)).length);

}

/* מסירת הקובץ: אין דרך אחת שעובדת בכל מקום, ולכן כמה אפשרויות.
   שיתוף חייב לרוץ ישירות מלחיצה — לכן הוא בכפתור נפרד ולא מיד אחרי היצירה */
async function offerFile(blob, filename){
  const url=URL.createObjectURL(blob);
  const file=typeof File==="function" ? new File([blob],filename,{type:blob.type}) : null;
  let canShare=false;
  try{ canShare=!!(file && navigator.canShare && navigator.canShare({files:[file]})); }catch(e){}
  const dl=await useCap("downloads");
  const close=()=>{ m.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000); };
  const m=el("div",{class:"modal",role:"dialog","aria-modal":"true",onclick:e=>{ if(e.target===m) close(); }},
    el("div",{class:"card"},
      el("h2",{},"הקובץ מוכן"),
      el("div",{class:"sub mono",style:"overflow-wrap:anywhere"},showName(filename)),
      el("div",{class:"bar"},
        canShare?el("button",{class:"btn",type:"button",
          onclick:()=>navigator.share({files:[file],title:filename}).catch(()=>{})},"שיתוף / שמירה בקבצים"):null,
        dl?el("button",{class:"btn ghost",type:"button",onclick:()=>dl.save({filename,data:blob}).catch(()=>{})},"שמירה"):null,
        el("a",{class:"btn ghost",href:url,download:filename},"הורדה"),
        el("a",{class:"btn ghost",href:url,target:"_blank",rel:"noopener"},"פתיחה")),
      el("div",{class:"sub",style:"margin:12px 0 0"},"אם כפתור אחד לא מגיב באפליקציה שבה הטופס פתוח, נסה את האחר."),
      el("div",{class:"bar"},el("span",{class:"spacer"}),el("button",{class:"btn ghost",type:"button",onclick:close},"סגירה"))));
  document.body.append(m);
}

/* ============ שליחה במייל ============
   דף אינטרנט לא יכול לצרף קובץ למייל בעצמו. גיליון השיתוף של המכשיר (navigator.share) כן:
   בוחרים בו Mail או Outlook, והמייל נפתח עם הקבצים וגוף ההודעה. הנמען נבחר במייל עצמו.
   שני שלבים, כמו ב-offerFile: יצירת הקבצים לוקחת זמן, והשיתוף חייב לרוץ ישירות מלחיצה.
   בלי תמיכה בשיתוף קבצים (למשל Firefox במחשב): הורדת כל קובץ, ומייל שנפתח עם הנושא והגוף */
const MAIL_KINDS=[

/* הנושא חוזר גם בראש הגוף — לא בכל מכשיר הנושא עובר מגיליון השיתוף למייל */
function mailText(names){
  const h=S.head, site=(h.site||"").trim()||"ללא שם אתר";

  const counts=[`${meta(S).n} ביומן השדה`, `${nc} למשמורת`, ns?`${ns} לפיצול`:""].filter(Boolean).join(", ");
  const facts=[["אתר",site],["כתובת",h.address],["תאריך",fmtFull(h.date)],["לקוח",h.client],
    ["דוגמים",[h.s1,h.s2].filter(Boolean).join(", ")],["דגימות",counts]]
    .filter(([,v])=>v&&String(v).trim()).map(([k,v])=>`${k}: ${v}`);
  const body=["שלום,","",`מצורפים מסמכי יום הדיגום — ${site}, ${fmtFull(h.date)}.`,"",...facts,
    "","קבצים מצורפים:",...names.map(n=>`• ${showName(n)}`),
    "","בברכה,",...[h.s1,"וזה אקולוגיה בע״מ","www.vasa-eco.co.il"].filter(Boolean)].join("\n");
  return {subject, body};

function mailDialog(){
  const opts=MAIL_KINDS.filter(o=>!o.when||o.when());
  const pick=new Set(opts.filter(o=>o.def()).map(o=>o.kind));
  let state="pick", ready=null, urls=[];
  const close=()=>{ m.remove(); const u=urls; setTimeout(()=>u.forEach(x=>URL.revokeObjectURL(x)),60000); };
  const card=el("div",{class:"card"});
  const m=el("div",{class:"modal",role:"dialog","aria-modal":"true",onclick:e=>{ if(e.target===m && state!=="busy") close(); }},card);

  async function prepare(){
    state="busy"; draw();
    try{
      const files=[];
      for(const o of opts) if(pick.has(o.kind)) files.push(await mailFile(o.kind));
      ready={files, ...mailText(files.map(f=>f.name))};
      state="ready";
    }catch(e){ alert("יצירת הקבצים נכשלה: "+((e&&e.message)||e)); state="pick"; }
    draw();
  }
  function shareData(){
    return {files:ready.files.map(f=>typeof File==="function"?new File([f.blob],f.name,{type:f.blob.type}):null),
      title:ready.subject, text:ready.body};
  }
  function canShareFiles(){
    try{ const d=shareData(); return !!(navigator.canShare && d.files.every(Boolean) && navigator.canShare({files:d.files})); }
    catch(e){ return false; }
  }
  async function share(){
    try{ await navigator.share(shareData()); close(); }
    catch(e){ if(e && e.name!=="AbortError") alert("פתיחת המייל נכשלה: "+((e&&e.message)||e)); }
  }
  const mailto=()=>`mailto:?subject=${encodeURIComponent(ready.subject)}&body=${encodeURIComponent(ready.body.replace(/\n/g,"\r\n"))}`;

  function draw(){
    card.textContent="";
    card.append(el("h2",{},"שליחה במייל"));
    if(state!=="ready"){
      card.append(el("div",{class:"sub"},"בחר את הקבצים לצירוף למייל"),
        el("div",{class:"picks"},...opts.map(o=>el("button",{class:"chip",type:"button",
          "aria-pressed":String(pick.has(o.kind)),disabled:state==="busy",
          onclick:()=>{ pick.has(o.kind)?pick.delete(o.kind):pick.add(o.kind); draw(); }},
          el("span",{class:"ck","aria-hidden":"true"},pick.has(o.kind)?"✓":""),o.label))),
        el("div",{class:"bar"},
          el("button",{class:"btn",type:"button",disabled:state==="busy"||!pick.size,onclick:prepare},
            state==="busy"?"מכין את הקבצים…":"הכנת המייל"),
          el("span",{class:"spacer"}),
          el("button",{class:"btn ghost",type:"button",disabled:state==="busy",onclick:close},"ביטול")));
      return;
    }
    const native=canShareFiles();
    urls.forEach(x=>URL.revokeObjectURL(x));
    urls=native?[]:ready.files.map(f=>URL.createObjectURL(f.blob));
    card.append(
      el("div",{class:"sub"},native
        ? "בלחיצה על ״פתיחת המייל״ נפתח חלון השיתוף. בחר בו Mail או Outlook — המייל ייפתח עם הקבצים המצורפים. את הנמען בוחרים במייל"
        : "המכשיר הזה לא מאפשר לצרף קבצים למייל אוטומטית. הורד את הקבצים, פתח את המייל וצרף אותם אליו"),
      el("ul",{class:"files"},...ready.files.map((f,i)=>el("li",{},
        el("span",{class:"mono"},showName(f.name)),
        native?null:el("a",{class:"btn ghost sm",href:urls[i],download:f.name},"הורדה")))),
      el("div",{class:"f",style:"margin-top:12px"},el("label",{},"נושא"),el("div",{class:"mono",style:"overflow-wrap:anywhere"},ready.subject)),
      el("div",{class:"mailbody"},ready.body),
      el("div",{class:"bar"},
        native
          ? el("button",{class:"btn",type:"button",onclick:share},"פתיחת המייל")
          : el("a",{class:"btn",href:mailto(),style:"text-decoration:none;display:inline-flex;align-items:center"},"פתיחת המייל"),
        el("button",{class:"btn ghost",type:"button",onclick:()=>{ state="pick"; ready=null; draw(); }},"שינוי הבחירה"),
        el("span",{class:"spacer"}),
        el("button",{class:"btn ghost",type:"button",onclick:close},"סגירה")));
  }
  draw();
  document.body.append(m);
}

/* ============ records list ============ */
function viewDocs(){
  const docs=allDocs(), onDevice=new Set(localIdx.map(e=>e.id));
  const when=iso=>new Date(iso).toLocaleString("he-IL",{dateStyle:"short",timeStyle:"short"});
  const list=el("ul",{class:"docs"});
  for(const d of docs){
    const cur=d.id===S.id;
    list.append(el("li",{},el("button",{type:"button",class:"docrow"+(cur?" cur":""),
        "aria-current":cur?"true":null, onclick:()=>openDoc(d.id)},
      el("span",{class:"dt"},d.title),
      el("span",{class:"dm"},[d.client, `${d.n||0} דגימות`, d.updated?`עודכן ${when(d.updated)}`:"טרם נשמרה"]
        .filter(Boolean).join(" · ")),
      el("span",{class:"tags"},
        cur?el("span",{class:"pill live"},"פתוחה כעת"):null,
        d.locked?el("span",{class:"pill lock"},"נעולה"):null,
        !cur&&!onDevice.has(d.id)?el("span",{class:"pill"},"במאגר המשותף"):null))));
  }
  return el("div",{},el("div",{class:"card"},
    el("h2",{},"רשומות"),
    el("div",{class:"sub"},(db?"ימי הדיגום במכשיר הזה ובמאגר המשותף. ":"ימי הדיגום שנשמרו במכשיר הזה. ")+
      "שם הרשומה נבנה מהאתר, התאריך, אות היום ודוגם 1"),
    el("div",{class:"bar",style:"margin:0 0 14px"},
      el("button",{class:"btn",type:"button",onclick:newDoc},"שמירה ורשומה חדשה"),
      el("span",{class:"spacer"}),
      el("span",{class:"pill"},`${docs.length} רשומות`)),
    list));
}

/* ============ shell ============ */
const TABS=[
  {id:"docs", label:"רשומות", view:viewDocs, count:()=>allDocs().length},
  {id:"day", label:"יום דיגום", view:viewDay, count:()=>null},
  {id:"log", label:"יומן שדה", view:viewLog, count:()=>S.samples.length},
  {id:"coc", label:"שרשרת משמורת", view:()=>custodyView("coc"), count:()=>custodyRows(false).length},
  {id:"spl", label:"משמורת פיצול", view:()=>custodyView("split"), count:()=>custodyRows(true).length},
  {id:"hand",label:"מסירה וקבצים", view:viewHand, count:()=>null},
  {id:"hist",label:"תיעוד שינויים", view:viewHist, count:()=>S.changes.length},
];
let active="day";

/* בנייה מחדש בזמן שגלגלת שעה/תאריך פתוחה מחליפה את השדה מתחתיה והחלונית קופצת
   (למשל כששינוי קודם נרשם בתיעוד אחרי 3 שניות). הבנייה נדחית עד שהחלונית נסגרת */
let renderWaiting=false;
function render(){
  const a=document.activeElement;
  if(a && a.matches && a.matches("main input[type=time], main input[type=date]")){
    if(!renderWaiting){ renderWaiting=true; a.addEventListener("blur",()=>{ renderWaiting=false; render(); },{once:true}); }
    return;
  }
  const nav=document.getElementById("tabs");
  nav.textContent="";
  for(const t of TABS){
    const c=t.count();
    nav.append(el("button",{role:"tab","aria-selected":String(active===t.id),
      onclick:()=>{active=t.id; flash=null; render(); window.scrollTo(0,0);}},
      t.label, c!=null?el("span",{class:"n"},String(c)):null));
  }
  for(const t of TABS){
    const s=document.getElementById("v-"+t.id);
    s.hidden = active!==t.id;
    if(!s.hidden){
      s.textContent="";
      if(flash) s.append(el("div",{class:"note",style:"margin-bottom:14px"},flash));
      s.append(t.view());
    }
  }
  const bar=document.getElementById("docbar");
  bar.textContent="";
  bar.append(
    el("button",{class:"doccur",type:"button",title:"לכל הרשומות",onclick:()=>{active="docs"; flash=null; render();}},
      "רשומה: ",el("b",{},docTitle(S))),
    el("span",{class:"spacer"}),
    el("button",{class:"btn ghost sm",type:"button",onclick:newDoc},"שמירה ורשומה חדשה"));
  document.getElementById("lockPill").hidden=!S.locked;
  document.getElementById("fullPill").hidden=!storageFull;
}

function persistNow(){ flushChanges(); if(!pristine(S)){ S.updated=stamp(); persistLocal(); } }
addEventListener("pagehide",persistNow);

/* ============ אפליקציה מותקנת — עבודה בלי קליטה, עדכונים, התקנה ============
   sw.js שומר את האפליקציה במכשיר: היא נפתחת מהמטמון מיד, ובודקת ברקע אם יש גרסה חדשה.
   כשהדף נפתח מקובץ (file://) אין service worker — הכול עובד, רק בלי מטמון ובלי עדכונים */
const K_HINT="vasa-install-hint";
const standalone=()=>matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
const appleTouch=()=>/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);

function installHint(){
  const box=document.getElementById("installHint");
  let off=false; try{ off=localStorage.getItem(K_HINT)==="off"; }catch(e){}
  if(off || standalone() || !appleTouch() || !/^https:$/.test(location.protocol)){ box.hidden=true; return; }
  box.textContent="";
  box.append(el("div",{class:"note install"},
    el("span",{},el("b",{},"להתקנה במסך הבית: "),
      "לחץ על כפתור השיתוף של Safari ובחר ״הוספה למסך הבית״. האפליקציה תיפתח מהסמל ותעבוד גם בלי קליטה. ",
      el("b",{},"כדאי להתקין לפני שמתחילים לעבוד"),
      " — רשומות שנשמרו כאן בדפדפן אינן עוברות לאפליקציה המותקנת."),
    el("button",{class:"btn ghost sm",type:"button",onclick:()=>{
      try{ localStorage.setItem(K_HINT,"off"); }catch(e){} box.hidden=true; }},"הבנתי")));
  box.hidden=false;
}

function setupApp(){
  const upd=document.getElementById("updPill"), inst=document.getElementById("installPill");
  upd.onclick=()=>{ persistNow(); location.reload(); };
  if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    const sw=navigator.serviceWorker;
    sw.onmessage=e=>{ if(e.data && e.data.type==="update-ready") upd.hidden=false; };
    /* בפתיחה, וגם כשחוזרים לאפליקציה — באייפד אפליקציה מותקנת בדרך כלל ממשיכה ולא נטענת מחדש */
    const check=()=>{ if(sw.controller) sw.controller.postMessage({type:"check-update"}); };
    sw.register("sw.js").then(check).catch(()=>{});
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") check(); });
  }
  /* מבקש מהדפדפן לא למחוק את הרשומות כשהמכשיר מתמלא */
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  /* מחשב (Chrome / Edge): כפתור התקנה. באייפד אין אירוע כזה — שם מופיעה ההנחיה */
  let deferred=null;
  addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferred=e; inst.hidden=false; });
  addEventListener("appinstalled",()=>{ deferred=null; inst.hidden=true; });
  inst.onclick=async()=>{ if(!deferred) return; deferred.prompt(); try{ await deferred.userChoice; }catch(e){} deferred=null; inst.hidden=true; };
  installHint();
}

(async function init(){
  setupApp();
  localIdx=readJSON(K_INDEX)||[];
  migrateOld();
  let cur=null; try{ cur=localStorage.getItem(K_CUR); }catch(e){}
  const d=cur?readJSON(kDoc(cur)):null;
  S = d ? normalize(d) : blankDay();
  render();

  db=await useCap("db");
  if(db){
    db.collection("index").onSnapshot(q=>{
      remoteIdx=new Map(q.docs.filter(x=>x.exists).map(x=>[x.id,x.data()]));
      if(active==="docs") render();
    },()=>{});
    await attachRemote();
  } else setPill("local");
})();
</script>
